<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL</title>
    <!-- Google Fonts: Syncopate & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: radial-gradient(circle at center, #050508 0%, #000000 70%);
            perspective: 1200px;
            overflow: hidden;
            padding: 40px 0;
        }

        /* === 2. 漆黒の背景とダークな星雲 === */
        .deep-space-bg {
            position: absolute;
            inset: -20%;
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(10, 10, 20, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 70%, rgba(20, 20, 35, 0.4) 0%, transparent 50%);
            opacity: 0.5;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
        }

        /* 微細な星々 */
        .stars-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background-image: 
                radial-gradient(1px 1px at 30px 60px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 150px 200px, rgba(253,224,71,0.5), transparent),
                radial-gradient(1.2px 1.2px at 280px 110px, rgba(255,255,255,0.6), transparent);
            background-size: 250px 250px;
            opacity: 0.6;
        }

        /* === 3. 惑星（シルエット・天体）の追加 === */
        .planet {
            position: absolute;
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
        }

        /* 巨大なメイン惑星（右奥） */
        .planet-main {
            top: 15%;
            right: 10%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle at 30% 30%, #08080c 0%, #000000 70%);
            /* コアからの逆光によるエッジの極細ゴールド/ホワイトの光輪 */
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.9), 0 0 15px rgba(253, 224, 71, 0.15), 0 0 3px rgba(255, 255, 255, 0.3);
        }

        /* 小さな衛星（左下） */
        .planet-sub {
            bottom: 12%;
            left: 12%;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 70% 70%, #050508 0%, #000000 80%);
            box-shadow: inset 10px 10px 20px rgba(0,0,0,0.9), 0 0 10px rgba(56, 189, 248, 0.15);
        }

        /* === 1. ヘッダー：極細・超広間隔のタイトル === */
        .header-area {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 10px;
        }

        .game-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 100;
            letter-spacing: 0.65em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 0 0 30px rgba(253, 224, 71, 0.2);
            padding-left: 0.65em; /* letter-spacing分のズレ相殺 */
        }

        /* === 中央：神聖な太陽の魔法陣コア === */
        .magic-circle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            margin: -300px 0 0 -300px;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .sun-core {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 15px #ffffff,
                0 0 35px #ffffff,
                0 0 70px #fef08a,
                0 0 120px #f59e0b,
                0 0 180px rgba(245, 158, 11, 0.6);
            z-index: 10;
            animation: corePulse 4s ease-in-out infinite alternate;
        }

        @keyframes corePulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            100% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 20px #fff); }
        }

        .inner-rune-ring {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px solid rgba(253, 224, 71, 0.6);
            border-radius: 50%;
            z-index: 9;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.3);
            animation: rotateClockwise 30s linear infinite;
        }

        .inner-rune-ring::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(253,224,71,0.2) 0deg 15deg, transparent 15deg 30deg);
        }

        .sun-spikes-layer {
            position: absolute;
            inset: 0;
            z-index: 8;
            animation: rotateCounter 50s linear infinite;
        }

        .spike {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2.5px;
            height: 290px;
            background: linear-gradient(to top, transparent, rgba(255,255,255,0.8), #fde047, transparent);
            transform-origin: top center;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        .spike:nth-child(n) { transform: rotate(calc(n * 15deg)) translateY(-50%); }

        .outer-sigil-system {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            z-index: 7;
            animation: rotateClockwise 60s linear infinite;
        }

        .sigil-wing {
            position: absolute;
            inset: 10px;
            border: 1.5px solid rgba(245, 158, 11, 0.5);
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.25), inset 0 0 20px rgba(245, 158, 11, 0.25);
        }

        .sigil-wing::before {
            content: '';
            position: absolute;
            inset: -35px;
            border: 1px solid rgba(253, 224, 71, 0.35);
            border-radius: 60% 40% 50% 50% / 40% 60% 50% 50%;
            transform: rotate(25deg);
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* === 4. フッター：極限までミニマルなPLAYボタン === */
        .footer-area {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 25px;
        }

        .play-btn {
            font-family: 'Syncopate', sans-serif;
            position: relative;
            display: inline-block;
            padding: 14px 45px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.5em;
            color: #ffffff;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            animation: btnPulse 3s ease-in-out infinite alternate;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-left: calc(45px + 0.5em); /* letter-spacingのバランス調整 */
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(253, 224, 71, 0.8);
            box-shadow: 0 0 25px rgba(253, 224, 71, 0.4), inset 0 0 10px rgba(253, 224, 71, 0.2);
            letter-spacing: 0.6em;
            transform: translateY(-2px);
        }

        @keyframes btnPulse {
            0% {
                border-color: rgba(255, 255, 255, 0.2);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
            }
            100% {
                border-color: rgba(253, 224, 71, 0.6);
                box-shadow: 0 0 20px rgba(253, 224, 71, 0.25);
            }
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- 漆黒の背景＆星々 -->
        <div class="deep-space-bg"></div>
        <div class="stars-layer"></div>

        <!-- 惑星（シルエット・逆光エッジ発光） -->
        <div class="planet planet-main"></div>
        <div class="planet planet-sub"></div>

        <!-- ヘッダー：極細タイトル -->
        <header class="header-area">
            <h1 class="game-title">ASTRAL</h1>
        </header>

        <!-- 神聖な太陽の魔法陣コア -->
        <div class="magic-circle-container">
            <div class="outer-sigil-system">
                <div class="sigil-wing"></div>
            </div>
            <div class="sun-spikes-layer">
                <div class="spike" style="transform: rotate(0deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(24deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(48deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(72deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(96deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(120deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(144deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(168deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(192deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(216deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(240deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(264deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(288deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(312deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(336deg) translateY(-50%);"></div>
            </div>
            <div class="inner-rune-ring"></div>
            <div class="sun-core"></div>
        </div>

        <!-- フッター：ミニマルPLAYボタン -->
        <footer class="footer-area">
            <button class="play-btn">PLAY</button>
        </footer>
    </div>

</body>
</html>
