<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LULLABY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #000;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        #ui-layer>* {
            pointer-events: auto;
        }
        .screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.8s ease;
        }
        .screen.active {
            display: flex !important;
            opacity: 1;
        }
        .screen.hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none !important;
        }
        .screen>* {
            pointer-events: auto;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flex-col {
            flex-direction: column;
        }
        .absolute {
            position: absolute;
        }
        .relative {
            position: relative;
        }
        .w-full {
            width: 100%;
        }
        .h-full {
            height: 100%;
        }
        .text-white {
            color: #fff;
        }
        .text-black {
            color: #000;
        }
        .text-silver {
            color: #e5e5e5;
        }
        .border-white {
            border-color: rgba(255, 255, 255, 0.3);
        }
        .border-black {
            border-color: rgba(0, 0, 0, 0.3);
        }
        .glow-white {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        .glow-cyan {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-thin {
            font-weight: 100;
        }
        .font-light {
            font-weight: 300;
        }
        .font-regular {
            font-weight: 400;
        }
        .font-bold {
            font-weight: 700;
        }
        .tracking-wide {
            letter-spacing: 0.4em;
        }
        .tracking-wider {
            letter-spacing: 1.2em;
        }
        .btn-reset {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Cinzel', serif;
        }
        .btn-reset:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .circle-btn {
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            transition: all 0.4s ease;
            position: relative;
        }
        .circle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .circle-btn.dark {
            border-color: rgba(0, 0, 0, 0.3);
            color: #000;
        }
        .circle-btn.dark:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.8);
        }
        .circle-btn.glow-hover:hover {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
        }
        .diamond-btn {
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            font-family: 'Cinzel', serif;
            transition: all 0.4s ease;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .diamond-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .diamond-btn.dark {
            border-color: rgba(0, 0, 0, 0.3);
            color: #000;
        }
        .diamond-btn.dark:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.8);
        }
        .rotate-anim {
            animation: rotate 8s linear infinite;
        }
        .rotate-reverse {
            animation: rotate-reverse 6s linear infinite;
        }
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes rotate-reverse {
            from {
                transform: rotate(360deg);
            }
            to {
                transform: rotate(0deg);
            }
        }
        @keyframes pulse-glow {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-up {
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-down {
            animation: slideDown 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes slideDown {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(100%);
            }
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .ripple-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        .ripple {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            transform: translate(-50%, -50%) scale(0);
            animation: rippleAnim 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: translate(-50%, -50%) scale(6);
                opacity: 0;
            }
        }
        #warning-screen {
            background: #000;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
        }
        #warning-screen p {
            color: #fff;
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: clamp(12px, 2vw, 20px);
            letter-spacing: 0.2em;
            line-height: 2;
            text-align: center;
            max-width: 700px;
            opacity: 0;
            animation: fadeInText 2s ease 0.5s forwards;
        }
        @keyframes fadeInText {
            to {
                opacity: 1;
            }
        }
        #title-screen {
            background: #0a0a12;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        #title-screen.active {
            display: flex !important;
        }
        #title-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #title-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #title-logo {
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: clamp(5rem, 10vw, 12rem);
            color: #fff;
            letter-spacing: 1.2em;
            text-shadow: 0 0 80px rgba(255, 255, 255, 0.15), 0 0 160px rgba(255, 255, 255, 0.05);
            position: relative;
            transition: letter-spacing 2s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 60px;
            z-index: 3;
        }
        #title-logo.anim {
            letter-spacing: 0.4em;
        }
        #title-logo::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }
        #play-btn {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            font-family: 'Cinzel', serif;
            font-weight: 300;
            font-size: 22px;
            letter-spacing: 0.3em;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.02);
        }
        #play-btn .ring {
            position: absolute;
            width: 155px;
            height: 155px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.5);
            border-right-color: rgba(255, 255, 255, 0.15);
            animation: spin-ring 4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #play-btn .ring::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-bottom-color: rgba(255, 255, 255, 0.2);
            border-left-color: rgba(255, 255, 255, 0.05);
            animation: spin-ring 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite reverse;
        }
        @keyframes spin-ring {
            to {
                transform: rotate(360deg);
            }
        }
        #play-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.2), inset 0 0 80px rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }
        #play-btn:hover .ring {
            animation-duration: 0.8s;
            border-top-color: rgba(255, 255, 255, 0.9);
            border-right-color: rgba(255, 255, 255, 0.5);
        }
        #play-btn:hover .ring::before {
            animation-duration: 0.6s;
            border-bottom-color: rgba(255, 255, 255, 0.6);
            border-left-color: rgba(255, 255, 255, 0.3);
        }
        #play-btn:active {
            transform: scale(0.95);
        }
        #play-btn .btn-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        #play-btn:hover .btn-glow {
            opacity: 1;
        }
        /* Register Screen */
        #register-screen {
            background: #ffffff;
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }
        #register-screen.active {
            display: flex !important;
        }
        #register-screen .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }
        #register-screen .gear-l {
            position: absolute;
            bottom: 60px;
            left: 60px;
            width: 80px;
            height: 80px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.3;
        }
        #register-screen .gear-r {
            position: absolute;
            bottom: 60px;
            right: 60px;
            width: 80px;
            height: 80px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.3;
            animation: rotate-reverse 8s linear infinite;
        }
        .gear-l {
            animation: rotate 8s linear infinite;
        }
        #register-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 500px;
            width: 90%;
        }
        #register-content .holo-text {
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: clamp(14px, 2vw, 24px);
            color: #000;
            letter-spacing: 0.2em;
            text-align: center;
            opacity: 0.7;
        }
        #register-content .load-bar {
            width: 100%;
            height: 2px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        #register-content .load-bar .fill {
            height: 100%;
            width: 0%;
            background: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transition: width 0.1s linear;
            border-radius: 2px;
        }
        #register-content .input-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #register-content .input-area.show {
            opacity: 1;
        }
        #register-content .input-area input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            padding: 10px 0;
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: 18px;
            color: #000;
            width: 80%;
            text-align: center;
            outline: none;
            letter-spacing: 0.2em;
        }
        #register-content .input-area input::placeholder {
            color: rgba(0, 0, 0, 0.2);
            font-weight: 100;
        }
        #register-content .input-area .reg-btn {
            padding: 12px 40px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background: transparent;
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 0.3em;
            cursor: pointer;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transition: all 0.4s ease;
        }
        #register-content .input-area .reg-btn:hover {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        /* Main Screen */
        #main-screen {
            background: #f5f5f5;
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        #main-screen.active {
            display: flex !important;
        }
        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #main-ui {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        #main-ui .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 20px;
        }
        #main-ui .top-bar .left-group {
            display: flex;
            gap: 12px;
        }
        #main-ui .top-bar .left-group .diamond-btn {
            width: 44px;
            height: 44px;
            font-size: 16px;
            color: #000;
            border-color: rgba(0, 0, 0, 0.15);
        }
        #main-ui .top-bar .left-group .diamond-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.4);
        }
        #main-ui .top-bar .coin-display {
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: 14px;
            color: #000;
            letter-spacing: 0.2em;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        #main-ui .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #main-ui .roll-group {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #main-ui .roll-group .circle-btn {
            width: 80px;
            height: 80px;
            font-size: 12px;
            letter-spacing: 0.15em;
            border-color: rgba(0, 0, 0, 0.15);
            color: #000;
            font-weight: 300;
        }
        #main-ui .roll-group .circle-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.4);
        }
        #main-ui .roll-group .circle-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        #main-ui .result-display {
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: clamp(16px, 3vw, 36px);
            color: #000;
            letter-spacing: 0.3em;
            text-align: center;
            min-height: 60px;
            margin: 10px 0;
            opacity: 0.8;
        }
        #main-ui .bottom-tray-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: transparent;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        #main-ui .bottom-tray-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.3);
        }
        #main-ui .bottom-tray {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 30px 20px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            z-index: 4;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.05);
        }
        #main-ui .bottom-tray.open {
            transform: translateY(0);
        }
        #main-ui .bottom-tray .tray-btn {
            padding: 10px 20px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: transparent;
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: 11px;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #main-ui .bottom-tray .tray-btn:hover {
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.2);
        }
        #main-ui .goto-other {
            position: absolute;
            bottom: 100px;
            right: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: transparent;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 100;
            font-size: 10px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.4s ease;
            z-index: 3;
            gap: 4px;
        }
        #main-ui .goto-other:hover {
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
        }
        #main-ui .goto-other i {
            font-size: 28px;
        }
        #other-side-screen {
            background: #f0ece6;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }
        #other-side-screen.active {
            display: flex !important;
        }
        #other-side-screen .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 30% 40%, rgba(200, 180, 160, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 70% 60%, rgba(180, 160, 140, 0.05) 0%, transparent 50%);
            z-index: 0;
        }
        #other-side-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 40px;
        }
        #other-side-content .circle-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 700px;
            width: 100%;
            padding: 20px;
        }
        #other-side-content .circle-menu .menu-btn {
