<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Black Hole Art</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #090912 0%, #020205 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 微細な星空レイヤー（box-shadowによる多重ドット配置） */
    .starfield {
      position: absolute;
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow: 
        150vw 20vh #fff, 40vw 80vh rgba(255,255,255,0.8), 
        80vw 10vh rgba(135,206,250,0.9), 10vw 50vh #fff,
        120vw 90vh rgba(255,255,255,0.7), 30vw 20vh rgba(255,255,255,0.5),
        90vw 70vh #fff, 60vw 30vh rgba(135,206,250,0.8),
        -20vw 40vh #fff, -80vw 10vh rgba(255,255,255,0.6),
        -50vw 80vh rgba(135,206,250,0.7), -110vw 30vh #fff;
      animation: twinkle 5s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* アートのメインコンテナ（3D空間） */
    .black-hole-art {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    /* 1. 垂直のエネルギー・ジェット（::before と ::after で斜め上に伸びる光の柱を表現） */
    .black-hole-art::before,
    .black-hole-art::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 450px;
      background: linear-gradient(to top, 
        transparent 0%, 
        rgba(255, 140, 0, 0.2) 30%, 
        rgba(255, 255, 255, 0.9) 48%, 
        #ffffff 50%, 
        rgba(255, 255, 255, 0.9) 52%, 
        rgba(135, 206, 250, 0.7) 70%, 
        transparent 100%
      );
      filter: blur(6px);
      mix-blend-mode: screen;
      z-index: 5;
    }

    /* 斜め上・下へのジェットの角度とスケール調整 */
    .black-hole-art::before {
      transform: rotate(35deg) scaleY(1.2);
    }
    .black-hole-art::after {
      transform: rotate(35deg) scaleY(0.9) scaleX(0.7);
      background: linear-gradient(to top, 
        transparent 10%, 
        rgba(255, 69, 0, 0.4) 40%, 
        rgba(255, 255, 255, 0.8) 50%, 
        rgba(135, 206, 250, 0.8) 60%, 
        transparent 90%
      );
      filter: blur(10px);
    }

    /* 2. 降着円盤（銀河風の渦・3D回転楕円体） */
    .accretion-disk {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      /* 複数の円錐・放射状グラデーションとブラーによるモヤモヤ感 */
      background: 
        conic-gradient(from 0deg at 50% 50%, 
          rgba(0,0,0,0) 0%, 
          rgba(135, 206, 250, 0.7) 20%, 
          rgba(255, 255, 255, 0.9) 35%, 
          rgba(255, 140, 0, 0.8) 50%, 
          rgba(255, 69, 0, 0.5) 75%, 
          rgba(0,0,0,0) 100%
        ),
        radial-gradient(circle, 
          rgba(255,255,255,1) 0%, 
          rgba(255, 165, 0, 0.9) 25%, 
          rgba(30, 144, 255, 0.4) 55%, 
          transparent 75%
        );
      transform: rotateX(65deg) rotateZ(-35deg);
      transform-style: preserve-3d;
      filter: blur(8px) contrast(150%);
      box-shadow: 0 0 60px rgba(255, 140, 0, 0.6), inset 0 0 60px rgba(135, 206, 250, 0.5);
      animation: disk-spin 12s linear infinite;
      z-index: 2;
    }

    @keyframes disk-spin {
      0% { transform: rotateX(65deg) rotateZ(-35deg) rotate(0deg); }
      100% { transform: rotateX(65deg) rotateZ(-35deg) rotate(360deg); }
    }

    /* 3. 中央のブラックホール（事象の地平線と回り込む光の影） */
    .event-horizon {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #000000;
      box-shadow: 
        0 0 30px 10px rgba(255, 255, 255, 0.8),
        0 0 60px 25px rgba(255, 140, 0, 0.9),
        0 0 100px 40px rgba(30, 144, 255, 0.5),
        inset 0 0 20px 5px rgba(255, 165, 0, 0.8);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="starfield"></div>

  <div class="black-hole-art">
    <div class="accretion-disk"></div>
    <div class="event-horizon"></div>
  </div>

</body>
</html>
