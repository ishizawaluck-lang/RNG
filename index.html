<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LULLABY</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@100;400;600&display=swap" rel="stylesheet">
<style>
/* =========================================
   1. CORE DESIGN (PURE BLACK & PLATINUM GOLD)
========================================= */
:root {
    --bg-pure: #000000;
    --gold: #ffd700;
    --white: #ffffff;
    --ease-ultra: cubic-bezier(0.25, 1, 0.5, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-pure); color: var(--white); font-family: 'Cinzel', serif; }

/* 共通 UI コンポーネント (座布団廃止・極細ひし形・平行四辺形) */
.ui-panel {
    background: var(--bg-pure);
    border: 1px solid var(--gold);
    clip-path: polygon(15px 0%, calc(100% - 15px) 0%, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 15px 100%, 0% calc(100% - 15px), 0% 15px);
    padding: 20px;
    box-shadow: inset 0 0 15px rgba(255,215,0,0.1);
}
.btn-diamond {
    background: var(--bg-pure);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 0.2em;
    padding: 12px 30px;
    cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    transition: all 0.4s var(--ease-ultra);
    position: relative;
}
.btn-diamond:hover:not(:disabled) {
    background: var(--gold); color: var(--bg-pure); box-shadow: 0 0 20px var(--gold); transform: scale(1.05);
}
.btn-diamond:disabled { border-color: #333; color: #555; cursor: not-allowed; box-shadow: none; }

/* 全画面コンテナ群 */
.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 0.8s var(--ease-ultra); z-index: 10; display: flex; flex-direction: column;}
.screen.active { opacity: 1; pointer-events: auto; }
canvas#bg-canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }

/* =========================================
   2. TITLE SCREEN (LULLABY)
========================================= */
#title-screen {
    background: radial-gradient(circle at 70% 30%, #1c1c30 0%, #0a0a12 60%, var(--bg-pure) 100%);
    justify-content: flex-start; align-items: flex-end; padding: 12vh 8vw; z-index: 100;
    flex-direction: row-reverse;
}
.cloud-layer {
    position: absolute; bottom: -20%; left: -10%; width: 120%; height: 80%;
    background: radial-gradient(ellipse at 50% 80%, rgba(255, 255, 255, 0.15) 0%, transparent 60%); filter: blur(40px);
    animation: cloudFloat 20s ease-in-out infinite alternate; pointer-events: none; z-index: 2;
}
.god-rays-container {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(20deg, rgba(255,215,0,0.08) 0%, transparent 30%);
    mix-blend-mode: screen; z-index: 3; pointer-events: none;
}
.title-group { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; }
h1.game-title {
    font-weight: 100; font-size: clamp(3rem, 6vw, 6rem); color: var(--white);
    letter-spacing: 1.2em; margin-right: -1.2em; text-shadow: 0 0 25px rgba(255,255,255,0.7), 0 0 50px rgba(255,215,0,0.4);
    transition: letter-spacing 1.8s var(--ease-ultra), margin-right 1.8s var(--ease-ultra);
}
h1.game-title.loaded { letter-spacing: 0.4em; margin-right: -0.4em; }
#play-btn-wrapper { margin-top: 40px; opacity: 0; transform: translateY(20px); transition: all 1.2s var(--ease-ultra) 0.8s; }
#play-btn-wrapper.active { opacity: 1; transform: translateY(0); }

/* =========================================
   3. COSMOS (GACHA) SCREEN
========================================= */
#cosmos-ui { z-index: 20; position: absolute; width: 100%; height: 100%; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.cosmos-top, .cosmos-bottom { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
#roll-btn { font-size: 24px; padding: 20px 60px; clip-path: polygon(20px 0, 100% 0, calc(100% - 20px) 100%, 0 100%); }
.corner-info { font-size: 14px; color: var(--gold); letter-spacing: 2px; }
#result-display { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 25; pointer-events: none; }
.aura-name { font-size: 48px; letter-spacing: 10px; opacity: 0; transition: opacity 0.5s var(--ease-ultra); text-transform: uppercase; }
.aura-name.show { opacity: 1; }

/* =========================================
   4. CUTSCENE & TRANSITION OVERLAYS
========================================= */
#global-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; display: flex; justify-content: center; align-items: center; }

/* 魔法陣ローディング */
#magic-loader { position: absolute; bottom: 50px; right: 50px; display: flex; align-items: center; gap: 20px; opacity: 0; transition: opacity 1s; }
#magic-loader.active { opacity: 1; }
.white-magic-circle { width: 45px; height: 45px; border: 1px solid rgba(255,255,255,0.2); border-top: 2px solid #fff; border-bottom: 2px solid #fff; border-radius: 50%; position: relative; animation: spin 1.5s linear infinite; }
.white-magic-circle::before { content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border: 1px solid var(--gold); transform: rotate(45deg); }
@keyframes spin { to { transform: rotate(360deg); } }

/* 確率カウンター・カットシーン群 */
#cutscene-container { position: absolute; width: 100%; height: 100%; opacity: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9000;}
#prob-counter { font-size: 60px; font-weight: 100; letter-spacing: 5px; color: var(--white); text-shadow: 0 0 10px var(--white); opacity: 0; transform: scale(0.8); transition: all 0.2s; }
#prob-counter.active { opacity: 1; transform: scale(1); }
#glass-break { position: absolute; width: 100%; height: 100%; background: var(--white); opacity: 0; pointer-events: none; mix-blend-mode: difference;}
.crack-line { position: absolute; background: var(--bg-pure); transform-origin: 50% 50%; }

/* 最終結果ホログラムフレーム */
#hologram-frame {
    position: absolute; border: 1px solid var(--gold); padding: 40px 100px;
    clip-path: polygon(30px 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
    opacity: 0; transform: scale(1.5) rotate(-2deg); transition: all 0.8s var(--ease-ultra);
    box-shadow: inset 0 0 40px rgba(255,215,0,0.3), 0 0 50px rgba(255,215,0,0.5);
    background: rgba(0,0,0,0.9);
}
#hologram-frame.show { opacity: 1; transform: scale(1) rotate(0deg); }
#hologram-text { font-size: 50px; letter-spacing: 12px; text-shadow: 0 0 20px var(--gold); color: var(--gold); text-transform: uppercase; }

/* 画面歪み・グリッチエフェクト（CSS分岐用） */
.effect-monochrome { filter: grayscale(100%) contrast(200%) invert(100%); }
.effect-glitch { animation: glitch 0.2s infinite; }
.effect-neon-void { background: var(--gold) !important; color: var(--bg-pure) !important; mix-blend-mode: normal !important; }
@keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-5px, 5px) } 40% { transform: translate(-5px, -5px) } 60% { transform: translate(5px, 5px) } 80% { transform: translate(5px, -5px) } 100% { transform: translate(0) } }

/* =========================================
   5. GUILD & SUB-SCREENS
========================================= */
.guild-nav { position: absolute; top: 40px; left: 40px; display: flex; gap: 20px; z-index: 30; pointer-events: auto;}
.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 120px 40px 40px; overflow-y: auto; height: 100%; pointer-events: auto;}
.item-card { border: 1px solid var(--gold); padding: 15px; text-align: center; cursor: pointer; transition: 0.3s var(--ease-ultra); clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.item-card:hover { background: rgba(255,215,0,0.1); transform: translateY(-5px); }
.popup-ui { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); opacity: 0; pointer-events: none; z-index: 1000; width: 60%; height: 60%; transition: all 0.4s var(--ease-ultra); }
.popup-ui.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
</style>
</head>
<body>

<!-- Canvas for Stars & Particles -->
<canvas id="bg-canvas"></canvas>

<!-- Title Screen -->
<div id="title-screen" class="screen active">
    <div class="cloud-layer"></div><div class="god-rays-container"></div>
    <div class="title-group">
        <h1 class="game-title" id="main-title">LULLABY</h1>
        <div id="play-btn-wrapper">
            <button class="btn-diamond" onclick="startGame()">PLAY</button>
        </div>
    </div>
</div>

<!-- Cosmos Screen -->
<div id="cosmos-screen" class="screen">
    <div id="cosmos-ui">
        <div class="cosmos-top">
            <div class="corner-info ui-panel">GOLD: <span id="gold-val">0</span></div>
            <button class="btn-diamond" onclick="gotoLocation('guild-screen', true)">Go to Other Side</button>
        </div>
        <div class="cosmos-bottom">
            <div class="corner-info ui-panel">BUFF: <span id="buff-val">NONE</span></div>
            <button id="roll-btn" class="btn-diamond" onclick="rollGacha()">ROLL</button>
            <div class="corner-info ui-panel">LUCK: <span id="luck-val">x1.0</span></div>
        </div>
    </div>
    <div id="result-display">
        <div id="aura-text" class="aura-name"></div>
    </div>
</div>

<!-- Guild Screen -->
<div id="guild-screen" class="screen">
    <div class="guild-nav">
        <button class="btn-diamond" onclick="gotoLocation('cosmos-screen', false)">Return to Cosmos</button>
        <button class="btn-diamond" onclick="gotoLocation('shop-screen', false)">SHOP</button>
        <button class="btn-diamond" onclick="gotoLocation('craft-screen', false)">CRAFT</button>
        <button class="btn-diamond" onclick="gotoLocation('mission-screen', false)">MISSION</button>
        <button class="btn-diamond" onclick="gotoLocation('library-screen', false)">LIBRARY</button>
    </div>
    <div style="position: absolute; bottom: 40px; right: 40px;" class="corner-info ui-panel">GUILD ALLEY</div>
</div>

<!-- Shop Screen -->
<div id="shop-screen" class="screen">
    <div class="guild-nav"><button class="btn-diamond" onclick="gotoLocation('guild-screen', false)">Back</button><div class="corner-info ui-panel" style="margin-left:20px;">SHOP (10 Potions)</div></div>
    <div class="grid-container" id="shop-grid"></div>
</div>

<!-- Craft Screen -->
<div id="craft-screen" class="screen">
    <div class="guild-nav"><button class="btn-diamond" onclick="gotoLocation('guild-screen', false)">Back</button><div class="corner-info ui-panel" style="margin-left:20px;">CRAFT (Gauntlet & Rune)</div></div>
    <div class="grid-container" id="craft-grid">
        <div class="item-card ui-panel" onclick="equipItem('gauntlet', 'Iron Gauntlet')">Iron Gauntlet (Slot 1)</div>
        <div class="item-card ui-panel" onclick="equipItem('rune', 'Fire Rune')">Fire Rune (Slot 2)</div>
    </div>
    <div style="position:absolute; bottom:40px; left:40px;" class="corner-info ui-panel">EQUIP: <span id="eq-gauntlet">None</span> | <span id="eq-rune">None</span></div>
</div>

<!-- Mission Screen -->
<div id="mission-screen" class="screen">
    <div class="guild-nav"><button class="btn-diamond" onclick="gotoLocation('guild-screen', false)">Back</button><div class="corner-info ui-panel" style="margin-left:20px;">MISSION</div></div>
    <div class="grid-container"><div class="item-card ui-panel">Bounty: Goblin King</div></div>
</div>

<!-- Library Screen -->
<div id="library-screen" class="screen">
    <div class="guild-nav"><button class="btn-diamond" onclick="gotoLocation('guild-screen', false)">Back</button><div class="corner-info ui-panel" style="margin-left:20px;">LIBRARY (Codex)</div></div>
    <div class="grid-container" id="library-grid"></div>
</div>

<!-- Popup UI for Library -->
<div id="library-popup" class="ui-panel popup-ui">
    <h2 id="popup-title" style="color:var(--gold); margin-bottom: 20px;">TITLE</h2>
    <p id="popup-desc" style="margin-bottom: 40px; font-size:14px; letter-spacing:1px;"></p>
    <button class="btn-diamond" id="btn-see-cutscene">SEE CUTSCENE</button>
    <button class="btn-diamond" onclick="closePopups()">CLOSE</button>
</div>

<!-- Global Overlays -->
<div id="global-overlay">
    <div id="magic-loader">
        <div class="white-magic-circle"></div><span style="letter-spacing:4px; font-size:14px;">Loading...</span>
    </div>
    <div id="cutscene-container">
        <div id="prob-counter">1 / 0</div>
        <div id="hologram-frame"><div id="hologram-text"></div></div>
    </div>
    <div id="glass-break"></div>
</div>

<script>
/** =========================================================================
 *  DATABASE: 51 Auras / Items 
 *  (Rarity scales exponentially. 22~51 trigger Cutscenes)
 *======================================================================== */
const AURA_DATA = [];
const rarityNames = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Mythic", "Divine", "Transcendent", "Absolute"];
for(let i=1; i<=51; i++) {
    let name = i === 51 ? "memorial overreached" : `Aura Fragment #${i}`;
    let baseProb = Math.floor(Math.pow(1.3, i) * 10); // 10 to ~5,000,000,000
    let isCutscene = i >= 22;
    AURA_DATA.push({ id: i, name: name, prob: baseProb, isCutscene: isCutscene });
}

// 30 distinct cutscene flavors logic
function getCutsceneFlavor(id) {
    if(id < 22) return { effect: '', pColor: '#ffd700' };
    if(id === 51) return { effect: 'effect-neon-void', pColor: '#000000', special: 'organ' };
    
    // Procedurally generate 29 flavors for 22-50
    const flavors = ['effect-monochrome', 'effect-glitch', ''];
    const pColors = ['#ffd700', '#ffffff', '#ff3333', '#33aaff', '#cc33ff'];
    return {
        effect: flavors[id % flavors.length],
        pColor: pColors[id % pColors.length]
    };
}

/** =========================================================================
 *  AUDIO SYSTEM (Web Audio API)
 *======================================================================== */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = new AudioContext();

function playTone(freq, type, duration, vol=0.1) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function playEquipSound() { playTone(800, 'square', 0.1, 0.05); setTimeout(()=>playTone(1200, 'square', 0.2, 0.05), 50); }
function playGlassBreak() { playTone(200, 'sawtooth', 0.5, 0.3); playTone(8000, 'square', 0.2, 0.2); }
function playHeartbeat() { playTone(50, 'sine', 0.3, 0.5); setTimeout(()=>playTone(60, 'sine', 0.4, 0.5), 200); }
function playPipeOrgan() { // For #51
    const chord = [261.63, 329.63, 392.00, 523.25]; // C E G C
    chord.forEach(f => { playTone(f, 'sawtooth', 4.0, 0.2); playTone(f*2, 'sine', 4.0, 0.1); });
}

/** =========================================================================
 *  CANVAS PARTICLES & BG ENGINE
 *======================================================================== */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let cw, ch;
let particles = [];
let isTimeStopped = false;
let animFrame;

function resize() { cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

class Particle {
    constructor(x, y, isBurst=false, pColor='#fff') {
        this.x = x || Math.random()*cw; this.y = y || Math.random()*ch;
        this.z = Math.random()*cw; 
        this.color = pColor;
        this.vx = isBurst ? (Math.random()-0.5)*20 : 0;
        this.vy = isBurst ? (Math.random()-0.5)*20 : 0;
        this.isBurst = isBurst;
        this.life = 1.0;
    }
    update() {
        if(isTimeStopped) return;
        if(this.isBurst) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.95; this.vy *= 0.95; // friction
            this.life -= 0.01;
        } else {
            this.z -= 2; if(this.z <= 0) { this.z = cw; this.x = Math.random()*cw; this.y = Math.random()*ch; }
        }
    }
    draw() {
        if(this.life <= 0) return;
        ctx.fillStyle = this.color;
        if(this.isBurst) {
            ctx.globalAlpha = this.life;
            ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
        } else {
            let sx = (this.x - cw/2) * (cw/this.z) + cw/2;
            let sy = (this.y - ch/2) * (cw/this.z) + ch/2;
            let r = (1 - this.z/cw) * 2;
            ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
        }
    }
}
for(let i=0; i<400; i++) particles.push(new Particle());

function loop() {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, cw, ch);
    particles.forEach(p => { p.update(); p.draw(); });
    animFrame = requestAnimationFrame(loop);
}
loop();

function triggerImplosion(pColor) {
    // Blast
    particles = [];
    for(let i=0; i<2000; i++) particles.push(new Particle(cw/2, ch/2, true, pColor));
    
    // Suck in after 1s
    setTimeout(() => {
        particles.forEach(p => {
            p.vx = (cw/2 - p.x) * 0.1;
            p.vy = (ch/2 - p.y) * 0.1;
        });
    }, 1000);
}

/** =========================================================================
 *  GAME STATE & LOGIC
 *======================================================================== */
let luckMult = 1.0;
let isRolling = false;
let equipSlots = { gauntlet: null, rune: null };

function startGame() {
    document.getElementById('title-screen').style.opacity = '0';
    document.getElementById('magic-loader').classList.add('active');
    setTimeout(() => {
        document.getElementById('title-screen').classList.remove('active');
        document.getElementById('magic-loader').classList.remove('active');
        document.getElementById('cosmos-screen').classList.add('active');
        document.getElementById('main-title').classList.add('loaded'); // Animation setup
    }, 3000);
}

// 画面遷移と確実なUIクリーンアップ
function gotoLocation(targetId, useMagicCircle) {
    closePopups(); // 強制クリーンアップ
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    
    if(useMagicCircle) {
        document.getElementById('magic-loader').classList.add('active');
        document.getElementById('cosmos-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('magic-loader').classList.remove('active');
            document.getElementById(targetId).classList.add('active');
            document.getElementById('cosmos-screen').style.opacity = '';
        }, 3000);
    } else {
        // Normal fast transition
        document.getElementById('bg-canvas').style.transition = 'transform 0.5s';
        document.getElementById('bg-canvas').style.transform = 'scale(0.1)';
        setTimeout(() => {
            document.getElementById('bg-canvas').style.transform = 'scale(1)';
            document.getElementById(targetId).classList.add('active');
        }, 500);
    }
}

function closePopups() {
    document.querySelectorAll('.popup-ui').forEach(p => p.classList.remove('active'));
}

function equipItem(slot, name) {
    equipSlots[slot] = name;
    document.getElementById(`eq-${slot}`).innerText = name;
    playEquipSound();
}

/** =========================================================================
 *  GACHA & CUTSCENE LOGIC (The Core Requirement)
 *======================================================================== */
function rollGacha() {
    if(isRolling) return;
    isRolling = true;
    document.getElementById('roll-btn').disabled = true;

    // Weighted Random
    let totalWeight = AURA_DATA.reduce((sum, item) => sum + (1 / (item.prob / luckMult)), 0);
    let rand = Math.random() * totalWeight;
    let selected = AURA_DATA[0];
    for(let item of AURA_DATA) {
        rand -= (1 / (item.prob / luckMult));
        if(rand <= 0) { selected = item; break; }
    }

    if(selected.isCutscene) {
        executeCutscene(selected);
    } else {
        // Normal fast display
        let txt = document.getElementById('aura-text');
        txt.innerText = selected.name;
        txt.classList.add('show');
        playTone(600, 'sine', 0.2);
        setTimeout(() => {
            txt.classList.remove('show');
            isRolling = false;
            document.getElementById('roll-btn').disabled = false;
        }, 1500);
    }
}

function executeCutscene(item) {
    const flavor = getCutsceneFlavor(item.id);
    const container = document.getElementById('cutscene-container');
    const counter = document.getElementById('prob-counter');
    const glass = document.getElementById('glass-break');
    const holoFrame = document.getElementById('hologram-frame');
    const holoText = document.getElementById('hologram-text');

    // 1. 世界静止と完全な静寂
    isTimeStopped = true;
    playHeartbeat();
    container.style.opacity = '1';
    
    // 2. 爆速確率カウントアップ
    counter.classList.add('active');
    let targetProb = item.prob;
    let currentProb = 0;
    let duration = 2000;
    let startTime = performance.now();

    function updateCounter(time) {
        let elapsed = time - startTime;
        let progress = Math.min(elapsed / duration, 1);
        // Exponential ease
        let ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
        currentProb = Math.floor(ease * targetProb);
        counter.innerText = `1 / ${currentProb.toLocaleString()}`;
        
        if(progress < 1) {
            requestAnimationFrame(updateCounter);
        } else {
            // 3. ブレイクスルーと画面の亀裂
            counter.classList.remove('active');
            glass.style.opacity = '1';
            playGlassBreak();
            if(flavor.special === 'organ') playPipeOrgan();
            document.body.classList.add(flavor.effect); // Apply flavor CSS

            // 4. 粒子集束（インプロージョン）
            isTimeStopped = false; // resume canvas for explosion
            triggerImplosion(flavor.pColor);

            setTimeout(() => {
                glass.style.opacity = '0';
                holoText.innerText = item.name;
                holoFrame.classList.add('show');
                
                setTimeout(() => {
                    // Cleanup and end cutscene
                    holoFrame.classList.remove('show');
                    container.style.opacity = '0';
                    document.body.classList.remove(flavor.effect);
                    particles = [];
                    for(let i=0; i<400; i++) particles.push(new Particle()); // Reset stars
                    isRolling = false;
                    document.getElementById('roll-btn').disabled = false;
                }, 4000);
            }, 1200); // Wait for implosion suck-in
        }
    }
    requestAnimationFrame(updateCounter);
}

/** =========================================================================
 *  INIT UI BUILDERS
 *======================================================================== */
window.onload = () => {
    // Init Title Screen Animation
    setTimeout(() => {
        document.getElementById('main-title').classList.add('loaded');
        document.getElementById('play-btn-wrapper').classList.add('active');
    }, 100);

    // Build Shop
    const shopGrid = document.getElementById('shop-grid');
    for(let i=1; i<=10; i++) {
        let div = document.createElement('div');
        div.className = 'item-card ui-panel';
        div.innerHTML = `Luck Potion T${i}<br><span style="font-size:12px;color:var(--gold);">x${1 + i*0.5} (60s)</span>`;
        div.onclick = () => { luckMult = 1 + i*0.5; document.getElementById('luck-val').innerText = `x${luckMult}`; playTone(1000,'sine',0.1); };
        shopGrid.appendChild(div);
    }

    // Build Library (Codex)
    const libGrid = document.getElementById('library-grid');
    AURA_DATA.forEach(item => {
        let div = document.createElement('div');
        div.className = 'item-card ui-panel';
        div.innerText = item.name;
        div.onclick = () => {
            document.getElementById('popup-title').innerText = item.name;
            document.getElementById('popup-desc').innerText = `True Probability: 1 / ${item.prob.toLocaleString()}`;
            let btn = document.getElementById('btn-see-cutscene');
            if(item.isCutscene) {
                btn.style.display = 'inline-block';
                btn.onclick = () => { closePopups(); executeCutscene(item); };
            } else {
                btn.style.display = 'none';
            }
            document.getElementById('library-popup').classList.add('active');
        };
        libGrid.appendChild(div);
    });
};
</script>
</body>
</html>
