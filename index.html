<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL - COSMIC ROULETTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030307;
            --gold-primary: #f3e5ab;
            --gold-secondary: #c5a059;
            --gold-glow: rgba(243, 229, 171, 0.4);
            --text-main: #e2e8f0;
            --font-cinzel: 'Cinzel', serif;
            --font-rajdhani: 'Rajdhani', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-rajdhani);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas Layers */
        #bg-canvas, #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        #fx-canvas { z-index: 3; }

        /* App Container */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }

        /* --- INTRO SCREEN --- */
        #intro-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .intro-title {
            font-family: var(--font-cinzel);
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 1.5em;
            color: var(--gold-primary);
            text-shadow: 0 0 30px var(--gold-glow);
            margin-bottom: 20px;
            animation: titleIntro 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(1.1);
        }

        @keyframes titleIntro {
            0% { opacity: 0; letter-spacing: 2.5em; transform: scale(1.2); filter: blur(10px); }
            100% { opacity: 1; letter-spacing: 1.2em; transform: scale(1); filter: blur(0); }
        }

        .intro-sub {
            font-size: 1.1rem;
            letter-spacing: 0.5em;
            color: var(--gold-secondary);
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 1.5s 1s forwards;
        }

        .play-btn {
            position: relative;
            background: transparent;
            border: 1px solid var(--gold-secondary);
            color: var(--gold-primary);
            font-family: var(--font-cinzel);
            font-size: 1.2rem;
            letter-spacing: 0.4em;
            padding: 16px 50px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            animation: fadeIn 1.5s 1.5s forwards;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(243,229,171,0.2), transparent);
            transition: 0.5s;
        }

        .play-btn:hover {
            background: rgba(197, 160, 89, 0.15);
            box-shadow: 0 0 25px var(--gold-glow);
            border-color: var(--gold-primary);
            letter-spacing: 0.5em;
        }

        .play-btn:hover::before { left: 100%; }

        /* Loading View */
        #loading-view {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(197,160,89,0.2);
            border-top-color: var(--gold-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-family: var(--font-cinzel);
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            color: var(--gold-secondary);
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* --- MAIN GAME UI --- */
        #main-game {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 5;
        }

        header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding-bottom: 15px;
        }

        .logo {
            font-family: var(--font-cinzel);
            font-size: 1.5rem;
            letter-spacing: 0.5em;
            color: var(--gold-primary);
        }

        .stats-container {
            display: flex;
            gap: 30px;
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: var(--gold-secondary);
        }

        .stats-container span { color: var(--gold-primary); font-weight: 700; }

        /* Center Stage */
        .stage {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun-core {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #fff 0%, var(--gold-primary) 40%, rgba(197,160,89,0.2) 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px var(--gold-glow);
            transition: transform 0.1s ease;
        }

        .roulette-ring {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 1px dashed rgba(197, 160, 89, 0.4);
            border-radius: 50%;
            animation: spin 30s linear infinite;
        }

        .roulette-ring.fast {
            animation: spin 0.8s linear infinite;
        }

        .aura-display {
            position: absolute;
            bottom: -60px;
            text-align: center;
            width: 400px;
        }

        .aura-name {
            font-family: var(--font-cinzel);
            font-size: 1.6rem;
            letter-spacing: 0.3em;
            color: var(--gold-primary);
            text-shadow: 0 0 15px var(--gold-glow);
            min-height: 40px;
        }

        .aura-rate {
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            color: var(--gold-secondary);
            margin-top: 5px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .action-btn {
            background: rgba(3, 3, 7, 0.8);
            border: 1px solid var(--gold-secondary);
            color: var(--gold-primary);
            font-family: var(--font-cinzel);
            font-size: 1rem;
            letter-spacing: 0.3em;
            padding: 14px 40px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover:not(:disabled) {
            background: rgba(197, 160, 89, 0.2);
            box-shadow: 0 0 20px var(--gold-glow);
            border-color: var(--gold-primary);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .codex-btn {
            background: transparent;
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: var(--gold-secondary);
            font-family: var(--font-cinzel);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            padding: 14px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .codex-btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }

        /* --- CODEX MODAL --- */
        #codex-modal {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 7, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.2;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        #codex-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .codex-content {
            width: 700px;
            max-height: 80vh;
            border: 1px solid var(--gold-secondary);
            background: rgba(5, 5, 12, 0.95);
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .codex-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .codex-title {
            font-family: var(--font-cinzel);
            font-size: 1.3rem;
            letter-spacing: 0.3em;
            color: var(--gold-primary);
        }

        .close-codex {
            background: none;
            border: none;
            color: var(--gold-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-codex:hover { color: var(--gold-primary); }

        .codex-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
        }

        .codex-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border: 1px solid rgba(197, 160, 89, 0.2);
            background: rgba(255,255,255,0.01);
            transition: border-color 0.3s;
        }

        .codex-item.unlocked {
            border-color: rgba(197, 160, 89, 0.6);
            background: rgba(197, 160, 89, 0.03);
        }

        .codex-item-info .name {
            font-family: var(--font-cinzel);
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: var(--gold-primary);
        }

        .codex-item-info .rate {
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: var(--gold-secondary);
            margin-top: 3px;
        }

        .codex-item-status {
            font-family: var(--font-cinzel);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
        }

        .codex-item.unlocked .codex-item-status { color: var(--gold-primary); }
        .codex-item:not(.unlocked) .codex-item-status { color: rgba(255,255,255,0.3); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--gold-secondary); }

        /* Glitch & Shockwave Overlays */
        .glitch-effect {
            animation: glitchAnim 0.15s infinite;
        }

        @keyframes glitchAnim {
            0% { transform: translate(0, 0); filter: hue-rotate(0deg); }
            20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(5px, -3px); filter: invert(0.2); }
            60% { transform: translate(-3px, -5px); filter: hue-rotate(180deg); }
            80% { transform: translate(3px, 3px); filter: hue-rotate(270deg); }
            100% { transform: translate(0, 0); filter: hue-rotate(360deg); }
        }

        .whiteout {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .whiteout.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="whiteout" id="whiteout"></div>
    <canvas id="bg-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>

    <div id="app">
        <!-- INTRO SCREEN -->
        <div id="intro-screen">
            <h1 class="intro-title">ASTRAL</h1>
            <div class="intro-sub">COSMIC ROULETTE & RARITY CODEX</div>
            <button class="play-btn" id="start-btn">INITIALIZE</button>
        </div>

        <!-- LOADING VIEW -->
        <div id="loading-view">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loading-text">SYNCHRONIZING COSMOS...</div>
        </div>

        <!-- MAIN GAME UI -->
        <div id="main-game">
            <header>
                <div class="logo">ASTRAL</div>
                <div class="stats-container">
                    <div>ROLLS: <span id="stat-rolls">0</span></div>
                    <div>DISCOVERED: <span id="stat-discovered">0</span> / 6</div>
                </div>
            </header>

            <div class="stage" id="stage">
                <div class="sun-core" id="sun-core"></div>
                <div class="roulette-ring" id="roulette-ring"></div>
                <div class="aura-display">
                    <div class="aura-name" id="aura-name">READY</div>
                    <div class="aura-rate" id="aura-rate">1 / 1</div>
                </div>
            </div>

            <div class="controls">
                <button class="action-btn" id="roll-btn">ROLL AURA</button>
                <button class="action-btn" id="auto-btn">AUTO ROLL</button>
                <button class="codex-btn" id="codex-open-btn">CODEX</button>
            </div>
        </div>
    </div>

    <!-- CODEX MODAL -->
    <div id="codex-modal">
        <div class="codex-content">
            <div class="codex-header">
                <div class="codex-title">RARITY CODEX</div>
                <button class="close-codex" id="codex-close-btn">&times;</button>
            </div>
            <div class="codex-list" id="codex-list">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script>
        /* --- RARITY DATA DEFINITION --- */
        const AURAS = [
            { id: 0, name: "STARDUST ECHO", rate: 1, weight: 899990, unlocked: true },
            { id: 1, name: "STELLAR VORTEX", rate: 10, weight: 100000, unlocked: false },
            { id: 2, name: "DIMENSIONAL RIFT", rate: 1000, weight: 900, unlocked: false },
            { id: 3, name: "SPATIAL RESONANCE", rate: 100000, weight: 89, unlocked: false },
            { id: 4, name: "GRAVITATIONAL COLLAPSE", rate: 1000000, weight: 9, unlocked: false },
            { id: 5, name: "SUPERNOVA REMNANT", rate: 10000000, weight: 0.9, unlocked: false },
            { id: 6, name: "BIG BANG OMEGA", rate: 100000000, weight: 0.1, unlocked: false }
        ];

        let totalRolls = 0;
        let isRolling = false;
        let isAutoRolling = false;
        let unlockedCount = 1;

        // Load saved state if any
        try {
            const saved = localStorage.getItem('astral_save');
            if (saved) {
                const data = JSON.parse(saved);
                totalRolls = data.rolls || 0;
                if (data.unlocked) {
                    AURAS.forEach((a, i) => {
                        a.unlocked = data.unlocked[i] || a.unlocked;
                    });
                }
                unlockedCount = AURAS.filter(a => a.unlocked).length;
            }
        } catch(e) {}

        function saveGame() {
            try {
                const data = {
                    rolls: totalRolls,
                    unlocked: AURAS.map(a => a.unlocked)
                };
                localStorage.setItem('astral_save', JSON.stringify(data));
            } catch(e) {}
        }

        /* --- WEB AUDIO API (PRO LEVEL AMBIENT & SOUND ENGINE) --- */
        let audioCtx = null;
        let masterGain = null;
        let ambientOscs = [];
        let ambientGain = null;
        let lfoNode = null;
        let delayNode = null;
        let delayFeedback = null;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);

            // Delay Node for deep spatial echoes (Delay 1: 0.6s, Feedback loop)
            delayNode = audioCtx.createDelay();
            delayNode.delayTime.setValueAtTime(0.6, audioCtx.currentTime);
            
            delayFeedback = audioCtx.createGain();
            delayFeedback.gain.setValueAtTime(0.4, audioCtx.currentTime);

            let delayFilter = audioCtx.createBiquadFilter();
            delayFilter.type = 'lowpass';
            delayFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);

            delayNode.connect(delayFilter);
            delayFilter.connect(delayFeedback);
            delayFeedback.connect(delayNode);
            delayNode.connect(masterGain);

            // 1. Deep Cosmic Drone Pad (Sine & Triangle waves at 55Hz, 110Hz, 165Hz root + 5th)
            ambientGain = audioCtx.createGain();
            ambientGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

            // LFO for Volume breathing (12 seconds period)
            lfoNode = audioCtx.createOscillator();
            lfoNode.frequency.setValueAtTime(1 / 12, audioCtx.currentTime);
            let lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            lfoNode.connect(lfoGain);
            lfoGain.connect(ambientGain.gain);
            lfoNode.start();

            const freqs = [55, 110, 165, 220];
            freqs.forEach((f, idx) => {
                let osc = audioCtx.createOscillator();
                osc.type = (idx % 2 === 0) ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(f, audioCtx.currentTime);
                
                let panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
                if (panner) {
                    panner.pan.setValueAtTime((idx - 1.5) * 0.5, audioCtx.currentTime);
                    osc.connect(panner);
                    panner.connect(ambientGain);
                } else {
                    osc.connect(ambientGain);
                }
                
                osc.start();
                ambientOscs.push(osc);
            });

            ambientGain.connect(masterGain);
            ambientGain.connect(delayNode);

            // 4. Crystal Chime Generator (Periodic high sparkling notes)
            setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                playCrystalChime(880 + Math.random() * 400);
            }, 24000);

            isAudioInitialized = true;
        }

        function playCrystalChime(freq, duration = 4.0) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1.5); // Very slow attack
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(masterGain);
            gain.connect(delayNode);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // 5. Pre-roll & Tension Sound Effects
        let tensionOsc = null;
        let tensionGain = null;

        function startTensionAudio(tier) {
            if (!audioCtx) return;
            try {
                if (tensionOsc) stopTensionAudio();
                
                tensionOsc = audioCtx.createOscillator();
                tensionGain = audioCtx.createGain();

                if (tier >= 3) {
                    // Ticking / Clock sound simulation for Tier 2+
                    tensionOsc.type = 'sawtooth';
                    tensionOsc.frequency.setValueAtTime(440, audioCtx.currentTime);
                } else {
                    tensionOsc.type = 'triangle';
                    tensionOsc.frequency.setValueAtTime(110, audioCtx.currentTime);
                }

                tensionGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                tensionGain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 2.0);

                tensionOsc.connect(tensionGain);
                tensionGain.connect(masterGain);
                tensionGain.connect(delayNode);
                tensionOsc.start();

                // Pitch rise over 2 seconds
                tensionOsc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 2.0);
            } catch(e) {}
        }

        function stopTensionAudio() {
            if (tensionOsc) {
                try {
                    tensionOsc.stop();
                    tensionOsc.disconnect();
                } catch(e) {}
                tensionOsc = null;
            }
        }

        function playClimaxHit(tier) {
            if (!audioCtx) return;
            stopTensionAudio();
            
            if (tier === 4) {
                // Big Bang Omega Pipe Organ / Majestic Chord
                [110, 220, 329.63, 440, 554.37, 659.25].forEach(f => {
                    let osc = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
                    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.0);
                    
                    let filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(2500, audioCtx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 5.0);

                    osc.connect(filter);
                    filter.connect(g);
                    g.connect(masterGain);
                    g.connect(delayNode);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 5.0);
                });
            } else {
                playCrystalChime(1760, 3.0);
            }
        }


        /* --- CANVAS GRAPHICS & VISUAL ENGINE --- */
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');

        let width, height;
        function resize() {
            width = bgCanvas.width = fxCanvas.width = window.innerWidth;
            height = bgCanvas.height = fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Starfield particles
        let stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                baseAlpha: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.2 + 0.05
            });
        }

        let mouse = { x: width/2, y: height/2, targetX: width/2, targetY: height/2 };
        window.addEventListener('mousemove', e => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        // Visual FX State variables
        let fxState = {
            mode: 'NORMAL', // NORMAL, TENSION_1, TENSION_2, TENSION_3, TENSION_4, COLLAPSE, EXPLODE
            timer: 0,
            tier: 0,
            particles: []
        };

        function updateBackground() {
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;

            bgCtx.fillStyle = '#030307';
            bgCtx.fillRect(0, 0, width, height);

            // Draw Parallax Stars
            const cx = width / 2;
            const cy = height / 2;
            const dx = (mouse.x - cx) * 0.0002;
            const dy = (mouse.y - cy) * 0.0002;

            stars.forEach(s => {
                s.x += s.speed + dx * s.size * 20;
                s.y += dy * s.size * 20;
                if (s.x < 0) s.x = width;
                if (s.x > width) s.x = 0;
                if (s.y < 0) s.y = height;
                if (s.y > height) s.y = 0;

                bgCtx.fillStyle = `rgba(243, 229, 171, ${s.baseAlpha})`;
                bgCtx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Draw Golden Aurora Fluid Waves on sides
            bgCtx.save();
            let time = Date.now() * 0.001;
            let auroraSpeedMultiplier = (fxState.tier === 1 || fxState.tier >= 2) ? 3.0 : 1.0;
            
            for (let i = 0; i < 3; i++) {
                bgCtx.beginPath();
                bgCtx.moveTo(0, height);
                let waveHeight = height * 0.4 + i * 80;
                for (let x = 0; x <= width; x += 50) {
                    let y = waveHeight + Math.sin(x * 0.003 + time * auroraSpeedMultiplier + i) * 80 * (fxState.tier >= 1 ? 1.8 : 1.0);
                    bgCtx.lineTo(x, y);
                }
                bgCtx.lineTo(width, height);
                bgCtx.closePath();
                bgCtx.fillStyle = `rgba(197, 160, 89, ${0.02 + i * 0.01})`;
                bgCtx.fill();
            }
            bgCtx.restore();
        }

        function updateFX() {
            fxCtx.clearRect(0, 0, width, height);

            if (fxState.mode === 'COLLAPSE') {
                // Big Bang Omega: Everything sucked into center
                fxState.timer -= 0.03;
                let scale = Math.max(0, fxState.timer);
                fxCtx.save();
                fxCtx.translate(width/2, height/2);
                fxCtx.scale(scale, scale);
                fxCtx.fillStyle = '#f3e5ab';
                fxCtx.beginPath();
                fxCtx.arc(0, 0, 5000, 0, Math.PI * 2);
                fxCtx.fill();
                fxCtx.restore();
                if (fxState.timer <= 0) {
                    fxState.mode = 'NORMAL';
                }
            } else if (fxState.mode === 'EXPLODE') {
                // Post-collapse explosion / Whiteout trigger
                fxState.timer += 0.05;
                let alpha = Math.max(0, 1 - fxState.timer);
                fxCtx.fillStyle = `rgba(243, 229, 171, ${alpha})`;
                fxCtx.fillRect(0, 0, width, height);
                if (fxState.timer > 1.5) fxState.mode = 'NORMAL';
            }

            // Draw Canvas Lasers / Solar Flares for Tier 3 & 4
            if (fxState.tier === 3 || fxState.tier === 4) {
                let sunX = width / 2;
                let sunY = height / 2 - 40; // Approx stage center
                fxCtx.strokeStyle = 'rgba(243, 229, 171, 0.6)';
                fxCtx.lineWidth = 1.5;
                for (let i = 0; i < 12; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let len = 100 + Math.random() * 300;
                    fxCtx.beginPath();
                    fxCtx.moveTo(sunX, sunY);
                    fxCtx.lineTo(sunX + Math.cos(angle) * len, sunY + Math.sin(angle) * len);
                    fxCtx.stroke();
                }
            }
        }

        function renderLoop() {
            updateBackground();
            updateFX();
            requestAnimationFrame(renderLoop);
        }
        renderLoop();


        /* --- GAME LOGIC & ROULETTE ENGINE --- */
        const introScreen = document.getElementById('intro-screen');
        const loadingView = document.getElementById('loading-view');
        const mainGame = document.getElementById('main-game');
        const startBtn = document.getElementById('start-btn');
        const rollBtn = document.getElementById('roll-btn');
        const autoBtn = document.getElementById('auto-btn');
        const codexBtn = document.getElementById('codex-open-btn');
        const codexModal = document.getElementById('codex-modal');
        const codexCloseBtn = document.getElementById('codex-close-btn');
        const codexList = document.getElementById('codex-list');

        const statRolls = document.getElementById('stat-rolls');
        const statDiscovered = document.getElementById('stat-discovered');
        const sunCore = document.getElementById('sun-core');
        const rouletteRing = document.getElementById('roulette-ring');
        const auraName = document.getElementById('aura-name');
        const auraRate = document.getElementById('aura-rate');
        const whiteout = document.getElementById('whiteout');

        statRolls.innerText = totalRolls;
        statDiscovered.innerText = unlockedCount;

        // Init UI states
        function updateStatsUI() {
            statRolls.innerText = totalRolls;
            statDiscovered.innerText = unlockedCount;
            saveGame();
        }

        // Screen Transition Flow
        startBtn.addEventListener('click', () => {
            initAudio();
            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.display = 'none';
                loadingView.style.opacity = '1';
                setTimeout(() => {
                    loadingView.style.opacity = '0';
                    setTimeout(() => {
                        loadingView.style.display = 'none';
                        mainGame.style.opacity = '1';
                        mainGame.style.pointerEvents = 'auto';
                    }, 800);
                }, 3000);
            }, 1500);
        });

        // Codex Populate
        function populateCodex() {
            codexList.innerHTML = '';
            AURAS.forEach(a => {
                let item = document.createElement('div');
                item.className = `codex-item ${a.unlocked ? 'unlocked' : ''}`;
                item.innerHTML = `
                    <div class="codex-item-info">
                        <div class="name">${a.unlocked ? a.name : '🔒 ???'}</div>
                        <div class="rate">1 / ${a.rate.toLocaleString()}</div>
                    </div>
                    <div class="codex-item-status">${a.unlocked ? 'ACQUIRED' : 'LOCKED'}</div>
                `;
                codexList.appendChild(item);
            });
        }

        codexBtn.addEventListener('click', () => {
            populateCodex();
            codexModal.classList.add('active');
        });
        codexCloseBtn.addEventListener('click', () => codexModal.classList.remove('active'));


        // Weighted RNG Roll
        function rollAura() {
            let totalWeight = AURAS.reduce((sum, a) => sum + a.weight, 0);
            let randomVal = Math.random() * totalWeight;
            let currentWeightSum = 0;
            for (let a of AURAS) {
                currentWeightSum += a.weight;
                if (randomVal <= currentWeightSum) {
                    return a;
                }
            }
            return AURAS[0];
        }

        // Main Roll execution with 2-second pre-roll aura upgrade演出
        let preRollTimeout = null;
        let rollInterval = null;

        function executeRoll() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;
            autoBtn.disabled = true;

            totalRolls++;
            updateStatsUI();

            // Pre-determine winning result
            let winner = rollAura();
            let tier = 0;
            if (winner.rate >= 100000000) tier = 4;
            else if (winner.rate >= 10000000) tier = 3;
            else if (winner.rate >= 1000000) tier = 2;
            else if (winner.rate >= 100000) tier = 1;

            // Fast visual spinning
            rouletteRing.classList.add('fast');
            auraName.innerText = "SCANNING COSMOS...";
            auraRate.innerText = "---";

            // Shuffle rolling aesthetic text
            let shuffleTimer = setInterval(() => {
                let randomAura = AURAS[Math.floor(Math.random() * AURAS.length)];
                auraName.innerText = randomAura.unlocked ? randomAura.name : "🔒 ???";
                auraRate.innerText = `1 / ${randomAura.rate.toLocaleString()}`;
            }, 80);

            // 2 Seconds Before Stop: Trigger Upgrade Pre-Roll Event
            setTimeout(() => {
                fxState.tier = tier;
                startTensionAudio(tier);

                if (tier >= 1) {
                    // Tier 1 (1/100k+): Pulse speed up & Gold aura acceleration
                }
                if (tier >= 2) {
                    // Tier 2 (1/1M+): Time freeze / stardust pause effect
                }
                if (tier >= 3) {
                    // Tier 3 (1/10M+): UI Glitch
                    mainGame.classList.add('glitch-effect');
                }
                if (tier >= 4) {
                    // Tier 4 (1/100M+): Big Bang Omega - Complete black void suck-in
                    fxState.mode = 'COLLAPSE';
                    fxState.timer = 1.0;
                }
            }, 1000); // Trigger 1 second into 3-second spin

            // Complete Roll after 3 seconds
            setTimeout(() => {
                clearInterval(shuffleTimer);
                rouletteRing.classList.remove('fast');
                mainGame.classList.remove('glitch-effect');
                stopTensionAudio();

                // Unlock check
                if (!winner.unlocked) {
                    winner.unlocked = true;
                    unlockedCount = AURAS.filter(a => a.unlocked).length;
                }

                // Climax Audio & Visual effect
                playClimaxHit(tier);

                if (tier === 4) {
                    fxState.mode = 'EXPLODE';
                    fxState.timer = 0;
                    whiteout.classList.add('active');
                    setTimeout(() => whiteout.classList.remove('active'), 600);
                }

                auraName.innerText = winner.name;
                auraRate.innerText = `1 / ${winner.rate.toLocaleString()}`;

                isRolling = false;
                rollBtn.disabled = false;
                autoBtn.disabled = false;
                fxState.tier = 0;

                updateStatsUI();

                if (isAutoRolling) {
                    setTimeout(executeRoll, 800);
                }
            }, 3000);
        }

        rollBtn.addEventListener('click', () => {
            isAutoRolling = false;
            autoBtn.innerText = "AUTO ROLL";
            executeRoll();
        });

        autoBtn.addEventListener('click', () => {
            isAutoRolling = !isAutoRolling;
            autoBtn.innerText = isAutoRolling ? "STOP AUTO" : "AUTO ROLL";
            if (isAutoRolling && !isRolling) {
                executeRoll();
            }
        });

        // Sun Core Pulsing Animation loop
        let pulseTime = 0;
        function animateSun() {
            pulseTime += 0.03;
            let scalePulse = 1;
            if (fxState.tier >= 1) {
                scalePulse = 1 + Math.sin(pulseTime * 15) * 0.25; // Fast fierce pulse
            } else {
                scalePulse = 1 + Math.sin(pulseTime * 2) * 0.05; // Gentle breathing
            }
            sunCore.style.transform = `scale(${scalePulse})`;
            requestAnimationFrame(animateSun);
        }
        animateSun();

    </script>
</body>
</html>
