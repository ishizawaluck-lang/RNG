    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Jost:wght@200;300;400&display=swap');

    :root {
      --bg-color: #020208;
      --pure-white: #ffffff;
      --easing-divine: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Jost', sans-serif;
      overflow: hidden;
      color: var(--pure-white);
    }

    /* ===================================================
       1. 星雲のベール & 幾何学的背景
       =================================================== */
    .cosmic-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(circle at 25% 20%, rgba(74, 28, 115, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 75% 80%, rgba(13, 43, 85, 0.35) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(17, 75, 95, 0.2) 0%, transparent 70%),
        linear-gradient(135deg, #020208 0%, #050b14 100%);
      overflow: hidden;
    }

    .star-cluster {
      position: absolute;
      inset: -50%;
      background: transparent;
      box-shadow: 
        20vw 10vh #fff, 85vw 25vh rgba(200,220,255,0.8), 45vw 70vh rgba(150,100,255,0.9),
        10vw 80vh #fff, 90vw 85vh rgba(100,200,255,0.7), 35vw 30vh rgba(255,255,255,0.6),
        70vw 15vh #fff, 15vw 45vh rgba(180,130,255,0.8), 60vw 90vh rgba(120,220,255,0.9),
        5vw 20vh rgba(255,255,255,0.4), 95vw 50vh #fff, 50vw 10vh rgba(200,150,255,0.7);
      width: 2px;
      height: 2px;
      animation: rotate-cluster 180s linear infinite;
      opacity: 0.6;
    }

    /* ===================================================
       2. 粒子（ドット）の集合体による宇宙ジェット束
       =================================================== */
    .celestial-core-system {
      position: absolute;
      top: 38%;
      left: 32%;
      width: 0;
      height: 0;
      z-index: 1;
      pointer-events: none;
      transform: rotate(-35deg); /* 斜め手前への発射角度 */
    }

    /* ホワイトアウトする中心核 */
    .core-nucleus {
      position: absolute;
      top: -20px;
      left: -20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 
        0 0 25px 8px #ffffff,
        0 0 60px 20px rgba(56, 182, 255, 0.8),
        0 0 120px 40px rgba(168, 85, 247, 0.7),
        0 0 200px 70px rgba(17, 75, 95, 0.4);
      animation: core-pulse 3s ease-in-out infinite alternate;
    }

    /* 星雲のベール（Glow背景：blurエフェクト） */
    .jet-nebula-glow {
      position: absolute;
      top: -40px;
      left: 0;
      width: 900px;
      height: 100px;
      background: linear-gradient(90deg, rgba(168,85,247,0.25) 0%, rgba(17,75,95,0.2) 40%, transparent 100%);
      filter: blur(35px);
      transform-origin: left center;
      z-index: 1;
      pointer-events: none;
    }

    /* 粒子ジェット共通ベース */
    .particle-jet-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      background: transparent;
      transform-origin: left center;
      z-index: 2;
    }

    /* 幾何学的軌道リング */
    .geometric-orbit {
      position: absolute;
      top: -150px;
      left: -150px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      animation: rotate-cluster 60s linear infinite;
    }

    /* ===================================================
       3. UIレイヤー (神静かなタイトル & PLAYボタン)
       =================================================== */
    .ui-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12vh;
    }

    .celestial-subtitle {
      font-family: 'Cinzel', serif;
      font-weight: 300;
      font-size: clamp(0.75rem, 1.2vw, 1rem);
      letter-spacing: 0.6em;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      margin-bottom: 1.5vh;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .celestial-title {
      font-family: 'Cinzel', serif;
      font-weight: 300;
      font-size: clamp(3rem, 6vw, 7rem);
      letter-spacing: 0.3em;
      color: var(--pure-white);
      margin-bottom: 6vh;
      text-shadow: 
        0 0 20px rgba(255, 255, 255, 0.4),
        0 0 50px rgba(56, 182, 255, 0.3);
      opacity: 0;
      transform: translateY(20px);
      animation: divine-reveal 1.8s var(--easing-divine) forwards 0.3s;
    }

    .play-btn-container {
      position: relative;
    }

    .play-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 1.1rem 4.5rem;
      font-family: 'Cinzel', serif;
      font-size: clamp(1rem, 1.5vw, 1.3rem);
      font-weight: 400;
      color: var(--pure-white);
      letter-spacing: 0.4em;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.6s var(--easing-divine);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .play-btn span {
      position: relative;
      z-index: 2;
      transition: text-shadow 0.4s ease;
    }

    .play-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 0 30px rgba(56, 182, 255, 0.4),
        0 10px 40px rgba(0, 0, 0, 0.5),
        inset 0 0 25px rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
      letter-spacing: 0.5em;
    }

    .play-btn:hover span {
      text-shadow: 0 0 12px #fff, 0 0 25px rgba(56, 182, 255, 0.8);
    }

    .play-btn:active {
      transform: translateY(1px) scale(0.97);
      background: rgba(255, 255, 255, 0.15);
    }

    /* ===================================================
       4. Keyframes
       =================================================== */
    @keyframes rotate-cluster {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes core-pulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes particle-flicker-1 {
      0% { opacity: 0.75; transform: scaleY(0.98) translateX(0px); }
      100% { opacity: 0.95; transform: scaleY(1.02) translateX(3px); }
    }

    @keyframes particle-flicker-2 {
      0% { opacity: 0.8; transform: scaleY(0.95) translateX(1px); }
      100% { opacity: 1; transform: scaleY(1.05) translateX(-2px); }
    }

    @keyframes particle-flicker-3 {
      0% { opacity: 0.9; transform: scaleY(0.97) translateX(-1px); }
      100% { opacity: 1; transform: scaleY(1.03) translateX(2px); }
    }

    @keyframes divine-reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- 1. 背景の星雲・星くず -->
  <div class="cosmic-background">
    <div class="star-cluster"></div>
  </div>

  <!-- 2. 天体現象: 粒子集合体の宇宙ジェット -->
  <div class="celestial-core-system">
    <div class="geometric-orbit"></div>
    <div class="core-nucleus"></div>
    
    <!-- 星雲のベール（Glow背景） -->
    <div class="jet-nebula-glow"></div>

    <!-- 超高密度ボックスシャドウによる3層の粒子ジェット束 -->
    <div class="particle-jet-layer layer-1"></div>
    <div class="particle-jet-layer layer-2"></div>
    <div class="particle-jet-layer layer-3"></div>
  </div>

  <!-- 3. UIレイヤー -->
  <div class="ui-layer">
    <div class="celestial-subtitle">Celestial Probability Architecture</div>
    <h1 class="celestial-title">AETHERIA</h1>
    
    <div class="play-btn-container">
      <button class="play-btn">
        <span>PLAY</span>
      </button>
    </div>
  </div>

</body>
</html>
