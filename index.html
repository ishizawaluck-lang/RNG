<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LULLABY</title>
<style>
  /* 📌 1. UIの完全修正・配置・カラーの「純白」統一 */
  :root {
    --black: #000000;
    --white: #ffffff;
    --silver: #e5e5e5;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-drag: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  body {
    background-color: var(--black);
    color: var(--white);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* 📌 4. LULLABY タイトル画面 */
  #title-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, var(--white) 0%, var(--silver) 40%, var(--black) 100%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 2s ease-in-out;
  }
  /* 光の筋（ライトリーク） */
  .light-leak {
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, transparent 60%);
    animation: rotateLeak 20s linear infinite;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  @keyframes rotateLeak { 100% { transform: rotate(360deg); } }
  .title-text {
    position: absolute;
    top: 25%;
    right: 20%;
    font-size: 4rem;
    font-weight: 100;
    color: var(--black);
    letter-spacing: 1.2em;
    animation: titleIntro 3s cubic-bezier(0.1, 1, 0.2, 1) forwards;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  @keyframes titleIntro {
    100% { letter-spacing: 0.4em; transform: translateX(50%); }
  }
  /* ひし形 PLAY ボタン */
  .play-btn {
    position: absolute;
    top: 60%;
    width: 120px; height: 120px;
    transform: rotate(45deg);
    border: 1px solid var(--black);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: transparent;
  }
  .play-btn:hover { background: var(--black); }
  .play-btn-text {
    transform: rotate(-45deg);
    font-weight: 100;
    letter-spacing: 0.3em;
    color: var(--black);
    transition: color 0.3s ease;
  }
  .play-btn:hover .play-btn-text { color: var(--white); }

  /* 波紋エフェクト */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: var(--white);
    transform: scale(0);
    animation: rippleEffect 1.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleEffect { 100% { transform: scale(50); opacity: 0; } }

  /* ロード画面 */
  #loading-screen {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: var(--black);
    z-index: 99;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .loading-ui {
    position: absolute;
    bottom: 30px; right: 40px;
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .loading-text { font-weight: 100; letter-spacing: 0.2em; color: var(--white); }
  .magic-circle {
    width: 30px; height: 30px;
    border: 1px dashed var(--white);
    border-radius: 50%;
    animation: spin 3s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .diamond-magic-circle {
    width: 40px; height: 40px;
    border: 1px solid var(--white);
    transform: rotate(45deg);
    animation: spinDiamond 2s linear infinite;
  }
  @keyframes spinDiamond { 100% { transform: rotate(405deg); } }

  /* メイン画面 */
  #main-screen {
    position: absolute; top:0; left:0; width:100%; height:100%;
    z-index: 10;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
  }

  /* 📌 1. アイコン付き「ひし形UI」と文字の配置 */
  #ui-container {
    position: absolute;
    top: 40px; left: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    width: 300px;
    z-index: 20;
  }
  .icon-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 60px;
  }
  .diamond-btn {
    width: 40px; height: 40px;
    transform: rotate(45deg);
    border: 1px solid var(--white);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(0,0,0,0.5);
  }
  .diamond-btn:hover { background: var(--white); }
  .diamond-btn svg {
    transform: rotate(-45deg);
    fill: var(--white);
    width: 16px; height: 16px;
    transition: fill 0.2s ease;
  }
  .diamond-btn:hover svg { fill: var(--black); }
  .icon-text {
    margin-top: 25px; /* ひし形の下に配置、被り回避 */
    font-size: 0.6rem;
    font-weight: 100;
    letter-spacing: 0.3em;
    color: var(--white);
    text-align: center;
    white-space: nowrap;
  }

  /* 📌 1. ROLLボタンの正確な配置とひし形化（平行四辺形） */
  #roll-container {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    z-index: 20;
  }
  .roll-btn {
    width: 140px; height: 40px;
    transform: skewX(-20deg);
    border: 1px solid var(--white);
    background: transparent;
    color: var(--white);
    font-weight: 100;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    text-transform: uppercase;
  }
  .roll-btn span { transform: skewX(20deg); }
  .roll-btn:hover:not(:disabled) { background: var(--white); color: var(--black); }
  .roll-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ガチャ結果表示 */
  #gacha-result {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 15;
  }
  .aura-name {
    font-size: 2.5rem;
    font-weight: 100;
    letter-spacing: 0.5em;
    color: var(--white);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .aura-prob {
    font-size: 0.8rem;
    font-weight: 100;
    letter-spacing: 0.2em;
    color: var(--silver);
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  /* 📌 5. 各種ポップアップUI (BACKPACK等) */
  .modal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: 400px; max-height: 600px;
    background: rgba(0,0,0,0.9);
    border: 1px solid var(--white);
    padding: 30px;
    z-index: 50;
    display: none;
    opacity: 0;
    transition: all 0.3s ease;
    overflow-y: auto;
  }
  .modal.active {
    display: block; opacity: 1; transform: translate(-50%, -50%) scale(1);
  }
  .modal-title {
    font-weight: 100; letter-spacing: 0.3em; border-bottom: 1px solid var(--white);
    padding-bottom: 10px; margin-bottom: 20px; text-align: center;
  }
  .close-btn {
    position: absolute; top: 10px; right: 10px;
    cursor: pointer; font-weight: 100; padding: 5px;
  }
  .item-list { list-style: none; }
  .item-list li {
    display: flex; justify-content: space-between;
    font-weight: 100; letter-spacing: 0.1em; font-size: 0.8rem;
    padding: 10px 0; border-bottom: 1px dotted var(--silver);
  }

  /* 📌 2. カットシーン専用オーバーレイ */
  #cutscene-overlay {
    position: absolute; top:0; left:0; width:100%; height:100%;
    z-index: 80;
    pointer-events: none;
    display: none;
    background: transparent;
  }
  .cutscene-counter {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 3rem; font-weight: 100; letter-spacing: 0.2em; color: var(--white);
  }
  .glass-crack {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%25" height="100%25"><path d="M50%25 50%25 L0 0 M50%25 50%25 L100%25 0 M50%25 50%25 L0 100%25 M50%25 50%25 L100%25 100%25 M50%25 50%25 L20%25 0 M50%25 50%25 L100%25 60%25" stroke="white" stroke-width="2" fill="none"/></svg>');
    opacity: 0;
  }
  /* シネマティックホログラムフレーム */
  .cinematic-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) skewX(-15deg);
    border: 1px solid var(--white);
    padding: 20px 40px;
    opacity: 0;
    display: flex; flex-direction: column; align-items: center;
  }
  .cinematic-frame span { transform: skewX(15deg); }

  /* 演出用クラス */
  .invert-effect { filter: invert(1); }
  .glitch-effect { animation: glitch 0.2s infinite; }
  @keyframes glitch {
    0% { transform: translate(2px, 1px); }
    20% { transform: translate(-2px, -2px); }
    40% { transform: translate(1px, 2px); }
    60% { transform: translate(-1px, -1px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(-2px, 1px); }
  }
  .shake-effect { animation: shake 0.1s infinite; }
  @keyframes shake {
    0% { transform: translate(0, 0); }
    50% { transform: translate(5px, 5px); }
    100% { transform: translate(-5px, -5px); }
  }
</style>
</head>
<body>

  <!-- 📌 4. タイトル画面 -->
  <div id="title-screen">

    <!-- UI -->
    <div id="ui-container">

          <svg viewBox="0 0 24 24"><path d="M19.4 13c.2-.6.2-1.3.2-2s0-1.4-.2-2l2.1-1.6c.2-.2.2-.4.1-.6l-2-3.5c-.1-.2-.3-.2-.5-.2l-2.5 1c-.5-.4-1.1-.7-1.7-1l-.4-2.6C14.5 0 14.3 0 14.1 0h-4.2c-.2 0-.4 0-.4.3l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.5-1c-.2-.1-.4 0-.5.2l-2 3.5c-.1.2 0 .4.1.6L4.6 9c-.2.6-.2 1.3-.2 2s0 1.4.2 2l-2.1 1.6c-.2.2-.2.4-.1.6l2 3.5c.1.2.3.2.5.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.3.4.3h4.2c.2 0 .4 0 .4-.3l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.4 0 .5-.2l2-3.5c.1-.2 0-.4-.1-.6l-2.1-1.6zM12 15.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg>
        </div>
        <div class="icon-text">SETTINGS</div>

    <!-- ROLL ボタン -->

      <button class="roll-btn" id="btn-roll" onclick="rollGacha()"><span>ROLL</span></button>

<script>
/* =========================================================================
   データ構造とガチャロジック (51種)
   21種ノーマル + 30種レア
========================================================================= */
const AURA_DATA = [];
const formatNumber = (num) => num.toLocaleString();

// ID 1~21 (Normal/Uncommon/Rare) - 出現しやすい
const normalPrefixes = ["Dust","Stone","Iron","Steel","Silver","Void","Echo","Pulse","Glimmer","Spark","Fade","Drift","Haze","Mist","Shard","Gloom","Dusk","Dawn","Core","Flux","Zenith"];
for(let i=0; i<21; i++){
  let prob = Math.floor(Math.pow(1.5, i+1) * 2); 
  AURA_DATA.push({ id: i+1, name: normalPrefixes[i], prob: prob, rarity: 'normal' });
}

// 📌 ID 22~51 (30種のレア - カットシーン対象) - 非常に低確率 (重み付け抽選で出にくくする)
const rareNames = [
  "Equinox Balance","END OF TIME","Vortex","Velocity","Cyclone","TRAUMA","OVERTHINKING",
  "memorial overreached","Abyss Gaze","Paradox Shift","Quantum Leap","Singularity",
  "Event Horizon","Stellar Collapse","Absolute Zero","Entropy","Supernova","Black Dwarf",
  "White Hole","Cosmic Web","Dark Matter","Neutrino","Tachyon","Warp Drive","String Theory",
  "Multiverse","Omnipresence","Genesis","Revelation","LULLABY ULTIMA"
];
for(let i=0; i<30; i++){
  let prob = 100000 + Math.floor(Math.pow(1.5, i) * 50000); 
  if(i===29) prob = 5000000000; // LULLABY ULTIMA 1/50億
  AURA_DATA.push({ id: 22+i, name: rareNames[i], prob: prob, rarity: 'rare' });
}

// 重み計算 (低確率化)
const getTotalWeight = () => AURA_DATA.reduce((sum, aura) => sum + (1 / aura.prob), 0);

const getRandomAura = () => {
  const totalWeight = getTotalWeight();
  let r = Math.random() * totalWeight;
  for(let aura of AURA_DATA) {
    r -= (1 / aura.prob);
    if(r <= 0) return aura;
  }
  return AURA_DATA[0]; // fallback
};

// プレイヤーデータ
const player = {
  inventory: {}
};
AURA_DATA.forEach(a => player.inventory[a.id] = 0);

/* =========================================================================
   状態管理・DOM制御
========================================================================= */
let isRolling = false;
let autoRollInterval = null;
let isQuick = false;
let currentAura = null;
let animationFrameId;

const btnRoll = document.getElementById('btn-roll');
const btnAuto = document.getElementById('btn-auto');
const btnQuick = document.getElementById('btn-quick');
const resName = document.getElementById('aura-name');
const resProb = document.getElementById('aura-prob');

/* 📌 4. タイトル画面と遷移 */
function startGame(e) {
  // 波紋
  const btn = e.currentTarget;
  const ripple = document.createElement('div');
  ripple.classList.add('ripple');
  btn.appendChild(ripple);
  
  // Audio Context Init
  initAudio();
  playTone(440, 'sine', 0.1, 1);

  setTimeout(() => {
    document.getElementById('title-screen').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('title-screen').style.display = 'none';
      document.getElementById('loading-screen').style.display = 'block';
      setTimeout(() => document.getElementById('loading-screen').style.opacity = '1', 50);
      
      setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('main-screen').style.display = 'block';
          setTimeout(() => document.getElementById('main-screen').style.opacity = '1', 50);
          initCanvas();
        }, 1000);
      }, 3000); // 3秒ロード
    }, 2000);
  }, 1000);
}

/* 📌 5. 他画面への遷移 (Other Side) */
function gotoOtherSide(destination) {
  cleanupUI(); // UI残像クリーンアップ
  playTone(880, 'triangle', 0.1, 0.5); // ハープ/鐘のような音
  document.getElementById('loading-ui-default').style.display = 'none';
  document.getElementById('loading-ui-otherside').style.display = 'flex';
  
  const loader = document.getElementById('loading-screen');
  loader.style.display = 'block';
  setTimeout(() => loader.style.opacity = '1', 50);
  
  setTimeout(() => {
    // 本来は別空間DOM構築だが、要件「1ファイル」に収めるためテキスト変更で擬似表現
    alert(`Arrived at ${destination} (Independent Space)`);
    loader.style.opacity = '0';
    setTimeout(() => {
      loader.style.display = 'none';
      document.getElementById('loading-ui-default').style.display = 'flex';
      document.getElementById('loading-ui-otherside').style.display = 'none';
    }, 1000);
  }, 3000);
}

function cleanupUI() {
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
}

/* UI Modal */
function openModal(id) {
  playTone(600, 'sine', 0.05, 0.1);
  if(id === 'backpack-modal') updateBackpack();
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
function updateBackpack() {
  const list = document.getElementById('backpack-list');
  list.innerHTML = '';
  AURA_DATA.forEach(a => {
    if(player.inventory[a.id] > 0) {
      const li = document.createElement('li');
      li.innerHTML = `<span>${a.name}</span><span>x${player.inventory[a.id]}</span>`;
      list.appendChild(li);
    }
  });
}

/* =========================================================================
   ガチャ実行処理 (連打防止・クールダウン)
========================================================================= */
function rollGacha() {
  if (isRolling) return;
  isRolling = true;
  disableButtons(true);
  
  resName.style.opacity = '0';
  resProb.style.opacity = '0';
  
  const rollTime = isQuick ? 200 : 800; // 少し早めのテンポ
  
  setTimeout(() => {
    currentAura = getRandomAura();
    player.inventory[currentAura.id]++;
    
    // 📌 2. レア(1/100,000以上)ならカットシーン
    if (currentAura.prob >= 100000) {
      playCutscene(currentAura);
    } else {
      showResult(currentAura);
      setTimeout(() => {
        isRolling = false;
        disableButtons(false);
      }, 300); // クールダウン
    }
  }, rollTime);
}

function showResult(aura) {
  resName.innerText = aura.name;
  resProb.innerText = `1 / ${formatNumber(aura.prob)}`;
  resName.style.opacity = '1';
  resProb.style.opacity = '1';
}

function disableButtons(disabled) {
  btnRoll.disabled = disabled;
  btnAuto.disabled = disabled;
  btnQuick.disabled = disabled;
}

function toggleAutoRoll() {
  if (autoRollInterval) {
    clearInterval(autoRollInterval);
    autoRollInterval = null;
    btnAuto.style.background = 'transparent';
    btnAuto.style.color = 'var(--white)';
  } else {
    btnAuto.style.background = 'var(--white)';
    btnAuto.style.color = 'var(--black)';
    autoRollInterval = setInterval(() => {
      if(!isRolling) rollGacha();
    }, isQuick ? 500 : 1500);
  }
}

function toggleQuickRoll() {
  isQuick = !isQuick;
  btnQuick.style.background = isQuick ? 'var(--white)' : 'transparent';
  btnQuick.style.color = isQuick ? 'var(--black)' : 'var(--white)';
}

/* =========================================================================
   📌 2. 最重要：30種類の超絶カットシーン実装
========================================================================= */
const overlay = document.getElementById('cutscene-overlay');
const csCounter = document.getElementById('cs-counter');
const csCrack = document.getElementById('cs-crack');
const csFrame = document.getElementById('cs-frame');
const csName = document.getElementById('cs-aura-name');
const csProb = document.getElementById('cs-aura-prob');

function playCutscene(aura) {
  // ステップ1: 世界静止と完全な静寂
  canvasState.paused = true;
  stopAllAudio();
  overlay.style.display = 'block';
  document.body.className = ''; // クラスリセット
  csCrack.style.opacity = '0';
  csFrame.style.opacity = '0';
  csCounter.style.display = 'block';
  csCounter.innerText = '1 / 0';
  
  // 30種類の個性設定 (Switch文による完全分岐)
  let styleConfig = getCutsceneStyle(aura.id);
  applyCutsceneStyle(styleConfig);

  // ステップ2: 爆速確率カウントアップ
  let currentCount = 0;
  const targetCount = aura.prob;
  const duration = 2000;
  const startTime = performance.now();

  function updateCounter(time) {
    const elapsed = time - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // 指数関数的なイーズイン
    const easeProgress = Math.pow(progress, 4);
    currentCount = Math.floor(easeProgress * targetCount);
    csCounter.innerText = `1 / ${formatNumber(currentCount)}`;
    
    if (progress < 1) {
      requestAnimationFrame(updateCounter);
    } else {
      csCounter.innerText = `1 / ${formatNumber(targetCount)}`;
      triggerBreakthrough(aura, styleConfig);
    }
  }
  requestAnimationFrame(updateCounter);
}

// 30種類の個性定義ファクトリ
function getCutsceneStyle(id) {
  let cfg = { particleMode: 'implode', screenClass: '', sound: 'bass' };
  switch(id) {
    case 22: cfg = { particleMode: 'flip', screenClass: 'invert-effect', sound: 'glitch' }; break; // Equinox
    case 23: cfg = { particleMode: 'stop', screenClass: 'invert-effect', sound: 'organ' }; break; // END OF TIME
    case 24: cfg = { particleMode: 'spiral', screenClass: '', sound: 'sweep' }; break; // Vortex
    case 25: cfg = { particleMode: 'dash', screenClass: '', sound: 'sweep' }; break; // Velocity
    case 26: cfg = { particleMode: 'vortex', screenClass: 'shake-effect', sound: 'bass' }; break; // Cyclone
    case 27: cfg = { particleMode: 'chaos', screenClass: 'glitch-effect', sound: 'noise' }; break; // TRAUMA
    case 28: cfg = { particleMode: 'jitter', screenClass: 'glitch-effect shake-effect', sound: 'noise' }; break; // OVERTHINKING
    case 29: cfg = { particleMode: 'gold_burst', screenClass: 'invert-effect', sound: 'organ' }; break; // memorial
    case 30: cfg = { particleMode: 'sink', screenClass: '', sound: 'bass' }; break;
    case 31: cfg = { particleMode: 'matrix', screenClass: 'glitch-effect', sound: 'synth' }; break;
    case 32: cfg = { particleMode: 'bounce', screenClass: 'invert-effect', sound: 'sweep' }; break;
    case 33: cfg = { particleMode: 'implode', screenClass: '', sound: 'bell' }; break;
    case 34: cfg = { particleMode: 'ring', screenClass: '', sound: 'organ' }; break;
    case 35: cfg = { particleMode: 'crush', screenClass: 'shake-effect', sound: 'bass' }; break;
    case 36: cfg = { particleMode: 'freeze', screenClass: '', sound: 'bell' }; break;
    case 37: cfg = { particleMode: 'scatter', screenClass: 'glitch-effect', sound: 'noise' }; break;
    case 38: cfg = { particleMode: 'explode', screenClass: 'invert-effect', sound: 'bass' }; break;
    case 39: cfg = { particleMode: 'shrink', screenClass: 'invert-effect', sound: 'synth' }; break;
    case 40: cfg = { particleMode: 'expand', screenClass: '', sound: 'organ' }; break;
    case 41: cfg = { particleMode: 'web', screenClass: '', sound: 'sweep' }; break;
    case 42: cfg = { particleMode: 'hide', screenClass: 'invert-effect', sound: 'bass' }; break;
    case 43: cfg = { particleMode: 'line', screenClass: '', sound: 'synth' }; break;
    case 44: cfg = { particleMode: 'dash', screenClass: 'shake-effect', sound: 'noise' }; break;
    case 45: cfg = { particleMode: 'warp', screenClass: 'glitch-effect', sound: 'sweep' }; break;
    case 46: cfg = { particleMode: 'wave', screenClass: '', sound: 'organ' }; break;
    case 47: cfg = { particleMode: 'split', screenClass: 'invert-effect', sound: 'synth' }; break;
    case 48: cfg = { particleMode: 'omni', screenClass: 'shake-effect', sound: 'bass' }; break;
    case 49: cfg = { particleMode: 'rise', screenClass: '', sound: 'bell' }; break;
    case 50: cfg = { particleMode: 'fall', screenClass: 'invert-effect', sound: 'organ' }; break;
    case 51: cfg = { particleMode: 'ultima', screenClass: 'invert-effect glitch-effect shake-effect', sound: 'organ_chord' }; break; // LULLABY ULTIMA
    default: cfg = { particleMode: 'implode', screenClass: '', sound: 'bass' };
  }
  return cfg;
}

function applyCutsceneStyle(cfg) {
  if(cfg.screenClass) document.body.className = cfg.screenClass;
}

// ステップ3 & 4: ブレイクスルーと粒子集束
function triggerBreakthrough(aura, styleConfig) {
  csCounter.style.display = 'none';
  // ガラスブレイク
  csCrack.style.opacity = '1';
  playAudioEffect(styleConfig.sound);
  
  // 反転フラッシュ
  document.body.style.background = "var(--white)";
  setTimeout(() => document.body.style.background = "var(--black)", 100);

  // Canvas粒子バースト指示
  canvasState.cutsceneMode = styleConfig.particleMode;
  canvasState.paused = false;

  setTimeout(() => {
    csCrack.style.opacity = '0';
    document.body.className = ''; // エフェクト解除
    
    // ひし形ホログラムフレームでの実体化
    csFrame.style.display = 'flex';
    csName.innerText = aura.name;
    csProb.innerText = `1 / ${formatNumber(aura.prob)}`;
    csFrame.style.opacity = '1';
    
    setTimeout(() => {
      // 演出終了処理
      csFrame.style.opacity = '0';
      setTimeout(() => {
        csFrame.style.display = 'none';
        overlay.style.display = 'none';
        canvasState.cutsceneMode = 'normal';
        showResult(aura);
        isRolling = false;
        disableButtons(false);
      }, 500);
    }, 3000);
  }, 1500);
}


/* =========================================================================
   Canvas パーティクル描画
========================================================================= */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
const canvasState = { paused: false, cutsceneMode: 'normal' };

function initCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];
  for(let i=0; i<500; i++){
    particles.push(createParticle());
  }
  requestAnimationFrame(renderCanvas);
}

function createParticle() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    size: Math.random() * 2,
    baseX: Math.random() * canvas.width,
    baseY: Math.random() * canvas.height
  };
}

function renderCanvas() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // 軌跡
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  if(!canvasState.paused) {
    ctx.fillStyle = '#ffffff';
    particles.forEach(p => {
      // 通常時
      if (canvasState.cutsceneMode === 'normal') {
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
        if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
      } 
      // 演出モード分岐
      else {
        const dx = cx - p.x;
        const dy = cy - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        switch(canvasState.cutsceneMode) {
          case 'implode': // 吸い込み
            p.x += dx * 0.1; p.y += dy * 0.1; break;
          case 'spiral': // 渦
            const angle = Math.atan2(dy, dx) + 0.1;
            p.x += Math.cos(angle) * 10; p.y += Math.sin(angle) * 10; break;
          case 'chaos': // ランダム拡散
            p.x += (Math.random()-0.5)*50; p.y += (Math.random()-0.5)*50; break;
          case 'ultima': // 究極
            ctx.fillStyle = (Math.random() > 0.5) ? '#ffffff' : '#e5e5e5';
            p.x += dx * 0.2 + (Math.random()-0.5)*20; p.y += dy * 0.2 + (Math.random()-0.5)*20; break;
          default:
            // 簡略化：その他のモードは中心へ高速収束
            p.x += dx * 0.15; p.y += dy * 0.15; 
        }
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  requestAnimationFrame(renderCanvas);
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

/* =========================================================================
   Web Audio API (無音と音響の管理)
========================================================================= */
let audioCtx;
function initAudio() {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function stopAllAudio() {
  // 簡易的にコンテキストをサスペンド・レジューム
  if(audioCtx) {
    audioCtx.suspend().then(() => audioCtx.resume());
  }
}
function playTone(freq, type, duration, vol) {
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// 演出用の音響
function playAudioEffect(type) {
  if(!audioCtx) return;
  switch(type) {
    case 'bass': playTone(50, 'sawtooth', 2, 1); break;
    case 'bell': playTone(800, 'sine', 3, 0.5); break;
    case 'organ': 
      playTone(200, 'square', 3, 0.3);
      playTone(400, 'square', 3, 0.2);
      break;
    case 'organ_chord': // LULLABY ULTIMA等
      playTone(261.6, 'square', 5, 0.3); // C
      playTone(329.6, 'square', 5, 0.3); // E
      playTone(392.0, 'square', 5, 0.3); // G
      break;
    case 'glitch':
      for(let i=0; i<10; i++) setTimeout(() => playTone(Math.random()*1000+100, 'square', 0.1, 0.5), i*50);
      break;
    case 'noise':
      playTone(100, 'sawtooth', 1, 1); // 疑似ノイズ
      break;
    case 'sweep':
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(100, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 1);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 1);
      break;
  }
}
