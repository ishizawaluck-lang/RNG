<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Odyssey - 待機画面</title>
    <!-- Google Fonts: Montserrat (Thin 100 / Light 300) & Cinzel Decorative -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@100;300;400&display=swap" rel="stylesheet">
    
    <style>
        /* === 基本スタイル === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', 'Cinzel Decorative', sans-serif;
            background-color: #030107;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #10061d 0%, #030107 100%);
            perspective: 1000px; /* 3D空間の奥行き設定 */
        }

        /* === 星雲の呼吸（パルス）エフェクト === */
        .nebula-background {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(90, 30, 160, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(20, 80, 180, 0.15) 0%, transparent 60%);
            opacity: 0.6;
            filter: blur(50px);
            z-index: 1;
            animation: nebulaPulse 16s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
            pointer-events: none;
        }

        @keyframes nebulaPulse {
            0% {
                opacity: 0.4;
                filter: blur(45px) scale(1);
            }
            100% {
                opacity: 0.8;
                filter: blur(65px) scale(1.06);
            }
        }

        /* === 空間の緩やかなワープ効果（星々レイヤー） === */
        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 80px 140px, rgba(125,249,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 150px 70px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 200px 180px, rgba(255,223,186,0.7), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            animation: cosmicWarp 35s linear infinite;
        }

        @keyframes cosmicWarp {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.12) rotate(2deg);
                opacity: 0.8;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 0.5;
            }
        }

        /* === 星座の幾何学ライン（ジオメトリー構造） === */
        .geometry-constellation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.25;
            background-image: 
                linear-gradient(30deg, rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(150deg, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 120px 120px;
            animation: constellationFade 20s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
        }

        @keyframes constellationFade {
            0% { opacity: 0.15; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.03); }
        }

        /* === コズミック・リング（天体の環） === */
        .cosmic-ring-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 450px;
            height: 450px;
            margin: -225px 0 0 -225px;
            z-index: 4;
            pointer-events: none;
            transform-style: preserve-3d;
            animation: ringRotate 28s linear infinite;
        }

        .cosmic-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.1);
            transform: rotateX(70deg) rotateY(15deg);
        }

        .cosmic-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-color: rgba(56, 189, 248, 0.2);
            transform: rotateX(65deg) rotateY(-30deg);
            animation: ringRotateReverse 35s linear infinite;
        }

        @keyframes ringRotate {
            0% { transform: rotate3d(0.5, 1, 0.2, 0deg); }
            100% { transform: rotate3d(0.5, 1, 0.2, 360deg); }
        }

        @keyframes ringRotateReverse {
            0% { transform: rotate3d(-0.5, 1, -0.2, 360deg); }
            100% { transform: rotate3d(-0.5, 1, -0.2, 0deg); }
        }

        /* === コンテンツ本体 === */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* === タイトル（極細フォント ＆ 静かなグリッチ / スキャンエフェクト） === */
        .game-title {
            font-family: 'Cinzel Decorative', 'Montserrat', sans-serif;
            font-size: clamp(2.2rem, 5vw, 4.2rem);
            font-weight: 300;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
            margin-bottom: 3.5rem;
            position: relative;
            animation: titleGlitch 7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        /* 洗練されたスキャン線 */
        .game-title::after {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-25deg);
            animation: scanLine 7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        @keyframes titleGlitch {
            0%, 93%, 97%, 100% {
                transform: translate(0);
                text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
            }
            94% {
                transform: translate(-1.5px, 0.5px);
                text-shadow: -2px 0 rgba(56, 189, 248, 0.5), 2px 0 rgba(167, 139, 250, 0.5);
            }
            96% {
                transform: translate(1.5px, -0.5px);
                text-shadow: 2px 0 rgba(56, 189, 248, 0.5), -2px 0 rgba(167, 139, 250, 0.5);
            }
        }

        @keyframes scanLine {
            0%, 85% { left: -120%; }
            95%, 100% { left: 220%; }
        }

        /* === ボタンからのオーラエフェクト === */
        .play-btn-container {
            position: relative;
            display: inline-block;
        }

        .play-btn-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            background: linear-gradient(45deg, rgba(56,189,248,0.4), rgba(167,139,250,0.4), rgba(255,255,255,0.2));
            background-size: 300% 300%;
            border-radius: 40px;
            z-index: -1;
            opacity: 0.4;
            filter: blur(10px);
            animation: auraPulse 5s cubic-bezier(0.16, 1, 0.3, 1) infinite, auraFlow 10s linear infinite;
        }

        .play-btn {
            font-family: 'Montserrat', sans-serif;
            position: relative;
            display: inline-block;
            padding: 16px 50px;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            color: #ffffff;
            background: rgba(10, 6, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .play-btn:hover {
            background: rgba(30, 20, 50, 0.85);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.4);
            letter-spacing: 0.45em;
        }

        .play-btn-container:hover::before {
            opacity: 0.8;
            filter: blur(14px);
            animation: auraPulse 2s cubic-bezier(0.16, 1, 0.3, 1) infinite, auraFlow 5s linear infinite;
        }

        @keyframes auraPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.04); opacity: 0.7; }
        }

        @keyframes auraFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- 3. 星雲の呼吸レイヤー -->
        <div class="nebula-background"></div>

        <!-- 星座の幾何学ライン -->
        <div class="geometry-constellation"></div>

        <!-- 1. 空間の緩やかなワープ効果レイヤー -->
        <div class="stars-layer"></div>

        <!-- 2. コズミック・リング（天体の環） -->
        <div class="cosmic-ring-container">
            <div class="cosmic-ring"></div>
            <div class="cosmic-ring"></div>
        </div>

        <!-- メインコンテンツ -->
        <div class="content-wrapper">
            <!-- 4. タイトル（極細フォント ＆ スキャン演出） -->
            <h1 class="game-title">Stellar Odyssey</h1>

            <!-- 2. ボタンからのオーラエフェクト -->
            <div class="play-btn-container">
                <button class="play-btn">PLAY</button>
            </div>
        </div>
    </div>

</body>
</html>
