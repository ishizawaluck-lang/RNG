<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LULLABY - COMPLETE REBUILD</title>
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --gray-dark: #111111;
    --gray-mid: #333333;
    --silver: #888888;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    background-color: var(--black);
    color: var(--white);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* 1. タイトル画面（流動する雲海アニメーション） */
  #title-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, var(--white) 0%, #dcdcdc 40%, var(--black) 100%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1.5s ease-in-out;
  }
  .cloud-sea {
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9) 0%, rgba(180,180,180,0.3) 50%, transparent 80%);
    animation: moveClouds 20s linear infinite;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  @keyframes moveClouds {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    50% { transform: scale(1.15) translate(-4%, -4%) rotate(3deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }
  .title-logo {
    font-size: clamp(3rem, 8vw, 10rem);
    font-weight: 100;
    color: var(--black);
    letter-spacing: 0.5em;
    z-index: 2;
    text-shadow: 0 0 30px rgba(255,255,255,0.9);
    margin-bottom: 50px;
  }
  .play-diamond-btn {
    width: 130px; height: 130px;
    transform: rotate(45deg);
    border: 1px solid var(--black);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: transparent;
    transition: background 0.3s;
    z-index: 2;
  }
  .play-diamond-btn:hover { background: var(--black); }
  .play-diamond-btn span {
    transform: rotate(-45deg);
    font-weight: 100;
    letter-spacing: 0.2em;
    color: var(--black);
    transition: color 0.3s;
  }
  .play-diamond-btn:hover span { color: var(--white); }

  /* 2. メインゲーム画面 */
  #main-screen {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
  }

  /* 左上のひし形アイコンメニュー（重なり完全防止：縦に余裕を持ったグリッド配置） */
  #ui-container {
    position: absolute;
    top: 30px; left: 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 20;
  }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
  }
  .diamond-icon {
    width: 44px; height: 44px;
    transform: rotate(45deg);
    border: 1px solid var(--white);
    background: var(--gray-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .menu-row:hover .diamond-icon { background: var(--white); }
  .diamond-icon svg {
    transform: rotate(-45deg);
    width: 18px; height: 18px;
    fill: var(--white);
    transition: fill 0.2s;
  }
  .menu-row:hover .diamond-icon svg { fill: var(--black); }
  .menu-text {
    font-size: 0.75rem;
    font-weight: 100;
    letter-spacing: 0.25em;
    color: var(--silver);
    white-space: nowrap;
    transition: color 0.2s;
  }
  .menu-row:hover .menu-text { color: var(--white); }

  /* 下部 ROLL ボタンエリア */
  #roll-container {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 25px;
    z-index: 20;
  }
  .roll-action-btn {
    width: 150px; height: 45px;
    transform: skewX(-15deg);
    border: 1px solid var(--white);
    background: transparent;
    color: var(--white);
    font-weight: 100;
    letter-spacing: 0.2em;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.2s, color 0.2s;
  }
  .roll-action-btn span { transform: skewX(15deg); }
  .roll-action-btn:hover:not(:disabled) { background: var(--white); color: var(--black); }
  .roll-action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ガチャ結果表示 */
  #gacha-display {
    position: absolute;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 15;
  }
  .res-name { font-size: 2.5rem; font-weight: 100; letter-spacing: 0.4em; margin-bottom: 10px; }
  .res-prob { font-size: 0.8rem; font-weight: 100; color: var(--silver); letter-spacing: 0.2em; }

  /* モーダル共通ウインドウ */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 50;
    display: none;
    justify-content: center;
    align-items: center;
  }
  .modal-box {
    width: 450px; max-height: 80vh;
    background: var(--black);
    border: 1px solid var(--white);
    padding: 30px;
    position: relative;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 0.9rem;
    font-weight: 100;
    letter-spacing: 0.3em;
    border-bottom: 1px solid var(--gray-mid);
    padding-bottom: 12px;
    margin-bottom: 20px;
    text-align: center;
  }
  .close-modal {
    position: absolute; top: 15px; right: 20px;
    cursor: pointer; font-weight: 100; font-size: 1.2rem;
  }
  .list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px dotted var(--gray-mid);
    font-size: 0.8rem;
    font-weight: 100;
  }

  /* 📌 厳格なクラフトボタン無効化デザイン */
  .craft-exec-btn {
    border: 1px solid var(--white);
    background: transparent;
    color: var(--white);
    padding: 6px 16px;
    font-weight: 100;
    letter-spacing: 0.15s;
    cursor: pointer;
    font-size: 0.75rem;
    transition: 0.2s;
  }
  .craft-exec-btn:hover:not(:disabled) {
    background: var(--white);
    color: var(--black);
  }
  .craft-exec-btn:disabled {
    border-color: var(--gray-mid);
    color: var(--gray-mid);
    background: var(--gray-dark);
    cursor: not-allowed;
    opacity: 0.4;
  }

  /* 3. カットシーン・演出オーバーレイ */
  #cutscene-layer {
    position: absolute; inset: 0;
    z-index: 80;
    pointer-events: none;
    display: none;
    justify-content: center;
    align-items: center;
  }
  .cs-counter-text {
    font-size: 3.5rem; font-weight: 100; letter-spacing: 0.2em; color: var(--white);
  }
  .cs-crack-bg {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 10%, rgba(255,255,255,0.3) 90%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .invert-mode { filter: invert(1); }
  .shake-mode { animation: screenShake 0.08s infinite; }
  @keyframes screenShake {
    0% { transform: translate(0,0); }
    50% { transform: translate(5px, -5px); }
    100% { transform: translate(-5px, 5px); }
  }
</style>
</head>
<body>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <div class="cloud-sea"></div>
    <div class="title-logo">LULLABY</div>
    <div class="play-diamond-btn" onclick="startApp()">
      <span>PLAY</span>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="main-screen">
    <canvas id="bg-canvas"></canvas>

    <!-- 左メニュー（重なりゼロの縦並び） -->
    <div id="ui-container">
      <div class="menu-row" onclick="openModal('backpack-modal')">
        <div class="diamond-icon">
          <svg viewBox="0 0 24 24"><path d="M19 6h-2V4c0-1.1-.9-2-2-2H9C7.9 2 7 2.9 7 4v2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10-2h6v2H9V4zm10 16H5V8h14v12z"/></svg>
        </div>
        <div class="menu-text">BACKPACK</div>
      </div>
      <div class="menu-row" onclick="openModal('craft-modal')">
        <div class="diamond-icon">
          <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.1L9.4 6.6 6.6 9.4 1.9 4.7C.6 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
        </div>
        <div class="menu-text">CRAFT FORGE</div>
      </div>
    </div>

    <!-- ガチャ結果 -->
    <div id="gacha-display">
      <div class="res-name" id="res-name">---</div>
      <div class="res-prob" id="res-prob">1 / 1</div>
    </div>

    <!-- ROLLボタン -->
    <div id="roll-container">
      <button class="roll-action-btn" id="btn-roll" onclick="executeRoll()"><span>ROLL</span></button>
      <button class="roll-action-btn" id="btn-auto" onclick="toggleAutoRoll()"><span>AUTO</span></button>
    </div>
  </div>

  <!-- モーダル: バックパック -->
  <div class="modal-overlay" id="backpack-modal">
    <div class="modal-box">
      <div class="close-modal" onclick="closeModal('backpack-modal')">✕</div>
      <div class="modal-title">BACKPACK & MATERIALS</div>
      <div id="backpack-list"></div>
    </div>
  </div>

  <!-- モーダル: クラフト -->
  <div class="modal-overlay" id="craft-modal">
    <div class="modal-box">
      <div class="close-modal" onclick="closeModal('craft-modal')">✕</div>
      <div class="modal-title">CRAFT FORGE</div>
      <div id="craft-list"></div>
    </div>
  </div>

  <!-- カットシーンオーバーレイ -->
  <div id="cutscene-layer">
    <div class="cs-crack-bg" id="cs-crack"></div>
    <div class="cs-counter-text" id="cs-counter">1 / 0</div>
  </div>

<script>
// --- データ定義 ---
const MATERIALS = {
  1: { name: "Iron Dust", count: 2 },    // 初期所持数 2
  2: { name: "Void Shard", count: 0 }    // 初期所持数 0 (不足によりクラフトボタンが必ずグレーアウト・ロックされる)
};

const CRAFT_RECIPES = [
  { id: 'r1', name: 'Iron Gauntlet', costMatId: 1, costAmount: 1 }, // 所持2個 >= 必要1個 （作成可能）
  { id: 'r2', name: 'Void Blade', costMatId: 2, costAmount: 5 }       // 所持0個 < 必要5個 （完全ロック）
];

const Auras = [
  { name: "Dust", prob: 5 },
  { name: "Stone", prob: 25 },
  { name: "Iron", prob: 120 },
  { name: "Steel", prob: 850 },
  { name: "END OF TIME (Rare)", prob: 250000 } // カットシーン発生用
];

let isRolling = false;
let autoTimer = null;

// --- アプリ起動 ---
function startApp() {
  const title = document.getElementById('title-screen');
  title.style.opacity = '0';
  setTimeout(() => {
    title.style.display = 'none';
    const main = document.getElementById('main-screen');
    main.style.display = 'block';
    setTimeout(() => main.style.opacity = '1', 50);
    initCanvas();
  }, 1000);
}

// --- モーダル制御 ---
function openModal(id) {
  if(id === 'backpack-modal') renderBackpack();
  if(id === 'craft-modal') renderCraft();
  document.getElementById(id).style.display = 'flex';
}
function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function renderBackpack() {
  const container = document.getElementById('backpack-list');
  container.innerHTML = '';
  for(let id in MATERIALS) {
    container.innerHTML += `
      <div class="list-row">
        <span>[MAT] ${MATERIALS[id].name}</span>
        <span>x${MATERIALS[id].count}</span>
      </div>
    `;
  }
}

// 📌 厳格なクラフト素材判定とボタン制御
function renderCraft() {
  const container = document.getElementById('craft-list');
  container.innerHTML = '';

  CRAFT_RECIPES.forEach(recipe => {
    const mat = MATERIALS[recipe.costMatId];
    const hasEnough = mat.count >= recipe.costAmount; // 判定

    container.innerHTML += `
      <div class="list-row">
        <div>
          <div>${recipe.name}</div>
          <div style="font-size:0.65rem; color:var(--silver);">Req: ${mat.name} (${mat.count}/${recipe.costAmount})</div>
        </div>
        <button class="craft-exec-btn" ${hasEnough ? '' : 'disabled'} onclick="craftItem('${recipe.id}')">
          CRAFT
        </button>
      </div>
    `;
  });
}

function craftItem(recipeId) {
  const recipe = CRAFT_RECIPES.find(r => r.id === recipeId);
  const mat = MATERIALS[recipe.costMatId];

  // 念のための二重ガード
  if(mat.count >= recipe.costAmount) {
    mat.count -= recipe.costAmount; // 素材を消費
    alert(`${recipe.name} を作成しました！`);
    renderCraft(); // ボタン状態を再評価して更新
  } else {
    alert("素材が不足しています。");
  }
}

// --- ガチャ・演出処理 ---
function executeRoll() {
  if (isRolling) return;
  isRolling = true;
  document.getElementById('btn-roll').disabled = true;

  // 抽選
  const result = Auras[Math.floor(Math.random() * Auras.length)];

  if (result.prob >= 100000) {
    playCutscene(result);
  } else {
    showResult(result);
    isRolling = false;
    document.getElementById('btn-roll').disabled = false;
  }
}

function showResult(aura) {
  document.getElementById('res-name').innerText = aura.name;
  document.getElementById('res-prob').innerText = `1 / ${aura.prob.toLocaleString()}`;
}

function toggleAutoRoll() {
  const btn = document.getElementById('btn-auto');
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    btn.style.background = 'transparent';
    btn.style.color = 'var(--white)';
  } else {
    btn.style.background = 'var(--white)';
    btn.style.color = 'var(--black)';
    autoTimer = setInterval(() => {
      if(!isRolling) executeRoll();
    }, 600);
  }
}

// レア演出（カットシーン）
function playCutscene(aura) {
  const layer = document.getElementById('cutscene-layer');
  const counter = document.getElementById('cs-counter');
  const crack = document.getElementById('cs-crack');
  
  layer.style.display = 'flex';
  document.body.classList.add('invert-mode', 'shake-mode');
  crack.style.opacity = '1';

  let current = 0;
  let target = aura.prob;
  let startTime = performance.now();

  function animateCount(time) {
    let progress = Math.min((time - startTime) / 2000, 1);
    current = Math.floor(Math.pow(progress, 3) * target);
    counter.innerText = `1 / ${current.toLocaleString()}`;

    if (progress < 1) {
      requestAnimationFrame(animateCount);
    } else {
      counter.innerText = `1 / ${target.toLocaleString()}`;
      setTimeout(() => {
        layer.style.display = 'none';
        document.body.classList.remove('invert-mode', 'shake-mode');
        crack.style.opacity = '0';
        showResult(aura);
        isRolling = false;
        document.getElementById('btn-roll').disabled = false;
      }, 1200);
    }
  }
  requestAnimationFrame(animateCount);
}

// --- 背景パーティクル ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function initCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];
  for(let i=0; i<300; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: Math.random() * 1.5
    });
  }
  loopCanvas();
}

function loopCanvas() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffffff';
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
    if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(loopCanvas);
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
