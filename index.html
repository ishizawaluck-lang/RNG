<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Idle -待機画面-</title>
    <style>
        /* === 基本スタイル === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #05020a;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05020a 100%);
        }

        /* === 3. 星雲の呼吸（パルス）エフェクト === */
        .nebula-background {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(120, 40, 200, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(40, 100, 220, 0.2) 0%, transparent 60%);
            opacity: 0.7;
            filter: blur(40px);
            z-index: 1;
            animation: nebulaPulse 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes nebulaPulse {
            0% {
                opacity: 0.5;
                filter: blur(35px) scale(1);
            }
            100% {
                opacity: 0.9;
                filter: blur(55px) scale(1.08);
            }
        }

        /* === 1. 空間の緩やかなワープ効果（星々レイヤー） === */
        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, #7df9ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffdfba, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 130px 80px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: cosmicWarp 25s linear infinite;
        }

        @keyframes cosmicWarp {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.15) rotate(3deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 0.7;
            }
        }

        /* === コンテンツ本体 === */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* === 4. タイトルの静かなグリッチ / スキャンエフェクト === */
        .game-title {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 30%, #a78bfa 70%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.4);
            margin-bottom: 3rem;
            position: relative;
            animation: titleGlitch 6s ease infinite;
        }

        /* スキャン線演出 */
        .game-title::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-20deg);
            animation: scanLine 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes titleGlitch {
            0%, 92%, 98%, 100% {
                transform: translate(0);
                filter: drop-shadow(0 0 10px rgba(167,139,250,0.5));
            }
            94% {
                transform: translate(-2px, 1px) skewX(-2deg);
                filter: drop-shadow(2px -1px 15px rgba(56,189,248,0.8));
            }
            96% {
                transform: translate(2px, -1px) skewX(2deg);
                filter: drop-shadow(-2px 1px 15px rgba(236,72,153,0.8));
            }
        }

        @keyframes scanLine {
            0%, 85% {
                left: -100%;
            }
            95%, 100% {
                left: 200%;
            }
        }

        /* === 2. ボタンからのオーラエフェクト === */
        .play-btn-container {
            position: relative;
            display: inline-block;
        }

        /* オーラのモヤ・粒子を表現する擬似要素 */
        .play-btn-container::before {
            content: '';
            position: absolute;
            inset: -8px;
            background: linear-gradient(45deg, #38bdf8, #a78bfa, #ec4899, #38bdf8);
            background-size: 300% 300%;
            border-radius: 50px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(12px);
            animation: auraPulse 4s ease infinite, auraFlow 8s linear infinite;
        }

        .play-btn {
            position: relative;
            display: inline-block;
            padding: 18px 54px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(167, 139, 250, 0.5);
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, rgba(49, 46, 129, 0.9), rgba(30, 41, 59, 0.9));
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.8);
            transform: translateY(-2px);
        }

        /* ホバー時はオーラの明滅が速くなり、輝きが増す */
        .play-btn-container:hover::before {
            opacity: 0.9;
            filter: blur(16px);
            animation: auraPulse 1.5s ease infinite, auraFlow 4s linear infinite;
        }

        @keyframes auraPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes auraFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- 3. 星雲の呼吸（パルス）レイヤー -->
        <div class="nebula-background"></div>

        <!-- 1. 空間の緩やかなワープ効果レイヤー -->
        <div class="stars-layer"></div>

        <!-- メインコンテンツ -->
        <div class="content-wrapper">
            <!-- 4. タイトルの静かなグリッチ / スキャンエフェクト -->
            <h1 class="game-title">Stellar Odyssey</h1>

            <!-- 2. ボタンからのオーラエフェクト -->
            <div class="play-btn-container">
                <button class="play-btn">PLAY</button>
            </div>
        </div>
    </div>

</body>
</html>
