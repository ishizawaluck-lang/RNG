<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL RESONANCE: MYTHIC RNG</title>
    <!-- Google Fonts: Cinzel Decorative & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@250;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #010103;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0f0724 0%, #030107 60%, #010103 100%);
            perspective: 1200px;
            overflow: hidden;
        }

        /* === 背景の星雲・星くずレイヤー === */
        .nebula-background {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(217, 119, 6, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 30% 40%, rgba(147, 51, 234, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 70% 60%, rgba(14, 165, 233, 0.15) 0%, transparent 60%);
            opacity: 0.8;
            filter: blur(50px);
            z-index: 1;
            animation: nebulaPulse 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes nebulaPulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.08); opacity: 0.9; }
        }

        .stars-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background-image: 
                radial-gradient(1px 1px at 20px 40px, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 90px 150px, #fde047, transparent),
                radial-gradient(1px 1px at 160px 80px, #7df9ff, transparent),
                radial-gradient(2px 2px at 220px 200px, #ffdfba, transparent);
            background-size: 200px 200px;
            animation: starsWarp 30s linear infinite;
        }

        @keyframes starsWarp {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            50% { transform: scale(1.1) rotate(2deg); opacity: 0.9; }
            100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
        }

        /* === 1, 2, 3. 神聖な太陽の魔法陣（アストロラビ・コア） === */
        .sun-magic-circle {
            position: absolute;
            top: 45%;
            left: 50%;
            width: 600px;
            height: 600px;
            margin: -300px 0 0 -300px;
            z-index: 3;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. コア中心（眩い純白の太陽） */
        .sun-core {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #ffffff,
                0 0 40px #fef08a,
                0 0 70px #f59e0b,
                0 0 120px rgba(245, 158, 11, 0.6);
            z-index: 6;
            animation: corePulse 3s ease-in-out infinite alternate;
        }

        @keyframes corePulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 15px #ffffff, 0 0 30px #fef08a, 0 0 60px #f59e0b;
            }
            100% {
                transform: scale(1.08);
                box-shadow: 0 0 25px #ffffff, 0 0 50px #fef08a, 0 0 90px #f59e0b, 0 0 150px rgba(245, 158, 11, 0.8);
            }
        }

        /* 1. ルーン文字・幾何学の環（Inner Ring） */
        .rune-ring {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px dashed rgba(250, 204, 21, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3), inset 0 0 15px rgba(250, 204, 21, 0.3);
            z-index: 5;
            animation: ringRotateClockwise 20s linear infinite;
        }

        .rune-ring::before {
            content: '';
            position: absolute;
            inset: -12px;
            border: 2px solid rgba(253, 224, 71, 0.4);
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(250,204,21,0.2) 0deg 10deg, transparent 10deg 20deg);
        }

        /* 2. 放射状に突き刺さる「聖なる光線（Spikes）」 */
        .sun-spikes {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 4;
            animation: ringRotateCounter 40s linear infinite;
        }

        .spike {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 280px;
            background: linear-gradient(to top, transparent, rgba(255,255,255,0.9), #fde047, transparent);
            transform-origin: top center;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        /* 20本の光線を綺麗に放射状に配置 */
        .spike:nth-child(1) { transform: rotate(0deg) translateY(-50%); }
        .spike:nth-child(2) { transform: rotate(18deg) translateY(-50%); }
        .spike:nth-child(3) { transform: rotate(36deg) translateY(-50%); }
        .spike:nth-child(4) { transform: rotate(54deg) translateY(-50%); }
        .spike:nth-child(5) { transform: rotate(72deg) translateY(-50%); }
        .spike:nth-child(6) { transform: rotate(90deg) translateY(-50%); }
        .spike:nth-child(7) { transform: rotate(108deg) translateY(-50%); }
        .spike:nth-child(8) { transform: rotate(126deg) translateY(-50%); }
        .spike:nth-child(9) { transform: rotate(144deg) translateY(-50%); }
        .spike:nth-child(10) { transform: rotate(162deg) translateY(-50%); }
        .spike:nth-child(11) { transform: rotate(180deg) translateY(-50%); }
        .spike:nth-child(12) { transform: rotate(198deg) translateY(-50%); }
        .spike:nth-child(13) { transform: rotate(216deg) translateY(-50%); }
        .spike:nth-child(14) { transform: rotate(234deg) translateY(-50%); }
        .spike:nth-child(15) { transform: rotate(252deg) translateY(-50%); }
        .spike:nth-child(16) { transform: rotate(270deg) translateY(-50%); }
        .spike:nth-child(17) { transform: rotate(288deg) translateY(-50%); }
        .spike:nth-child(18) { transform: rotate(306deg) translateY(-50%); }
        .spike:nth-child(19) { transform: rotate(324deg) translateY(-50%); }
        .spike:nth-child(20) { transform: rotate(342deg) translateY(-50%); }

        /* 3. ゴールドの神紋・幾何学エフェクト（Outer Sigils） */
        .outer-sigil-layer {
            position: absolute;
            width: 480px;
            height: 480px;
            border: 1.5px solid rgba(245, 158, 11, 0.4);
            border-radius: 40%;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.25), inset 0 0 30px rgba(245, 158, 11, 0.25);
            z-index: 4;
            animation: ringRotateClockwise 25s linear infinite;
        }

        .outer-sigil-layer::before {
            content: '';
            position: absolute;
            inset: -35px;
            border: 1px solid rgba(14, 165, 233, 0.35);
            border-radius: 35%;
            transform: rotate(45deg);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
        }

        @keyframes ringRotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes ringRotateCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* === コンテンツ本体 === */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        /* 4. タイトル（極細ゴールドフォント ＆ 特大文字間隔） */
        .game-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.8rem, 4vw, 3.6rem);
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 20%, #fde047 60%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
            margin-bottom: 2.5rem;
            position: relative;
            animation: titleFloat 6s ease-in-out infinite alternate;
        }

        @keyframes titleFloat {
            0% { transform: translateY(0); filter: drop-shadow(0 0 10px rgba(253,224,71,0.5)); }
            100% { transform: translateY(-5px); filter: drop-shadow(0 0 20px rgba(253,224,71,0.8)); }
        }

        /* 4. PLAYボタン（魔法陣の光をまとった神聖アーティファクト仕様） */
        .play-btn-container {
            position: relative;
            display: inline-block;
            border-radius: 40px;
        }

        .play-btn-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            background: linear-gradient(45deg, #f59e0b, #38bdf8, #ffffff, #f59e0b);
            background-size: 300% 300%;
            border-radius: 45px;
            z-index: -1;
            opacity: 0.6;
            filter: blur(12px);
            animation: btnGlow 4s ease infinite, colorFlow 8s linear infinite;
        }

        .play-btn {
            font-family: 'Montserrat', sans-serif;
            position: relative;
            display: inline-block;
            padding: 16px 50px;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            color: #ffffff;
            background: rgba(10, 5, 20, 0.85);
            border: 1px solid rgba(253, 224, 71, 0.6);
            border-radius: 40px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3), inset 0 0 10px rgba(253, 224, 71, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .play-btn:hover {
            background: rgba(30, 15, 50, 0.95);
            border-color: #ffffff;
            color: #fffbeb;
            box-shadow: 0 0 35px rgba(253, 224, 71, 0.8), 0 0 60px rgba(14, 165, 233, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            letter-spacing: 0.45em;
        }

        .play-btn-container:hover::before {
            opacity: 0.9;
            filter: blur(16px);
            animation: btnGlow 1.5s ease infinite, colorFlow 3s linear infinite;
        }

        @keyframes btnGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.04); opacity: 0.9; }
        }

        @keyframes colorFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- 背景ネビュラ＆星屑 -->
        <div class="nebula-background"></div>
        <div class="stars-layer"></div>

        <!-- 神聖な太陽の魔法陣（中央オブジェクト） -->
        <div class="sun-magic-circle">
            <!-- 1. 眩い純白のコア -->
            <div class="sun-core"></div>
            <!-- 1. ルーン文字の環 -->
            <div class="rune-ring"></div>
            <!-- 3. ゴールドの神紋・幾何学エフェクト (逆回転) -->
            <div class="outer-sigil-layer"></div>
            <!-- 2. 放射状の光の槍 (スパイク) -->
            <div class="sun-spikes">
                <div class="spike"></div><div class="spike"></div><div class="spike"></div><div class="spike"></div>
                <div class="spike"></div><div class="spike"></div><div class="spike"></div><div class="spike"></div>
                <div class="spike"></div><div class="spike"></div><div class="spike"></div><div class="spike"></div>
                <div class="spike"></div><div class="spike"></div><div class="spike"></div><div class="spike"></div>
                <div class="spike"></div><div class="spike"></div><div class="spike"></div><div class="spike"></div>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="content-wrapper">
            <h1 class="game-title">ASTRAL RESONANCE: MYTHIC RNG</h1>

            <div class="play-btn-container">
                <button class="play-btn">PLAY</button>
            </div>
        </div>
    </div>

</body>
</html>
