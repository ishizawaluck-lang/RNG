<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL</title>
    <!-- Google Fonts: Cinzel & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: radial-gradient(circle at center, #080412 0%, #000000 75%);
            perspective: 1200px;
            overflow: hidden;
            padding: 35px 40px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* === 漆黒の背景 === */
        .deep-space-bg {
            position: absolute;
            inset: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 50% 50%, rgba(15, 8, 30, 0.9) 0%, transparent 60%);
            opacity: 0.6;
            filter: blur(90px);
            z-index: 1;
            pointer-events: none;
        }

        /* === JavaScript制御のスターダスト用キャンバス === */
        #starfield-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* === 逆光の惑星シルエット ＆ ソーラー・フレア === */
        .parallax-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            overflow: hidden;
        }

        .planet-main {
            top: 12%;
            right: 8%;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle at 30% 30%, #06060a 0%, #000000 75%);
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.95), 0 0 25px rgba(253, 224, 71, 0.2), 0 0 5px rgba(255, 255, 255, 0.4);
        }

        .planet-main::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(253, 224, 71, 0.8);
            border-right-color: rgba(255, 255, 255, 0.8);
            animation: planetFlare 6s linear infinite;
        }

        @keyframes planetFlare {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .planet-sub {
            bottom: 10%;
            left: 10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 70% 70%, #040408 0%, #000000 80%);
            box-shadow: inset 12px 12px 25px rgba(0,0,0,0.9), 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* === ホログラム風宇宙ステータスUI === */
        .holo-ui {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            font-weight: 100;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.4);
            z-index: 25;
            pointer-events: none;
            animation: uiFlicker 4s ease-in-out infinite;
        }

        .ui-top-left { top: 25px; left: 35px; }
        .ui-top-right { top: 25px; right: 35px; text-align: right; }
        .ui-bottom-left { bottom: 25px; left: 35px; }
        .ui-bottom-right { bottom: 25px; right: 35px; text-align: right; }

        @keyframes uiFlicker {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
            52% { opacity: 0.2; }
            54% { opacity: 0.6; }
        }

        /* === タイトル（Cinzel 極細） === */
        .header-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: 5px;
            transition: transform 0.1s ease-out;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 4.5vw, 3.4rem);
            font-weight: 400;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            letter-spacing: 2.2em;
            padding-left: 2.2em;
            animation: titleIntro 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        @keyframes titleIntro {
            0% {
                opacity: 0;
                letter-spacing: 2.2em;
                text-shadow: 0 0 0px rgba(253, 224, 71, 0);
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                letter-spacing: 0.6em;
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.7), 0 0 45px rgba(253, 224, 71, 0.5);
                transform: translateY(0);
            }
        }

        /* === 巨大太陽魔法陣コア ＆ 軌道 === */
        .magic-circle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            margin: -400px 0 0 -400px;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            animation: deepPulse 4s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }

        @keyframes deepPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .sun-core {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 25px #ffffff,
                0 0 60px #ffffff,
                0 0 120px #fef08a,
                0 0 220px #f59e0b,
                0 0 350px rgba(245, 158, 11, 0.8),
                0 0 500px rgba(217, 70, 239, 0.4);
            z-index: 10;
        }

        .gravity-wave {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(253, 224, 71, 0.8);
            border-radius: 50%;
            z-index: 9;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.5), inset 0 0 20px rgba(253, 224, 71, 0.5);
            animation: gravityWaveExpand 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        }
        .gravity-wave:nth-child(2) { animation-delay: 1.75s; }

        @keyframes gravityWaveExpand {
            0% { width: 100px; height: 100px; opacity: 1; transform: scale(1); }
            100% { width: 750px; height: 750px; opacity: 0; transform: scale(1.1); border-color: rgba(56, 189, 248, 0.2); }
        }

        .orbit-path {
            position: absolute;
            border: 1px solid rgba(253, 224, 71, 0.18);
            border-radius: 50%;
            z-index: 8;
        }
        .orbit-1 { width: 580px; height: 580px; transform: rotate(25deg); animation: orbitRotateClockwise 25s linear infinite; }
        .orbit-2 { width: 720px; height: 720px; transform: rotate(-35deg); animation: orbitRotateCounter 38s linear infinite; }

        .orbit-satellite {
            position: absolute;
            top: -4px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #fde047;
            border-radius: 50%;
            box-shadow: 0 0 10px #fde047, 0 0 20px #ffffff;
        }

        @keyframes orbitRotateClockwise {
            0% { transform: rotate(25deg); }
            100% { transform: rotate(385deg); }
        }
        @keyframes orbitRotateCounter {
            0% { transform: rotate(-35deg); }
            100% { transform: rotate(-395deg); }
        }

        .inner-rune-ring {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 1px solid rgba(253, 224, 71, 0.7);
            border-radius: 50%;
            z-index: 7;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
            animation: rotateClockwise 35s linear infinite;
        }

        .inner-rune-ring::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(253,224,71,0.25) 0deg 15deg, transparent 15deg 30deg);
        }

        .sun-spikes-layer {
            position: absolute;
            inset: 0;
            z-index: 6;
            animation: rotateCounter 55s linear infinite;
        }

        .spike {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 420px;
            background: linear-gradient(to top, transparent, rgba(255,255,255,0.9), #fde047, transparent);
            transform-origin: top center;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }
        .spike:nth-child(n) { transform: rotate(calc(n * 20deg)) translateY(-50%); }

        .outer-sigil-system {
            position: absolute;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            z-index: 5;
            animation: rotateClockwise 70s linear infinite;
        }

        .sigil-wing {
            position: absolute;
            inset: 15px;
            border: 1.5px solid rgba(245, 158, 11, 0.6);
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3), inset 0 0 30px rgba(245, 158, 11, 0.3);
        }

        .sigil-wing::before {
            content: '';
            position: absolute;
            inset: -40px;
            border: 1px solid rgba(253, 224, 71, 0.4);
            border-radius: 60% 40% 50% 50% / 40% 60% 50% 50%;
            transform: rotate(25deg);
        }

        @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* === フッター：PLAYボタン === */
        .footer-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-bottom: 10px;
            opacity: 0;
            animation: btnFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
            transition: transform 0.1s ease-out;
        }

        @keyframes btnFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .play-btn {
            font-family: 'Cinzel', serif;
            position: relative;
            display: inline-block;
            padding: 14px 45px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            animation: btnPulse 3s ease-in-out infinite alternate;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-left: calc(45px + 0.5em);
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(253, 224, 71, 0.9);
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.6), inset 0 0 15px rgba(253, 224, 71, 0.3);
            letter-spacing: 0.6em;
            transform: translateY(-2px);
        }

        @keyframes btnPulse {
            0% { border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
            100% { border-color: rgba(253, 224, 71, 0.7); box-shadow: 0 0 25px rgba(253, 224, 71, 0.35); }
        }

        /* === 超新星爆発（ホワイトアウト）トリガー演出クラス === */
        .screen-container.is-triggered .sun-core {
            animation: supernovaCore 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important;
        }

        .screen-container.is-triggered .magic-circle-container {
            animation: supernovaCore 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important;
        }

        .screen-container.is-triggered .header-area,
        .screen-container.is-triggered .footer-area,
        .screen-container.is-triggered .holo-ui,
        .screen-container.is-triggered .planet {
            transition: opacity 0.4s ease-out;
            opacity: 0 !important;
        }

        @keyframes supernovaCore {
            0% { transform: scale(1); }
            30% { transform: scale(2.5); filter: brightness(1.5); }
            100% { transform: scale(35); filter: brightness(3); opacity: 1; }
        }

        /* 画面全体を覆うフラッシュオーバーレイ */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
        .screen-container.is-triggered .flash-overlay {
            opacity: 1;
            transition-delay: 0.5s;
        }
    </style>
</head>
<body>

    <div class="screen-container" id="screenContainer">
        <div class="flash-overlay"></div>

        <!-- ホログラム風宇宙ステータスUI -->
        <div class="holo-ui ui-top-left">SYS_STATUS: CONNECTED // ASTRAL_NET</div>
        <div class="holo-ui ui-top-right">CORE_ENERGY: 99.8% STABLE</div>
        <div class="holo-ui ui-bottom-left">COORDINATES: SEC-09 // V-A</div>
        <div class="holo-ui ui-bottom-right">RNG_SEED: 0x9F4A7B_AX</div>

        <div class="deep-space-bg"></div>

        <!-- 1. 星くず描画用キャンバス（JSで1000個生成） -->
        <canvas id="starfield-canvas"></canvas>

        <!-- 2. 惑星（パララックス中景） -->
        <div class="parallax-layer" data-depth="0.02">
            <div class="planet planet-main"></div>
            <div class="planet planet-sub"></div>
        </div>

        <!-- ヘッダータイトル（パララックス手前景） -->
        <header class="header-area" data-depth="0.05" id="headerArea">
            <h1 class="game-title">ASTRAL</h1>
        </header>

        <!-- 巨大太陽魔法陣コア（パララックス奥景） -->
        <div class="magic-circle-container" data-depth="-0.03" id="magicCore">
            <div class="orbit-path orbit-1"><div class="orbit-satellite"></div></div>
            <div class="orbit-path orbit-2"><div class="orbit-satellite" style="width: 6px; height: 6px; background: #38bdf8; box-shadow: 0 0 10px #38bdf8;"></div></div>
            <div class="gravity-wave"></div>
            <div class="gravity-wave"></div>
            <div class="outer-sigil-system"><div class="sigil-wing"></div></div>
            <div class="sun-spikes-layer">
                <!-- 20本の鋭い光線 -->
                <script>
                    for(let i=0; i<20; i++) {
                        document.write(`<div class="spike" style="transform: rotate(${i * 18}deg) translateY(-50%);"></div>`);
                    }
                </script>
            </div>
            <div class="inner-rune-ring"></div>
            <div class="sun-core"></div>
        </div>

        <!-- フッター：PLAYボタン -->
        <footer class="footer-area" data-depth="0.04" id="footerArea">
            <button class="play-btn" id="playBtn">PLAY</button>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('starfield-canvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('screenContainer');
            const playBtn = document.getElementById('playBtn');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            // 1. 【1000個以上の星くず動的生成 ＆ 吸い込みロジック】
            const STAR_COUNT = 1100;
            const stars = [];
            let isSupernova = false;

            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * width * 1.8,
                    y: (Math.random() - 0.5) * height * 1.8,
                    z: Math.random() * width,
                    size: Math.random() * 1.0 + 0.5,
                    color: Math.random() > 0.85 ? (Math.random() > 0.5 ? '#fde047' : '#38bdf8') : '#ffffff',
                    speed: Math.random() * 3 + 2
                });
            }

            function animateStars() {
                ctx.clearRect(0, 0, width, height);
                const centerX = width / 2;
                const centerY = height / 2;

                for (let i = 0; i < stars.length; i++) {
                    let star = stars[i];

                    if (!isSupernova) {
                        // 通常時：中心へ向かって吸い込まれる
                        star.z -= star.speed;
                        if (star.z <= 0) {
                            star.z = width;
                            star.x = (Math.random() - 0.5) * width * 1.8;
                            star.y = (Math.random() - 0.5) * height * 1.8;
                        }
                    } else {
                        // 3. 超新星爆発時：逆方向に超高速で吹き飛ぶ
                        star.z += star.speed * 8;
                    }

                    // 3D透視投影計算
                    const k = 250 / star.z;
                    const px = star.x * k + centerX;
                    const py = star.y * k + centerY;

                    if (px >= 0 && px <= width && py >= 0 && py <= height) {
                        const pSize = Math.max(0.1, star.size * k * (isSupernova ? 2 : 1));
                        const opacity = Math.min(1, (width - star.z) / width);

                        ctx.fillStyle = star.color;
                        ctx.globalAlpha = Math.max(0, opacity);
                        ctx.beginPath();
                        ctx.arc(px, py, pSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1.0;
                requestAnimationFrame(animateStars);
            }
            animateStars();

            // 2. 【マウス移動連動の3Dパララックス】
            let mouseX = 0;
            let mouseY = 0;
            let currentX = 0;
            let currentY = 0;

            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            // スマホのデバイス傾き（ジャイロセンサー）対応
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null && e.beta !== null) {
                    mouseX = Math.max(-1, Math.min(1, e.gamma / 30));
                    mouseY = Math.max(-1, Math.min(1, e.beta / 30));
                }
            });

            function updateParallax() {
                currentX += (mouseX - currentX) * 0.08;
                currentY += (mouseY - currentY) * 0.08;

                // 各レイヤーを異なる深度で傾ける
                const header = document.getElementById('headerArea');
                const magicCore = document.getElementById('magicCore');
                const footer = document.getElementById('footerArea');

                container.style.transform = `rotateY(${currentX * 4}deg) rotateX(${-currentY * 4}deg)`;
                if(header) header.style.transform = `translate(${currentX * 15}px, ${currentY * 15}px)`;
                if(magicCore) magicCore.style.transform = `translate(${-currentX * 25}px, ${-currentY * 25}px) scale(1)`;
                if(footer) footer.style.transform = `translate(${currentX * 10}px, ${currentY * 10}px)`;

                requestAnimationFrame(updateParallax);
            }
            updateParallax();

            // 3. 【PLAYボタンクリック時の超新星爆発（画面遷移）演出】
            playBtn.addEventListener('click', () => {
                if (isSupernova) return;
                isSupernova = true;
                container.classList.add('is-triggered');

                // 1.2秒後に次画面へ遷移（あるいは演出完了）
                setTimeout(() => {
                    console.log("超新星爆発演出完了：ゲーム本編へ遷移します");
                    // window.location.href = "game_main.html"; // 本番用の遷移先
                }, 1200);
            });
        });
    </script>
</body>
</html>
