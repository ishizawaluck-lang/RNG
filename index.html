<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL</title>
    <!-- Google Fonts: Cinzel & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            perspective: 1200px;
            overflow: hidden;
            padding: 35px 40px;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* === 1. 漆黒の背景 ＆ コズミック・ゴールド・オーロラ === */
        .deep-space-bg {
            position: absolute;
            inset: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 50% 50%, rgba(20, 15, 5, 0.8) 0%, #000000 75%);
            z-index: 1;
            pointer-events: none;
        }

        .cosmic-aurora {
            position: absolute;
            inset: -20%;
            width: 140%;
            height: 140%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.22;
            filter: blur(80px);
            background: 
                radial-gradient(circle at 15% 30%, rgba(245, 158, 11, 0.4) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(253, 224, 71, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(217, 119, 6, 0.3) 0%, transparent 50%);
            animation: auroraShift 18s ease-in-out infinite alternate;
        }

        @keyframes auroraShift {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.08) translate(-3%, 2%) rotate(3deg); }
            100% { transform: scale(0.95) translate(3%, -2%) rotate(-3deg); }
        }

        /* === 2. Canvas描画レイヤー（星屑・星雲・ソーラーフレア） === */
        #universe-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* === 3. 惑星レイヤー（逆光＋ゴールドフレアテイル） === */
        .parallax-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4;
            transition: transform 0.1s ease-out;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            overflow: hidden;
        }

        .planet-main {
            top: 12%;
            right: 8%;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle at 30% 30%, #080600 0%, #000000 75%);
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.95), 0 0 25px rgba(253, 224, 71, 0.25), 0 0 5px rgba(255, 255, 255, 0.4);
        }

        .planet-main::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(253, 224, 71, 0.85);
            border-right-color: rgba(255, 255, 255, 0.7);
            animation: planetFlare 6s linear infinite;
        }

        @keyframes planetFlare {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .planet-tail {
            position: absolute;
            top: 15%;
            right: calc(8% + 280px);
            width: 200px;
            height: 35px;
            background: linear-gradient(to left, rgba(253,224,71,0.6), rgba(245,158,11,0.2), transparent);
            transform: rotate(-25deg);
            filter: blur(10px);
            opacity: 0.75;
            animation: tailPulse 3s ease-in-out infinite alternate;
        }

        @keyframes tailPulse {
            0% { opacity: 0.45; transform: rotate(-25deg) scaleX(0.9); }
            100% { opacity: 0.85; transform: rotate(-25deg) scaleX(1.25); }
        }

        .planet-sub {
            bottom: 10%;
            left: 10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 70% 70%, #060500 0%, #000000 80%);
            box-shadow: inset 12px 12px 25px rgba(0,0,0,0.9), 0 0 15px rgba(245, 158, 11, 0.2);
        }

        /* === 4. ホログラム風宇宙ステータスUI === */
        .holo-ui {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            font-weight: 100;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: rgba(253, 224, 71, 0.45);
            z-index: 25;
            pointer-events: none;
            animation: uiFlicker 4s ease-in-out infinite;
        }

        .ui-top-left { top: 25px; left: 35px; }
        .ui-top-right { top: 25px; right: 35px; text-align: right; }
        .ui-bottom-left { bottom: 25px; left: 35px; }
        .ui-bottom-right { bottom: 25px; right: 35px; text-align: right; }

        @keyframes uiFlicker {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.8; }
            52% { opacity: 0.2; }
            54% { opacity: 0.6; }
        }

        /* === 5. ヘッダータイトル（ホログラム覚醒イントロ） === */
        .header-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: 5px;
            transition: transform 0.1s ease-out;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 4.5vw, 3.4rem);
            font-weight: 400;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            letter-spacing: 2.2em;
            padding-left: 2.2em;
            animation: titleIntro 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        @keyframes titleIntro {
            0% {
                opacity: 0;
                letter-spacing: 2.2em;
                text-shadow: 0 0 0px rgba(253, 224, 71, 0);
                transform: translateY(-10px);
                filter: blur(12px);
            }
            30% {
                opacity: 0.35;
                text-shadow: -5px 0 #f59e0b, 5px 0 #fde047;
            }
            70% {
                opacity: 0.8;
                text-shadow: 2px 0 rgba(245,158,11,0.7), -2px 0 rgba(253,224,71,0.7);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                letter-spacing: 0.6em;
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 45px rgba(253, 224, 71, 0.6);
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        /* === 6. 巨大太陽魔法陣コア（完全ゴールド統一・後光・パルスバースト） === */
        .magic-circle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            margin: -400px 0 0 -400px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            animation: deepPulse 4s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }

        @keyframes deepPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .sun-core {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 25px #ffffff,
                0 0 60px #ffffff,
                0 0 120px #fef08a,
                0 0 220px #f59e0b,
                0 0 350px rgba(245, 158, 11, 0.85),
                0 0 500px rgba(251, 191, 36, 0.5);
            z-index: 10;
            animation: coreAberration 4s ease-in-out infinite;
        }

        @keyframes coreAberration {
            0%, 100% {
                box-shadow: 0 0 25px #ffffff, 0 0 60px #ffffff, 0 0 120px #fef08a, 0 0 220px #f59e0b;
            }
            50% {
                box-shadow: 0 0 45px #ffffff, 0 0 95px #fde047, 0 0 170px #f59e0b, 0 0 320px rgba(245,158,11,0.8), 0 0 480px rgba(253,224,71,0.7);
            }
        }

        .gravity-wave {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(253, 224, 71, 0.85);
            border-radius: 50%;
            z-index: 9;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.5), inset 0 0 20px rgba(253, 224, 71, 0.5);
            animation: gravityWaveExpand 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        }
        .gravity-wave:nth-child(2) { animation-delay: 1.75s; }

        @keyframes gravityWaveExpand {
            0% { width: 100px; height: 100px; opacity: 1; transform: scale(1); }
            100% { width: 900px; height: 900px; opacity: 0; transform: scale(1.1); border-color: rgba(245, 158, 11, 0.2); }
        }

        .orbit-path {
            position: absolute;
            border: 1px solid rgba(253, 224, 71, 0.2);
            border-radius: 50%;
            z-index: 8;
        }
        .orbit-1 { width: 620px; height: 620px; transform: rotate(25deg); animation: orbitRotateClockwise 25s linear infinite; }
        .orbit-2 { width: 780px; height: 780px; transform: rotate(-35deg); animation: orbitRotateCounter 38s linear infinite; }

        .orbit-satellite {
            position: absolute;
            top: -4px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #fde047;
            border-radius: 50%;
            box-shadow: 0 0 10px #fde047, 0 0 20px #ffffff;
        }

        @keyframes orbitRotateClockwise { 0% { transform: rotate(25deg); } 100% { transform: rotate(385deg); } }
        @keyframes orbitRotateCounter { 0% { transform: rotate(-35deg); } 100% { transform: rotate(-395deg); } }

        /* ② 古代の契約：ルーン文字二重円のパルスバースト連動 */
        .inner-rune-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(253, 224, 71, 0.8);
            border-radius: 50%;
            z-index: 7;
            box-shadow: 0 0 25px rgba(253, 224, 71, 0.5);
            animation: runePulseBurst 4s ease-in-out infinite, rotateClockwise 35s linear infinite;
        }

        @keyframes runePulseBurst {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; filter: drop-shadow(0 0 5px rgba(253,224,71,0.5)); }
            50% { transform: scale(1.18) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 25px rgba(253,224,71,0.9)); }
        }

        .inner-rune-ring::before {
            content: '';
            position: absolute;
            inset: -12px;
            border: 1px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(253,224,71,0.3) 0deg 15deg, transparent 15deg 30deg);
        }

        /* ① 神の降臨：天啓の後光（ソーラー・コロナ・レイ：60秒で1周の荘厳な回転） */
        .corona-halo-layer {
            position: absolute;
            inset: -150px;
            z-index: 4;
            pointer-events: none;
            animation: coronaRotate 60s linear infinite;
        }

        .corona-spear {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 1100px;
            background: linear-gradient(to top, transparent, rgba(245,158,11,0.15) 30%, rgba(253,224,71,0.6) 70%, transparent 100%);
            transform-origin: center center;
            transform: translate(-50%, -50%) rotate(var(--corona-rot, 0deg));
            filter: blur(2px);
        }

        @keyframes coronaRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 完全にゴールドのみで構成された波線フレア波動 */
        .sun-spikes-layer {
            position: absolute;
            inset: 0;
            z-index: 6;
            animation: rotateCounter 45s linear infinite;
        }

        .wave-spike {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 680px;
            background: linear-gradient(to top, transparent, rgba(245,158,11,0.7) 30%, rgba(253,224,71,0.95) 70%, #ffffff 100%);
            transform-origin: top center;
            clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
            filter: blur(1px);
            opacity: 0.85;
            animation: waveFlow var(--duration, 3s) ease-in-out infinite alternate;
        }

        @keyframes waveFlow {
            0% { transform: rotate(var(--rot, 0deg)) translateY(-50%) scaleX(0.4) skewX(-5deg); opacity: 0.5; }
            50% { transform: rotate(var(--rot, 0deg)) translateY(-50%) scaleX(1.8) skewX(8deg); opacity: 0.95; }
            100% { transform: rotate(var(--rot, 0deg)) translateY(-50%) scaleX(0.8) skewX(-3deg); opacity: 0.7; }
        }

        .outer-sigil-system {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            z-index: 5;
            animation: rotateClockwise 70s linear infinite;
        }

        .sigil-wing {
            position: absolute;
            inset: 15px;
            border: 1.5px solid rgba(245, 158, 11, 0.7);
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.35), inset 0 0 35px rgba(245, 158, 11, 0.35);
        }

        .sigil-wing::before {
            content: '';
            position: absolute;
            inset: -40px;
            border: 1px solid rgba(253, 224, 71, 0.45);
            border-radius: 60% 40% 50% 50% / 40% 60% 50% 50%;
            transform: rotate(25deg);
        }

        @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* === 7. フッター：PLAYボタン === */
        .footer-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-bottom: 10px;
            opacity: 0;
            animation: btnFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
            transition: transform 0.1s ease-out;
        }

        @keyframes btnFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .play-btn {
            font-family: 'Cinzel', serif;
            position: relative;
            display: inline-block;
            padding: 14px 45px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            animation: btnPulse 3s ease-in-out infinite alternate;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-left: calc(45px + 0.5em);
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(253, 224, 71, 0.9);
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.6), inset 0 0 15px rgba(253, 224, 71, 0.3);
            letter-spacing: 0.6em;
            transform: translateY(-2px);
        }

        @keyframes btnPulse {
            0% { border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
            100% { border-color: rgba(253, 224, 71, 0.7); box-shadow: 0 0 25px rgba(253, 224, 71, 0.35); }
        }

        /* === 8. 超新星爆発（ホワイトアウト）連動演出 === */
        .screen-container.is-triggered .sun-core {
            animation: supernovaCore 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important;
        }

        .screen-container.is-triggered .magic-circle-container {
            animation: supernovaCore 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important;
        }

        .screen-container.is-triggered .header-area,
        .screen-container.is-triggered .footer-area,
        .screen-container.is-triggered .holo-ui,
        .screen-container.is-triggered .planet,
        .screen-container.is-triggered .parallax-layer,
        .screen-container.is-triggered .planet-tail,
        .screen-container.is-triggered .cosmic-aurora,
        .screen-container.is-triggered .corona-halo-layer {
            transition: opacity 0.4s ease-out;
            opacity: 0 !important;
        }

        @keyframes supernovaCore {
            0% { transform: scale(1); }
            30% { transform: scale(2.2); filter: brightness(1.5); }
            100% { transform: scale(45); filter: brightness(4); opacity: 1; }
        }

        .flash-overlay {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            transition: opacity 1.2s ease-in-out;
        }
        .screen-container.is-triggered .flash-overlay {
            opacity: 1;
            transition-delay: 0.3s;
        }
    </style>
</head>
<body>

    <div class="screen-container" id="screenContainer">
        <div class="flash-overlay"></div>

        <!-- ホログラム風宇宙ステータスUI -->
        <div class="holo-ui ui-top-left">SYS_STATUS: CONNECTED // ASTRAL_NET</div>
        <div class="holo-ui ui-top-right">CORE_ENERGY: 99.8% DIVINE</div>
        <div class="holo-ui ui-bottom-left">COORDINATES: SEC-09 // V-A</div>
        <div class="holo-ui ui-bottom-right">RNG_SEED: 0x9F4A7B_AX</div>

        <div class="deep-space-bg"></div>
        <div class="cosmic-aurora"></div>

        <!-- Canvas統合背景（星雲・星くず吸い込み・ゴールドソーラーフレア粒子） -->
        <canvas id="universe-canvas"></canvas>

        <!-- 惑星レイヤー（彗星テイル付き中景） -->
        <div class="parallax-layer" id="planetLayer" data-depth="0.02">
            <div class="planet-tail"></div>
            <div class="planet planet-main"></div>
            <div class="planet planet-sub"></div>
        </div>

        <!-- ヘッダータイトル（ホログラム覚醒イントロ） -->
        <header class="header-area" id="headerArea" data-depth="0.06">
            <h1 class="game-title">ASTRAL</h1>
        </header>

        <!-- 巨大太陽魔法陣コア（完全ゴールド統一・後光・パルスバースト） -->
        <div class="magic-circle-container" id="magicCore" data-depth="-0.03">
            <!-- ① 天啓の後光（ソーラー・コロナ・レイ：12方向に均等配置） -->
            <div class="corona-halo-layer">
                <script>
                    for(let c=0; c<12; c++) {
                        const rot = c * (360/12);
                        document.write(`<div class="corona-spear" style="--corona-rot: ${rot}deg;"></div>`);
                    }
                </script>
            </div>

            <div class="orbit-path orbit-1"><div class="orbit-satellite"></div></div>
            <div class="orbit-path orbit-2"><div class="orbit-satellite" style="width: 6px; height: 6px; background: #f59e0b; box-shadow: 0 0 10px #f59e0b;"></div></div>
            <div class="gravity-wave"></div>
            <div class="gravity-wave"></div>
            <div class="outer-sigil-system"><div class="sigil-wing"></div></div>
            
            <div class="sun-spikes-layer">
                <!-- 32本の完全ゴールド波線フレア波動 -->
                <script>
                    for(let i=0; i<32; i++) {
                        const rot = i * (360/32);
                        const duration = (2.0 + (i % 5) * 0.4).toFixed(1);
                        document.write(`<div class="wave-spike" style="--rot: ${rot}deg; --duration: ${duration}s;"></div>`);
                    }
                </script>
            </div>

            <div class="inner-rune-ring"></div>
            <div class="sun-core"></div>
        </div>

        <!-- フッター：PLAYボタン -->
        <footer class="footer-area" id="footerArea" data-depth="0.04">
            <button class="play-btn" id="playBtn">PLAY</button>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('universe-canvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('screenContainer');
            const playBtn = document.getElementById('playBtn');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            // --- Web Audio API による神秘的アンビエント音楽の自動生成 ---
            let audioCtx = null;
            let isAudioInitialized = false;

            function initAudioSystem() {
                if (isAudioInitialized) return;
                isAudioInitialized = true;

                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                    // 低音パッド音（宇宙の鳴動：コード和音 110Hz, 164.81Hz, 220Hz）
                    const padFreqs = [55.0, 110.0, 164.81, 220.0];
                    padFreqs.forEach(freq => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const filter = audioCtx.createBiquadFilter();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(350, audioCtx.currentTime);

                        gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.045, audioCtx.currentTime + 4.0);

                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                    });

                    // 高音チャイム音（星の瞬きを不定期に奏でるプロシージャル・シンセ）
                    const chimeFreqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    setInterval(() => {
                        if (!audioCtx || audioCtx.state !== 'running') return;
                        if (Math.random() > 0.4) return;

                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        const freq = chimeFreqs[Math.floor(Math.random() * chimeFreqs.length)];
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                        gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.018, audioCtx.currentTime + 0.3);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.5);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 3.6);
                    }, 2200);

                } catch (e) {
                    console.log("Web Audio API not supported or restricted.", e);
                }
            }

            // 初回インタラクション時に音声を有効化
            window.addEventListener('pointerdown', initAudioSystem, { once: true });
            playBtn.addEventListener('mouseenter', initAudioSystem, { once: true });

            // --- クリック/タップ時の神聖な波動（リップル効果）の管理 ---
            const ripples = [];
            window.addEventListener('pointerdown', (e) => {
                ripples.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: 10,
                    maxRadius: Math.max(width, height) * 0.6,
                    alpha: 0.85
                });
            });

            // --- 1. 星雲ガス（Cosmic Dust）の初期化 ---
            const nebulaClouds = [];
            for(let i = 0; i < 5; i++) {
                nebulaClouds.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 300 + 200,
                    color: i % 2 === 0 ? 'rgba(245, 158, 11, 0.035)' : 'rgba(253, 224, 71, 0.025)',
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2
                });
            }

            // --- 2. スターダスト・ストリーム（1600個の星） ---
            const STAR_COUNT = 1600;
            const stars = [];
            let isSupernova = false;

            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * width * 2,
                    y: (Math.random() - 0.5) * height * 2,
                    z: Math.random() * width,
                    size: Math.random() * 1.1 + 0.3,
                    color: Math.random() > 0.75 ? '#fde047' : '#ffffff',
                    speed: Math.random() * 2.2 + 1.2
                });
            }

            // --- ③ 終末の予兆：ゴールド・ソーラー・フレア（神の炎の粒子）システム ---
            const solarFlares = [];
            function spawnSolarFlare() {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2.5 + 1.5;
                solarFlares.push({
                    x: width / 2,
                    y: height / 2,
                    vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 1.2,
                    vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 1.2,
                    size: Math.random() * 4.5 + 2.0,
                    alpha: 0.95,
                    decay: Math.random() * 0.012 + 0.008
                });
            }

            // --- 不定期な彗星（シューティングスター）の管理 ---
            let comets = [];
            let cometTimer = 0;

            function spawnComet() {
                comets.push({
                    x: Math.random() * width,
                    y: -50,
                    vx: (Math.random() - 0.5) * 8 - 6,
                    vy: Math.random() * 8 + 6,
                    length: Math.random() * 120 + 80,
                    alpha: 0.85
                });
            }

            // --- 60fpsメインアニメーションループ ---
            function animateUniverse() {
                ctx.clearRect(0, 0, width, height);
                const centerX = width / 2;
                const centerY = height / 2;

                // A. 星雲ガスの描画と変形
                for(let i = 0; i < nebulaClouds.length; i++) {
                    let cloud = nebulaClouds[i];
                    cloud.x += cloud.vx;
                    cloud.y += cloud.vy;
                    if(cloud.x < -cloud.radius) cloud.x = width + cloud.radius;
                    if(cloud.x > width + cloud.radius) cloud.x = -cloud.radius;
                    if(cloud.y < -cloud.radius) cloud.y = height + cloud.radius;
                    if(cloud.y > height + cloud.radius) cloud.y = -cloud.radius;

                    const grad = ctx.createRadialGradient(cloud.x, cloud.y, 10, cloud.x, cloud.y, cloud.radius);
                    grad.addColorStop(0, cloud.color);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // B. スターダストの吸い込み・吹き飛び処理
                for (let i = 0; i < stars.length; i++) {
                    let star = stars[i];

                    if (!isSupernova) {
                        star.z -= star.speed;
                        if (star.z <= 0) {
                            star.z = width;
                            star.x = (Math.random() - 0.5) * width * 2;
                            star.y = (Math.random() - 0.5) * height * 2;
                        }
                    } else {
                        star.z += star.speed * 14;
                    }

                    const k = 300 / star.z;
                    const px = star.x * k + centerX;
                    const py = star.y * k + centerY;

                    if (px >= 0 && px <= width && py >= 0 && py <= height) {
                        const pSize = Math.max(0.1, star.size * k * (isSupernova ? 2.8 : 1));
                        const opacity = Math.min(1, (width - star.z) / width);

                        ctx.fillStyle = star.color;
                        ctx.globalAlpha = Math.max(0, opacity);
                        ctx.beginPath();
                        ctx.arc(px, py, pSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1.0;

                // C. ゴールド・ソーラー・フレア粒子の生成と描画
                if (Math.random() < 0.45 && !isSupernova) {
                    spawnSolarFlare();
                }

                for (let i = solarFlares.length - 1; i >= 0; i--) {
                    let f = solarFlares[i];
                    f.x += f.vx;
                    f.y += f.vy;
                    f.alpha -= f.decay;

                    if (f.alpha <= 0) {
                        solarFlares.splice(i, 1);
                        continue;
                    }

                    ctx.fillStyle = `rgba(253, 224, 71, ${f.alpha})`;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // D. クリック時の神聖な波動（リップル効果）の描画
                for (let i = ripples.length - 1; i >= 0; i--) {
                    let rip = ripples[i];
                    rip.radius += 5.5;
                    rip.alpha -= 0.022;

                    if (rip.alpha <= 0 || rip.radius >= rip.maxRadius) {
                        ripples.splice(i, 1);
                        continue;
                    }

                    ctx.strokeStyle = `rgba(253, 224, 71, ${rip.alpha})`;
                    ctx.lineWidth = 2.0;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#fde047';
                    ctx.beginPath();
                    ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // E. 10〜15秒に一度の不定期な彗星の生成・描画
                cometTimer++;
                if (cometTimer > 700 && Math.random() < 0.02) {
                    spawnComet();
                    cometTimer = 0;
                }

                for (let i = comets.length - 1; i >= 0; i--) {
                    let c = comets[i];
                    c.x += c.vx;
                    c.y += c.vy;
                    c.alpha -= 0.008;

                    if (c.alpha <= 0 || c.x < 0 || c.y > height) {
                        comets.splice(i, 1);
                        continue;
                    }

                    const cometGrad = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 15, c.y - c.vy * 15);
                    cometGrad.addColorStop(0, `rgba(255, 255, 255, ${c.alpha})`);
                    cometGrad.addColorStop(0.5, `rgba(253, 224, 71, ${c.alpha * 0.7})`);
                    cometGrad.addColorStop(1, 'transparent');

                    ctx.strokeStyle = cometGrad;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(c.x, c.y);
                    ctx.lineTo(c.x - c.vx * 12, c.y - c.vy * 12);
                    ctx.stroke();
                }

                requestAnimationFrame(animateUniverse);
            }
            animateUniverse();

            // --- 4. 3Dマウスパララックス効果（マウス＆スマホジャイロ） ---
            let mouseX = 0;
            let mouseY = 0;
            let currentX = 0;
            let currentY = 0;

            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null && e.beta !== null) {
                    mouseX = Math.max(-1, Math.min(1, e.gamma / 30));
                    mouseY = Math.max(-1, Math.min(1, e.beta / 30));
                }
            });

            function updateParallax() {
                currentX += (mouseX - currentX) * 0.08;
                currentY += (mouseY - currentY) * 0.08;

                const header = document.getElementById('headerArea');
                const magicCore = document.getElementById('magicCore');
                const footer = document.getElementById('footerArea');
                const planetLayer = document.getElementById('planetLayer');

                container.style.transform = `rotateY(${currentX * 3.5}deg) rotateX(${-currentY * 3.5}deg)`;
                if(header) header.style.transform = `translate(${currentX * 18}px, ${currentY * 18}px)`;
                if(planetLayer) planetLayer.style.transform = `translate(${currentX * 8}px, ${currentY * 8}px)`;
                if(magicCore) magicCore.style.transform = `translate(${-currentX * 22}px, ${-currentY * 22}px) scale(1)`;
                if(footer) footer.style.transform = `translate(${currentX * 12}px, ${currentY * 12}px)`;

                requestAnimationFrame(updateParallax);
            }
            updateParallax();

            // --- 5. 超新星爆発（ホワイトアウト）連動トリガー ---
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // リップルと重複させないためのバブリング停止
                if (isSupernova) return;
                isSupernova = true;
                container.classList.add('is-triggered');

                setTimeout(() => {
                    console.log("超新星爆発：ゲーム本編へ遷移します");
                    // window.location.href = "game_main.html";
                }, 1500);
            });
        });
    </script>
</body>
