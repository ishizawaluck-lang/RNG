<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL - RNG RESONANCE</title>
    <!-- Google Fonts: Cinzel & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            perspective: 1200px;
            overflow: hidden;
            padding: 35px 40px;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: opacity 1.5s ease-in-out;
        }

        /* === 1. 漆黒の背景 ＆ コズミック・ゴールド・オーロラ === */
        .deep-space-bg {
            position: absolute;
            inset: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 50% 50%, rgba(20, 15, 5, 0.8) 0%, #000000 75%);
            z-index: 1;
            pointer-events: none;
        }

        .cosmic-aurora {
            position: absolute;
            inset: -20%;
            width: 140%;
            height: 140%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.22;
            filter: blur(80px);
            background: 
                radial-gradient(circle at 15% 30%, rgba(245, 158, 11, 0.4) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(253, 224, 71, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(217, 119, 6, 0.3) 0%, transparent 50%);
            transition: background 0.8s ease, opacity 0.8s ease;
        }

        /* 2秒前フライング演出時のオーロラ発狂モード */
        .cosmic-aurora.ultra-rare-frenzy {
            opacity: 0.75;
            filter: blur(50px);
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 85, 0.7) 0%, transparent 55%),
                radial-gradient(circle at 80% 70%, rgba(253, 224, 71, 0.85) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.75) 0%, transparent 60%);
            animation: auroraFrenzy 0.35s ease-in-out infinite alternate !important;
        }

        @keyframes auroraFrenzy {
            0% { transform: scale(1) translate(-2%, 2%) rotate(0deg); }
            100% { transform: scale(1.15) translate(2%, -2%) rotate(5deg); }
        }

        @keyframes auroraShift {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.08) translate(-3%, 2%) rotate(3deg); }
            100% { transform: scale(0.95) translate(3%, -2%) rotate(-3deg); }
        }

        /* === 2. Canvas描画レイヤー（星屑・星雲・ソーラーフレア） === */
        #universe-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* === 3. 惑星レイヤー === */
        .parallax-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4;
            transition: transform 0.1s ease-out;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            overflow: hidden;
        }

        .planet-main {
            top: 12%;
            right: 8%;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle at 30% 30%, #080600 0%, #000000 75%);
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.95), 0 0 25px rgba(253, 224, 71, 0.25), 0 0 5px rgba(255, 255, 255, 0.4);
        }

        .planet-main::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(253, 224, 71, 0.85);
            border-right-color: rgba(255, 255, 255, 0.7);
            animation: planetFlare 6s linear infinite;
        }

        @keyframes planetFlare {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .planet-tail {
            position: absolute;
            top: 15%;
            right: calc(8% + 280px);
            width: 200px;
            height: 35px;
            background: linear-gradient(to left, rgba(253,224,71,0.6), rgba(245,158,11,0.2), transparent);
            transform: rotate(-25deg);
            filter: blur(10px);
            opacity: 0.75;
        }

        .planet-sub {
            bottom: 10%;
            left: 10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 70% 70%, #060500 0%, #000000 80%);
            box-shadow: inset 12px 12px 25px rgba(0,0,0,0.9), 0 0 15px rgba(245, 158, 11, 0.2);
        }

        /* === 4. ホログラム風宇宙ステータスUI === */
        .holo-ui {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            font-weight: 100;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: rgba(253, 224, 71, 0.45);
            z-index: 25;
            pointer-events: none;
        }

        .ui-top-left { top: 25px; left: 35px; }
        .ui-top-right { top: 25px; right: 35px; text-align: right; }
        .ui-bottom-left { bottom: 25px; left: 35px; }
        .ui-bottom-right { bottom: 25px; right: 35px; text-align: right; }

        /* === 5. ヘッダータイトル === */
        .header-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: 5px;
            transition: transform 0.1s ease-out;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 4.5vw, 3.4rem);
            font-weight: 400;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            letter-spacing: 2.2em;
            padding-left: 2.2em;
            animation: titleIntro 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        @keyframes titleIntro {
            0% {
                opacity: 0;
                letter-spacing: 2.2em;
                text-shadow: 0 0 0px rgba(253, 224, 71, 0);
                transform: translateY(-10px);
                filter: blur(12px);
            }
            30% {
                opacity: 0.35;
                text-shadow: -5px 0 #f59e0b, 5px 0 #fde047;
            }
            70% {
                opacity: 0.8;
                text-shadow: 2px 0 rgba(245,158,11,0.7), -2px 0 rgba(253,224,71,0.7);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                letter-spacing: 0.6em;
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 45px rgba(253, 224, 71, 0.6);
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        /* === 6. 巨大太陽魔法陣コア（フレア波動復活版） === */
        .magic-circle-container {
            position: absolute;
            top: 48%;
            left: 50%;
            width: 800px;
            height: 800px;
            margin: -400px 0 0 -400px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            animation: deepPulse 4s ease-in-out infinite;
            transition: transform 0.1s ease-out, opacity 1s ease-in-out;
        }

        @keyframes deepPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .magic-circle-container.frenzy-pulse {
            animation: frenzyPulseCore 0.25s ease-in-out infinite alternate !important;
        }

        @keyframes frenzyPulseCore {
            0% { transform: scale(0.92); }
            100% { transform: scale(1.35); }
        }

        .sun-core {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 25px #ffffff,
                0 0 60px #ffffff,
                0 0 120px #fef08a,
                0 0 220px #f59e0b,
                0 0 350px rgba(245, 158, 11, 0.85);
            z-index: 10;
        }

        .flare-wave-ring {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 1.5px solid rgba(253, 224, 71, 0.55);
            border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
            z-index: 9;
            box-shadow: 0 0 25px rgba(253, 224, 71, 0.35), inset 0 0 25px rgba(245, 158, 11, 0.35);
            animation: flareWaveMorph 8s ease-in-out infinite alternate, rotateClockwise 20s linear infinite;
        }
        .flare-wave-ring:nth-child(2) {
            width: 500px;
            height: 500px;
            border: 1px dashed rgba(245, 158, 11, 0.45);
            border-radius: 60% 40% 45% 55% / 45% 55% 45% 55%;
            animation: flareWaveMorph 12s ease-in-out infinite alternate-reverse, rotateCounter 30s linear infinite;
        }
        .flare-wave-ring:nth-child(3) {
            width: 680px;
            height: 680px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%;
            animation: flareWaveMorph 10s ease-in-out infinite, rotateClockwise 45s linear infinite;
        }

        @keyframes flareWaveMorph {
            0% { transform: scale(0.95) rotate(0deg); border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%; }
            50% { transform: scale(1.05) rotate(180deg); border-radius: 55% 45% 40% 60% / 45% 55% 60% 40%; }
            100% { transform: scale(1) rotate(360deg); border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%; }
        }

        .gravity-wave {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(253, 224, 71, 0.85);
            border-radius: 50%;
            z-index: 9;
            animation: gravityWaveExpand 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        }
        .gravity-wave:nth-child(4) { animation-delay: 1.75s; }

        @keyframes gravityWaveExpand {
            0% { width: 100px; height: 100px; opacity: 1; transform: scale(1); }
            100% { width: 900px; height: 900px; opacity: 0; transform: scale(1.1); border-color: rgba(245, 158, 11, 0.2); }
        }

        .orbit-path {
            position: absolute;
            border: 1px solid rgba(253, 224, 71, 0.2);
            border-radius: 50%;
            z-index: 8;
        }
        .orbit-1 { width: 620px; height: 620px; transform: rotate(25deg); animation: rotateClockwise 25s linear infinite; }
        .orbit-2 { width: 780px; height: 780px; transform: rotate(-35deg); animation: rotateCounter 38s linear infinite; }

        .orbit-satellite {
            position: absolute;
            top: -4px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #fde047;
            border-radius: 50%;
            box-shadow: 0 0 10px #fde047, 0 0 20px #ffffff;
        }

        @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        .inner-rune-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(253, 224, 71, 0.8);
            border-radius: 50%;
            z-index: 7;
            box-shadow: 0 0 25px rgba(253, 224, 71, 0.5);
            animation: runePulseBurst 4s ease-in-out infinite, rotateClockwise 35s linear infinite;
        }

        @keyframes runePulseBurst {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.18) rotate(180deg); opacity: 1; }
        }

        .corona-halo-layer {
            position: absolute;
            inset: -150px;
            z-index: 4;
            pointer-events: none;
            animation: coronaRotate 60s linear infinite;
        }

        .corona-spear {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 1100px;
            background: linear-gradient(to top, transparent, rgba(245,158,11,0.15) 30%, rgba(253,224,71,0.6) 70%, transparent 100%);
            transform-origin: center center;
            transform: translate(-50%, -50%) rotate(var(--corona-rot, 0deg));
            filter: blur(2px);
        }

        @keyframes coronaRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .outer-sigil-system {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            z-index: 5;
            animation: rotateClockwise 70s linear infinite;
        }

        .sigil-wing {
            position: absolute;
            inset: 15px;
            border: 1.5px solid rgba(245, 158, 11, 0.7);
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.35);
        }

        /* === 7. フッター：初期PLAYボタン === */
        .footer-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-bottom: 10px;
            opacity: 0;
            animation: btnFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
            transition: transform 0.1s ease-out, opacity 1s ease-in-out;
        }

        @keyframes btnFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .play-btn {
            font-family: 'Cinzel', serif;
            position: relative;
            display: inline-block;
            padding: 14px 45px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-left: calc(45px + 0.5em);
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(253, 224, 71, 0.9);
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.6);
            letter-spacing: 0.6em;
            transform: translateY(-2px);
        }

        .screen-container.is-triggered {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        /* === 8. ローディング＆本編ゲーム画面 === */
        .loading-screen, .game-main-screen {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 150;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 50px 60px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }

        .loading-screen.active, .game-main-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(253, 224, 71, 0.2);
            border-top-color: rgba(253, 224, 71, 0.9);
            border-radius: 50%;
            animation: spinnerRotate 1s linear infinite;
        }

        @keyframes spinnerRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loading-text {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            color: rgba(255, 255, 255, 0.7);
        }

        .game-main-screen {
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: radial-gradient(circle at 50% 50%, #05050f 0%, #000000 85%);
            padding: 40px;
        }

        .game-welcome-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.2rem, 2.2vw, 1.8rem);
            font-weight: 500;
            letter-spacing: 0.5em;
            color: #fde047;
            text-shadow: 0 0 25px rgba(253, 224, 71, 0.6);
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 160;
        }

        /* === 9. RNGコントロール＆横スクロール・ルーレットシステム === */
        .rng-control-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.8s ease 0.5s;
        }

        .game-main-screen.active .rng-control-panel {
            opacity: 1;
        }

        .rng-btn {
            font-family: 'Cinzel', serif;
            background: rgba(10, 10, 18, 0.85);
            border: 1px solid rgba(253, 224, 71, 0.6);
            color: #fde047;
            padding: 14px 38px;
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(10px);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.2);
            transition: all 0.3s ease;
        }

        .rng-btn:hover:not(:disabled) {
            background: rgba(253, 224, 71, 0.2);
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.6);
            transform: translateY(-2px);
        }

        .rng-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .rng-btn.auto-active {
            background: rgba(245, 158, 11, 0.35);
            border-color: #f59e0b;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.7);
            animation: autoGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes autoGlow {
            0% { box-shadow: 0 0 15px rgba(245,158,11,0.4); }
            100% { box-shadow: 0 0 35px rgba(253,224,71,0.8); }
        }

        /* 横スクロール・ルーレットコンテナ */
        .roulette-viewport {
            position: absolute;
            bottom: 125px;
            left: 50%;
            transform: translateX(-50%);
            width: 680px;
            height: 95px;
            background: rgba(6, 6, 12, 0.82);
            border: 1px solid rgba(253, 224, 71, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 6px;
            overflow: hidden;
            z-index: 195;
            opacity: 0;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(253,224,71,0.1);
            transition: opacity 0.8s ease 0.3s;
        }

        .game-main-screen.active .roulette-viewport {
            opacity: 1;
        }

        /* 中央の照準ターゲットライン */
        .roulette-target-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #fde047;
            box-shadow: 0 0 15px #fde047;
            z-index: 10;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .roulette-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            align-items: center;
            will-change: transform;
        }

        .roulette-card {
            width: 130px;
            height: 75px;
            margin: 0 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
            flex-shrink: 0;
            text-align: center;
        }

        .roulette-card-name {
            font-family: 'Cinzel', serif;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 115px;
        }

        .roulette-card-odds {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.05em;
        }

        /* 当選結果ポップアップ表示 */
        .result-banner {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            text-align: center;
            z-index: 220;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-banner.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .result-sub {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .result-aura-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.6rem, 3.2vw, 2.6rem);
            letter-spacing: 0.3em;
            margin-bottom: 5px;
            text-shadow: 0 0 25px currentColor;
        }

        .result-aura-odds {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.85);
        }

        /* === 10. 左下：コレクション図鑑システム（ロック対応） === */
        .collections-btn-wrapper {
            position: absolute;
            bottom: 40px;
            left: 50px;
            z-index: 180;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
        }

        .game-main-screen.active .collections-btn-wrapper {
            opacity: 1;
            transform: translateY(0);
        }

        .collections-trigger-btn {
            font-family: 'Cinzel', serif;
            background: rgba(10, 10, 15, 0.75);
            border: 1px solid rgba(253, 224, 71, 0.6);
            color: #fde047;
            padding: 12px 28px;
            font-size: 0.75rem;
            letter-spacing: 0.35em;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.25);
            transition: all 0.3s ease;
        }

        .collections-trigger-btn:hover {
            background: rgba(253, 224, 71, 0.18);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(253, 224, 71, 0.5);
            transform: scale(1.03);
        }

        .collections-panel {
            position: absolute;
            top: 85px;
            left: 50px;
            width: 380px;
            height: calc(100vh - 150px);
            background: rgba(8, 8, 14, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);

            // プレイヤーの図鑑ロック状態（true = 解放済み）

            const collectionsListContainer = document.getElementById('collectionsListContainer');
            function renderCollections() {
                collectionsListContainer.innerHTML = '';
                AURAS.forEach(aura => {
                    const isUnlocked = unlockedAuras[aura.id] === true;
                    const item = document.createElement('div');
                    item.className = `rarity-item ${isUnlocked ? '' : 'locked'}`;
                    if (isUnlocked) {
                        item.style.borderLeft = `3px solid ${aura.border}`;

                    item.innerHTML = `<span class="rarity-name" style="color: ${isUnlocked ? aura.color : '#666'};">${isUnlocked ? aura.name : '🔒 ???'}</span>
                                      <span class="rarity-odds-label">1 / ${aura.odds.toLocaleString()}</span>`;
                    collectionsListContainer.appendChild(item);

            }
            renderCollections();

            // --- Web Audio API システム ---
            let audioCtx = null;
            let isAudioInitialized = false;

            function initAudioSystem() {
                if (isAudioInitialized) return;
                isAudioInitialized = true;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const padFreqs = [55.0, 110.0, 164.81, 220.0];
                    padFreqs.forEach(freq => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const filter = audioCtx.createBiquadFilter();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(350, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 4.0);
                        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                        osc.start();
                    });
                } catch (e) { console.log(e); }
            }

            function playChime(pitchMultiplier = 1.0) {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const baseFreqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    const freq = baseFreqs[Math.floor(Math.random() * baseFreqs.length)] * pitchMultiplier;

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.02 * pitchMultiplier, audioCtx.currentTime + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 2.6);
                } catch(e) {}
            }

            window.addEventListener('pointerdown', initAudioSystem, { once: true });

            // --- Canvas演出（星屑・星雲・ソーラーフレア） ---
            const canvas = document.getElementById('universe-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const stars = [];
            for (let i = 0; i < 1500; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * width * 2,
                    y: (Math.random() - 0.5) * height * 2,
                    z: Math.random() * width,
                    size: Math.random() * 1.1 + 0.3,
                    color: Math.random() > 0.75 ? '#fde047' : '#ffffff',
                    speed: Math.random() * 2.0 + 1.0
                });
            }

            let isTransitioning = false;
            let isRolling = false;
            let isAutoRolling = false;
            let autoRollTimer = null;

            function animateUniverse() {
                ctx.clearRect(0, 0, width, height);
                const centerX = width / 2;
                const centerY = height / 2;

                for (let i = 0; i < stars.length; i++) {
                    let star = stars[i];
                    if (!isTransitioning) {
                        star.z -= star.speed;
                        if (star.z <= 0) { star.z = width; star.x = (Math.random() - 0.5) * width * 2; star.y = (Math.random() - 0.5) * height * 2; }
                    } else {
                        star.z -= star.speed * 35;
                        if (star.z <= 0) star.z = 1;
                    }

                    const k = 300 / star.z;
                    const px = star.x * k + centerX;
                    const py = star.y * k + centerY;

                    if (px >= 0 && px <= width && py >= 0 && py <= height) {
                        ctx.fillStyle = star.color;
                        ctx.globalAlpha = Math.min(1, (width - star.z) / width);
                        ctx.beginPath();
                        ctx.arc(px, py, star.size * k * (isTransitioning ? 2.5 : 1), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1.0;
                requestAnimationFrame(animateUniverse);
            }
            animateUniverse();

            // --- マウスパララックス ---
            let mouseX = 0, mouseY = 0, currentX = 0, currentY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            function updateParallax() {
                currentX += (mouseX - currentX) * 0.08;
                currentY += (mouseY - currentY) * 0.08;
                const container = document.getElementById('screenContainer');
                const header = document.getElementById('headerArea');

                if(planetLayer) planetLayer.style.transform = `translate(${currentX * 8}px, ${currentY * 8}px)`;
                if(magicCore && !isTransitioning) magicCore.style.transform = `translate(${-currentX * 22}px, ${-currentY * 22}px) scale(1)`;
                if(footer) footer.style.transform = `translate(${currentX * 12}px, ${currentY * 12}px)`;
                requestAnimationFrame(updateParallax);
            }
            updateParallax();

            const loadingScreen = document.getElementById('loadingScreen');

            // --- RNG ガチャ抽選ロジック（確率計算） ---
            function rollAura() {
                // 累積確率による厳密な抽選
                const totalWeight = AURAS.reduce((sum, a) => sum + (1 / a.odds), 0);
                let rand = Math.random() * totalWeight;
                let cumulative = 0;
                let selected = AURAS[0];

                for (let i = 0; i < AURAS.length; i++) {
                    cumulative += (1 / AURAS[i].odds);
                    if (rand <= cumulative) {
                        selected = AURAS[i];
                        break;
                    }
                }
                return selected;
            }

            // --- 横スクロール・ルーレット実装 ＆ 2秒前フライング演出 ---
            const rollBtn = document.getElementById('rollBtn');
            const autoRollBtn = document.getElementById('autoRollBtn');
            const rouletteTrack = document.getElementById('rouletteTrack');
            const resultBanner = document.getElementById('resultBanner');
            const resultName = document.getElementById('resultName');
            const resultOdds = document.getElementById('resultOdds');
            const cosmicAurora = document.getElementById('cosmicAurora');
            const magicCore = document.getElementById('magicCore');

            function executeRoll() {
                if (isRolling) return;
                isRolling = true;
                rollBtn.disabled = true;
                resultBanner.classList.remove('show');

                // 1. 当選オーラの決定
                const winningAura = rollAura();
                const isUltraRare = winningAura.odds >= 1000; // 1/1000以上の超レア

                // 2. ルーレット用カード列の構築（全40枚、35枚目に当選カードを配置）
                rouletteTrack.innerHTML = '';
                const totalCards = 40;
                const targetIndex = 35;
                const cardsData = [];

                for (let i = 0; i < totalCards; i++) {
                    if (i === targetIndex) {
                        cardsData.push(winningAura);
                    } else {
                        // ダミーカードはランダムに選出
                        cardsData.push(AURAS[Math.floor(Math.random() * 12)]);
                    }
                }

                cardsData.forEach(aura => {
                    const card = document.createElement('div');
                    card.className = 'roulette-card';
                    card.style.borderColor = aura.border;
                    card.innerHTML = `<span class="roulette-card-name" style="color: ${aura.color};">${aura.name}</span>
                                      <span class="roulette-card-odds">1/${aura.odds.toLocaleString()}</span>`;
                    rouletteTrack.appendChild(card);
                });

                // 3. アニメーション計算（1枚のカード幅130px + マージン16px = 146px）
                const cardWidth = 146;
                const viewportCenter = 340; // ルーレット幅680pxの中央
                const targetPosition = (targetIndex * cardWidth) + (cardWidth / 2) - viewportCenter;
                const jitter = (Math.random() - 0.5) * 40; // 微小なズレ
                const finalTranslateX = -(targetPosition + jitter);

                // 初期位置
                rouletteTrack.style.transition = 'none';
                rouletteTrack.style.transform = `translateX(0px)`;
                void rouletteTrack.offsetWidth;

                // 高速回転開始
                const rollDuration = 4.0; // 4秒間回転
                rouletteTrack.style.transition = `transform ${rollDuration}s cubic-bezier(0.08, 0.85, 0.15, 1.0)`;
                rouletteTrack.style.transform = `translateX(${finalTranslateX}px)`;

                // 定期的なチャイム音
                const chimeInterval = setInterval(() => {
                    playChime(1.0);
                }, 120);

                // === 【最重要】レア当選時の「2秒前フライング演出」 ===
                let frenzyTimeout = null;
                if (isUltraRare) {
                    // 停停止の約2秒前（rollDuration - 2.0 = 2.0秒後）に発動
                    frenzyTimeout = setTimeout(() => {
                        cosmicAurora.classList.add('ultra-rare-frenzy');
                        magicCore.classList.add('frenzy-pulse');
                        // ピッチが上がる高揚感音響
                        playChime(1.8);
                        setTimeout(() => playChime(2.2), 300);
                        setTimeout(() => playChime(2.8), 600);
                    }, (rollDuration - 2.0) * 1000);
                }

                // 4. ルーレット停止後の処理
                setTimeout(() => {
                    clearInterval(chimeInterval);
                    if (frenzyTimeout) clearTimeout(frenzyTimeout);

                    // フライング演出解除
                    cosmicAurora.classList.remove('ultra-rare-frenzy');
                    magicCore.classList.remove('frenzy-pulse');

                    // 図鑑ロック解除判定
                    if (!unlockedAuras[winningAura.id]) {
                        unlockedAuras[winningAura.id] = true;
                        renderCollections();
                    }

                    // 結果表示バナー更新
                    resultName.textContent = winningAura.name;
                    resultName.style.color = winningAura.color;
                    resultOdds.textContent = `1 / ${winningAura.odds.toLocaleString()}`;
                    resultBanner.classList.add('show');
                    playChime(3.2);

                    isRolling = false;
                    rollBtn.disabled = false;

                    // AUTO ROLLがONなら1秒後に次をトリガー
                    if (isAutoRolling) {
                        autoRollTimer = setTimeout(() => {
                            if (isAutoRolling) executeRoll();
                        }, 1000);
                    }

                }, rollDuration * 1000);
            }

            rollBtn.addEventListener('click', executeRoll);

            // --- AUTO ROLL 切り替えロジック ---
            autoRollBtn.addEventListener('click', () => {
                isAutoRolling = !isAutoRolling;
                if (isAutoRolling) {
                    autoRollBtn.classList.add('auto-active');
                    autoRollBtn.textContent = 'STOP AUTO';
                    if (!isRolling) executeRoll();
                } else {
                    autoRollBtn.classList.remove('auto-active');
                    autoRollBtn.textContent = 'AUTO ROLL';
                    if (autoRollTimer) clearTimeout(autoRollTimer);
                }
            });

            // --- 左下：図鑑ボード開閉イベント ---
            const collectionsBtn = document.getElementById('collectionsBtn');
            const collectionsPanel = document.getElementById('collectionsPanel');
            const panelCloseBtn = document.getElementById('panelCloseBtn');

            collectionsBtn.addEventListener('click', () => {
                collectionsPanel.classList.toggle('open');
            });
            panelCloseBtn.addEventListener('click', () => {
                collectionsPanel.classList.remove('open');
            });
            window.addEventListener('click', (e) => {
                if (!collectionsPanel.contains(e.target) && !collectionsBtn.contains(e.target)) {
                    collectionsPanel.classList.remove('open');
                }
            });
        });
    </script>
</body>
</html>
