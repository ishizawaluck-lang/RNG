<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LULLABY - COMPLETE HOLOGRAM MINIMALISM</title>
<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --gray-dark: #0a0a0a;
    --gray-mid: #222222;
    --silver: #888888;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-drag: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    background-color: var(--black);
    color: var(--white);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* 📌 1. タイトル画面：流動する3D雲海とライトリーク */
  #title-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, var(--white) 0%, #c5c5c5 35%, var(--black) 100%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1.5s ease-in-out;
    overflow: hidden;
  }
  .cloud-sea {
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.95) 0%, rgba(200,200,200,0.4) 40%, transparent 75%);
    animation: moveClouds 25s linear infinite;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  @keyframes moveClouds {
    0% { transform: scale(1) translate(0, 0) rotate(0deg); }
    50% { transform: scale(1.2) translate(-5%, -5%) rotate(4deg); }
    100% { transform: scale(1) translate(0, 0) rotate(0deg); }
  }
  .light-beam {
    position: absolute;
    top: 0; left: 50%;
    width: 250px; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.85), transparent);
    transform: translateX(-50%) rotate(-12deg);
    animation: beamSway 8s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes beamSway {
    0% { transform: translateX(-55%) rotate(-15deg) scaleX(0.8); opacity: 0.6; }
    100% { transform: translateX(-45%) rotate(-8deg) scaleX(1.3); opacity: 1; }
  }

  .title-logo {
    position: absolute;
    top: 25%;
    font-size: clamp(3.5rem, 8vw, 10rem);
    font-weight: 100;
    color: var(--black);
    letter-spacing: 1.2em;
    z-index: 2;
    animation: titleIntro 2.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
    text-shadow: 0 0 30px rgba(255,255,255,0.8);
    white-space: nowrap;
  }
  @keyframes titleIntro {
    100% { letter-spacing: 0.35em; transform: translateX(0); }
  }

  /* ひし形 PLAY ボタン */
  .play-btn-wrapper {
    position: absolute;
    top: 60%;
    width: 140px; height: 140px;
    transform: rotate(45deg);
    border: 1px solid var(--black);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: transparent;
    z-index: 2;
  }
  .play-btn-wrapper:hover { background: var(--black); }
  .play-btn-text {
    transform: rotate(-45deg);
    font-weight: 100;
    letter-spacing: 0.3em;
    color: var(--black);
    transition: color 0.3s ease;
  }
  .play-btn-wrapper:hover .play-btn-text { color: var(--white); }

  /* 📌 ローディング画面（回転する白い魔法陣） */
  #loading-screen {
    position: absolute; inset: 0;
    background: var(--black);
    z-index: 99;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
    justify-content: center;
    align-items: center;
  }
  .loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .magic-diamond {
    width: 60px; height: 60px;
    border: 1px solid var(--white);
    transform: rotate(45deg);
    animation: spinMagic 2s linear infinite;
  }
  @keyframes spinMagic { 100% { transform: rotate(405deg); } }
  .loading-label {
    font-weight: 100;
    letter-spacing: 0.3em;
    font-size: 0.8rem;
    color: var(--white);
  }

  /* 📌 メインゲーム画面 */
  #main-screen {
    position: absolute; inset: 0;
    z-index: 10;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
  }

  /* 左上固定：SETTINGS & TITLE ペア配置 */
  #top-left-system {
    position: absolute;
    top: 35px; left: 35px;
    display: flex;
    gap: 20px;
    z-index: 25;
  }

  /* メイン画面・ギルド空間共通のひし形アイコンボタンUI群 */
  .holo-btn-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    margin-bottom: 25px;
  }
  .holo-diamond {
    width: 44px; height: 44px;
    transform: rotate(45deg);
    border: 1px solid var(--white);
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
  }
  .holo-btn-wrapper:hover .holo-diamond { background: var(--white); }
  .holo-diamond i {
    transform: rotate(-45deg);
    font-size: 16px;
    color: var(--white);
    transition: color 0.2s ease;
  }
  .holo-btn-wrapper:hover .holo-diamond i { color: var(--black); }
  .holo-text {
    position: absolute;
    top: 52px;
    font-size: 0.6rem;
    font-weight: 100;
    letter-spacing: 0.3em;
    color: var(--white);
    white-space: nowrap;
    pointer-events: none;
  }

  /* Cosmos画面の左側配置群 */
  #cosmos-ui-left {
    position: absolute;
    top: 130px; left: 45px;
    display: flex;
    flex-direction: column;
    gap: 35px;
    z-index: 20;
  }

  /* ギルド空間（Other Side）の4ボタン配置群（中央または右側スマート配置） */
  #guild-ui-container {
    position: absolute;
    top: 130px; left: 45px;
    display: none;
    flex-direction: column;
    gap: 35px;
    z-index: 20;
  }

  /* ROLL ボタン群 */
  #roll-container {
    position: absolute;
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    z-index: 20;
  }
  .roll-btn {
    width: 150px; height: 45px;
    transform: skewX(-15deg);
    border: 1px solid var(--white);
    background: transparent;
    color: var(--white);
    font-weight: 100;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .roll-btn span { transform: skewX(15deg); }
  .roll-btn:hover:not(:disabled) { background: var(--white); color: var(--black); }
  .roll-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ガチャ結果表示 */
  #gacha-display {
    position: absolute;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 15;
  }
  .res-name { font-size: 2.5rem; font-weight: 100; letter-spacing: 0.5em; margin-bottom: 12px; }
  .res-prob { font-size: 0.8rem; font-weight: 100; color: var(--silver); letter-spacing: 0.2em; }

  /* モーダル共通ウィンドウ（ホログラムミニマリズム） */
  .modal-window {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: 480px; max-height: 70vh;
    background: rgba(0, 0, 0, 0.95);
    border: 1px solid var(--white);
    padding: 35px;
    z-index: 60;
    display: none;
    opacity: 0;
    transition: all 0.3s ease;
    overflow-y: auto;
  }
  .modal-window.active {
    display: block; opacity: 1; transform: translate(-50%, -50%) scale(1);
  }
  .modal-title {
    font-size: 0.9rem;
    font-weight: 100;
    letter-spacing: 0.3em;
    border-bottom: 1px solid var(--gray-mid);
    padding-bottom: 12px;
    margin-bottom: 25px;
    text-align: center;
  }
  .close-modal-btn {
    position: absolute; top: 15px; right: 20px;
    cursor: pointer; font-weight: 100; font-size: 1.2rem;
  }
  .list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px dotted var(--gray-mid);
    font-size: 0.8rem;
    font-weight: 100;
    letter-spacing: 0.1em;
  }

  /* 📌 厳格なクラフトボタン（素材不足時完全ロック） */
  .craft-action-btn {
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    padding: 6px 16px;
    font-weight: 100;
    letter-spacing: 0.2em;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .craft-action-btn:hover:not(:disabled) {
    background: var(--white);
    color: var(--black);
  }
  .craft-action-btn:disabled {
    border-color: var(--gray-mid);
    color: var(--gray-mid);
    background: var(--gray-dark);
    cursor: not-allowed;
    opacity: 0.4;
  }

  /* 📌 2. カットシーン・演出オーバーレイ（星型スパイク＋ガラス亀裂＋ネガポジフラッシュ） */
  #cutscene-overlay {
    position: absolute; inset: 0;
    z-index: 90;
    pointer-events: none;
    display: none;
    justify-content: center;
    align-items: center;
  }
  .cs-counter {
    font-size: 4rem; font-weight: 100; letter-spacing: 0.2em; color: var(--white);
    z-index: 92;
  }
  .cs-glass-crack {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 10%, rgba(255,255,255,0.4) 90%);
    opacity: 0;
    z-index: 91;
    transition: opacity 0.1s;
  }
  .cs-star-flare {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 0px; height: 0px;
    background: radial-gradient(circle, var(--white) 0%, transparent 70%);
    z-index: 93;
    opacity: 0;
  }
  .cinematic-holo-frame {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) skewX(-12deg);
    border: 1px solid var(--white);
    padding: 30px 60px;
    background: rgba(0,0,0,0.92);
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 95;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .cinematic-holo-frame span { transform: skewX(12deg); }

  .invert-mode { filter: invert(1); }
  .shake-mode { animation: screenShake 0.07s infinite; }
  @keyframes screenShake {
    0% { transform: translate(0, 0); }
    50% { transform: translate(7px, -7px); }
    100% { transform: translate(-7px, 7px); }
  }
</style>
</head>
<body>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <div class="cloud-sea"></div>
    <div class="light-beam"></div>
    <div class="title-logo">LULLABY</div>
    <div class="play-btn-wrapper" onclick="startApp()">
      <div class="play-btn-text">PLAY</div>
    </div>
  </div>

  <!-- ロード画面 -->
  <div id="loading-screen">
    <div class="loading-container">
      <div class="magic-diamond"></div>
      <div class="loading-label" id="loading-text">LOADING...</div>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="main-screen">
    <canvas id="bg-canvas"></canvas>

    <!-- 左上固定：SETTINGS ＆ TITLE ペア配置 -->
    <div id="top-left-system">
      <div class="holo-btn-wrapper" onclick="openModal('settings-modal')" style="margin-bottom:0;">
        <div class="holo-diamond"><i class="fa-solid fa-gear"></i></div>
        <div class="holo-text">SETTINGS</div>
      </div>
      <div class="holo-btn-wrapper" onclick="returnToTitle()" style="margin-bottom:0;">
        <div class="holo-diamond"><i class="fa-solid fa-house"></i></div>
        <div class="holo-text">TITLE</div>
      </div>
    </div>

    <!-- Cosmos画面左側：BACKPACK ＆ OTHER SIDEボタン -->
    <div id="cosmos-ui-left">
      <div class="holo-btn-wrapper" onclick="openModal('backpack-modal')">
        <div class="holo-diamond"><i class="fa-solid fa-bag-shopping"></i></div>
        <div class="holo-text">BACKPACK</div>
      </div>
      <div class="holo-btn-wrapper" onclick="gotoOtherSide()">
        <div class="holo-diamond"><i class="fa-solid fa-earth-americas"></i></div>
        <div class="holo-text">OTHER SIDE</div>
      </div>
    </div>

    <!-- ギルド空間（Other Side）遷移後に出現する4つのボタン -->
    <div id="guild-ui-container">
      <div class="holo-btn-wrapper" onclick="openModal('library-modal')">
        <div class="holo-diamond"><i class="fa-solid fa-book"></i></div>
        <div class="holo-text">LIBRARY</div>
      </div>
      <div class="holo-btn-wrapper" onclick="openModal('mission-modal')">
        <div class="holo-diamond"><i class="fa-solid fa-scroll"></i></div>
        <div class="holo-text">MISSION</div>
      </div>
      <div class="holo-btn-wrapper" onclick="openModal('craft-modal')">
        <div class="holo-diamond"><i class="fa-solid fa-hammer"></i></div>
        <div class="holo-text">CRAFT</div>
      </div>
      <div class="holo-btn-wrapper" onclick="openModal('shop-modal')">
        <div class="holo-diamond"><i class="fa-solid fa-flask"></i></div>
        <div class="holo-text">SHOP</div>
      </div>
    </div>

    <!-- ガチャ結果表示 -->
    <div id="gacha-display">
      <div class="res-name" id="res-name">---</div>
      <div class="res-prob" id="res-prob">1 / 1</div>
    </div>

    <!-- ROLL ボタン群 -->
    <div id="roll-container">
      <button class="roll-btn" id="btn-roll" onclick="executeRoll()"><span>ROLL</span></button>
      <button class="roll-btn" id="btn-auto" onclick="toggleAutoRoll()"><span>AUTO ROLL</span></button>
    </div>
  </div>

  <!-- モーダル各種 -->
  <div class="modal-window" id="backpack-modal">
    <div class="close-modal-btn" onclick="closeModal('backpack-modal')">✕</div>
    <div class="modal-title">BACKPACK & MATERIALS</div>
    <div id="backpack-list"></div>
  </div>

  <div class="modal-window" id="craft-modal">
    <div class="close-modal-btn" onclick="closeModal('craft-modal')">✕</div>
    <div class="modal-title">CRAFT FORGE</div>
    <div id="craft-list"></div>
  </div>

  <div class="modal-window" id="shop-modal">
    <div class="close-modal-btn" onclick="closeModal('shop-modal')">✕</div>
    <div class="modal-title">ALCHEMY SHOP</div>
    <div id="shop-list"></div>
  </div>

  <div class="modal-window" id="mission-modal">
    <div class="close-modal-btn" onclick="closeModal('mission-modal')">✕</div>
    <div class="modal-title">GUILD MISSIONS</div>
    <div id="mission-list"></div>
  </div>

  <div class="modal-window" id="library-modal">
    <div class="close-modal-btn" onclick="closeModal('library-modal')">✕</div>
    <div class="modal-title">LIBRARY ARCHIVE</div>
    <div id="library-list"></div>
  </div>

  <div class="modal-window" id="settings-modal">
    <div class="close-modal-btn" onclick="closeModal('settings-modal')">✕</div>
    <div class="modal-title">SYSTEM SETTINGS</div>
    <div class="list-row"><span>MASTER VOLUME</span><span>100%</span></div>
    <div class="list-row"><span>GRAPHICS QUALITY</span><span>ULTRA</span></div>
  </div>

  <!-- カットシーンオーバーレイ -->
  <div id="cutscene-overlay">
    <div class="cs-glass-crack" id="cs-crack"></div>
    <div class="cs-star-flare" id="cs-flare"></div>
    <div class="cs-counter" id="cs-counter">1 / 0</div>
    <div class="cinematic-holo-frame" id="cs-frame">
      <span class="res-name" id="cs-name" style="opacity:1; margin-bottom:8px;"></span>
      <span class="res-prob" id="cs-prob" style="opacity:1;"></span>
    </div>
  </div>

<script>
// --- データ定義 ---
const formatNum = (n) => n.toLocaleString();

const AURA_DATA = [];
const normalNames = ["Dust","Stone","Iron","Steel","Silver","Void","Echo","Pulse","Glimmer","Spark","Fade","Drift","Haze","Mist","Shard","Gloom","Dusk","Dawn","Core","Flux","Zenith"];
for(let i=0; i<21; i++){
  AURA_DATA.push({ id: i+1, name: normalNames[i], prob: Math.floor(Math.pow(1.5, i+1) * 2), rarity: 'normal' });
}

const rareNames = [
  "Equinox Balance","END OF TIME","Vortex","Velocity","Cyclone","TRAUMA","OVERTHINKING",
  "memorial overreached","Abyss Gaze","Paradox Shift","Quantum Leap","Singularity",
  "Event Horizon","Stellar Collapse","Absolute Zero","Entropy","Supernova","Black Dwarf",
  "White Hole","Cosmic Web","Dark Matter","Neutrino","Tachyon","Warp Drive","String Theory",
  "Multiverse","Omnipresence","Genesis","Revelation","LULLABY ULTIMA"
];
for(let i=0; i<30; i++){
  let p = 150000 + Math.floor(Math.pow(1.58, i) * 35000);
  if(i === 29) p = 5000000000; // 50億
  AURA_DATA.push({ id: 22+i, name: rareNames[i], prob: p, rarity: 'rare' });
}

// プレイヤーデータ＆インベントリ
const player = {
  inventory: {},
  materials: { 1: 3, 2: 0 }, // 1: Iron Dust (3個), 2: Void Shard (0個によりVoid Bladeは完全にロックされる)
  equipped: { gauntlet: null, rune: null }
};
AURA_DATA.forEach(a => player.inventory[a.id] = 0);

const CRAFT_RECIPES = [
  { id: 'g1', name: 'Astral Gauntlet', type: 'gauntlet', costMatId: 1, costAmount: 2 }, // 所持3個 >= 必要2個（作成可）
  { id: 'g2', name: 'Void Blade', type: 'gauntlet', costMatId: 2, costAmount: 5 }       // 所持0個 < 必要5個（完全ロック）
];

let isRolling = false;
let autoInterval = null;
let luckBuffTimer = 0;

// --- アプリ起動 / タイトル遷移 ---
function startApp() {
  const title = document.getElementById('title-screen');
  title.style.opacity = '0';
  setTimeout(() => {
    title.style.display = 'none';
    showLoader("ENTERING COSMOS...", () => {
      document.getElementById('main-screen').style.display = 'block';
      setTimeout(() => document.getElementById('main-screen').style.opacity = '1', 50);
      initCanvas();
    });
  }, 1000);
}

function returnToTitle() {
  if (autoInterval) toggleAutoRoll();
  cleanupModals();
  showLoader("RETURNING TO TITLE...", () => {
    document.getElementById('main-screen').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('main-screen').style.display = 'none';
      const title = document.getElementById('title-screen');
      title.style.display = 'flex';
      setTimeout(() => title.style.opacity = '1', 50);
    }, 1000);
  });
}

function showLoader(text, callback) {
  const loader = document.getElementById('loading-screen');
  document.getElementById('loading-text').innerText = text;
  loader.style.display = 'flex';
  setTimeout(() => loader.style.opacity = '1', 50);

  setTimeout(() => {
    loader.style.opacity = '0';
    setTimeout(() => {
      loader.style.display = 'none';
      if(callback) callback();
    }, 1000);
  }, 3000);
}

// --- Other Side（ギルド世界）への世界切り替え ---
function gotoOtherSide() {
  if (autoInterval) toggleAutoRoll();
  cleanupModals();
  showLoader("ENTERING OTHER SIDE...", () => {
    // Cosmos側のUIを非表示にし、ギルド空間の4ボタンUIを顕現
    document.getElementById('cosmos-ui-left').style.display = 'none';
    document.getElementById('roll-container').style.display = 'none';
    document.getElementById('gacha-display').style.display = 'none';
    document.getElementById('guild-ui-container').style.display = 'flex';
  });
}

// タイトルへ戻る際やOther SideでCosmosに戻る場合の初期化
function cleanupModals() {
  document.querySelectorAll('.modal-window').forEach(m => m.classList.remove('active'));
}

// --- モーダル制御 ＆ 各種機能レンダリング ---
function openModal(id) {
  cleanupModals();
  if(id === 'backpack-modal') renderBackpack();
  if(id === 'craft-modal') renderCraft();
  if(id === 'shop-modal') renderShop();
  if(id === 'mission-modal') renderMissions();
  if(id === 'library-modal') renderLibrary();
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function renderBackpack() {
  const list = document.getElementById('backpack-list');
  list.innerHTML = '';
  for(let mId in player.materials) {
    const mName = AURA_DATA.find(a => a.id == mId)?.name || `Material #${mId}`;
    list.innerHTML += `<div class="list-row"><span>[MAT] ${mName}</span><span>x${player.materials[mId]}</span></div>`;
  }
  AURA_DATA.forEach(a => {
    if(player.inventory[a.id] > 0) {
      list.innerHTML += `<div class="list-row"><span>${a.name}</span><span>x${player.inventory[a.id]}</span></div>`;
    }
  });
}

// 📌 厳格な素材判定と無効化ロック付きクラフト
function renderCraft() {
  const list = document.getElementById('craft-list');
  list.innerHTML = '';
  CRAFT_RECIPES.forEach(recipe => {
    const matCount = player.materials[recipe.costMatId] || 0;
    const hasEnough = matCount >= recipe.costAmount;
    const matName = AURA_DATA.find(a => a.id == recipe.costMatId)?.name || 'Material';

    list.innerHTML += `
      <div class="list-row">
        <div>
          <div>${recipe.name}</div>
          <div style="font-size:0.65rem; color:var(--silver); margin-top:4px;">Req: ${matName} (${matCount}/${recipe.costAmount})</div>
        </div>
        <button class="craft-action-btn" ${hasEnough ? '' : 'disabled'} onclick="executeCraft('${recipe.id}')">CRAFT</button>
      </div>
    `;
  });
}

function executeCraft(recipeId) {
  const recipe = CRAFT_RECIPES.find(r => r.id === recipeId);
  const matCount = player.materials[recipe.costMatId] || 0;

  if(matCount >= recipe.costAmount) {
    player.materials[recipe.costMatId] -= recipe.costAmount;
    player.equipped[recipe.type] = recipe.name;
    alert(`Successfully forged ${recipe.name}! Equipped.`);
    renderCraft();
  } else {
    alert("Materials are insufficient.");
  }
}

function renderShop() {
  const list = document.getElementById('shop-list');
  list.innerHTML = `
    <div class="list-row"><span>Luck Elixir (+50% Rate / 60s)</span><button class="craft-action-btn" onclick="buyBuff()">BUY (1 Iron)</button></div>
    <div class="list-row"><span>Status: ${luckBuffTimer > 0 ? 'ACTIVE ('+luckBuffTimer+'s)' : 'STANDBY'}</span><span></span></div>
  `;
}
function buyBuff() {
  if((player.materials[1] || 0) >= 1) {
    player.materials[1]--;
    luckBuffTimer = 60;
    alert("Luck Elixir activated!");
    renderShop();
    const timer = setInterval(() => {
      luckBuffTimer--;
      if(luckBuffTimer <= 0) clearInterval(timer);
    }, 1000);
  } else {
    alert("Not enough Iron Dust.");
  }
}

function renderMissions() {
  const list = document.getElementById('mission-list');
  list.innerHTML = `
    <div class="list-row"><span>Hunt 10 Void Echoes</span><button class="craft-action-btn" onclick="alert('Mission completed!')">CLAIM</button></div>
    <div class="list-row"><span>Ascend to the Zenith</span><button class="craft-action-btn" disabled>LOCKED</button></div>
  `;
}

function renderLibrary() {
  const list = document.getElementById('library-list');
  list.innerHTML = '';
  AURA_DATA.slice(0, 15).forEach(a => {
    list.innerHTML += `<div class="list-row"><span>${a.name}</span><span>1 / ${formatNum(a.prob)}</span></div>`;
  });
}

// --- ガチャ抽選ロジック ---
const getTotalWeight = () => AURA_DATA.reduce((sum, a) => sum + (1 / (a.prob / (luckBuffTimer > 0 ? 1.5 : 1))), 0);
const rollAura = () => {
  const tw = getTotalWeight();
  let r = Math.random() * tw;
  for(let a of AURA_DATA) {
    r -= (1 / (a.prob / (luckBuffTimer > 0 ? 1.5 : 1)));
    if(r <= 0) return a;
  }
  return AURA_DATA[0];
};

function executeRoll() {
  if (isRolling) return;
  isRolling = true;
  document.getElementById('btn-roll').disabled = true;

  setTimeout(() => {
    const aura = rollAura();
    player.inventory[aura.id]++;
    if(Math.random() < 0.35) player.materials[1]++;

    if (aura.prob >= 150000) {
      playCutscene(aura);
    } else {
      showGachaResult(aura);
      isRolling = false;
      document.getElementById('btn-roll').disabled = false;
    }
  }, 350);
}

function showGachaResult(aura) {
  document.getElementById('res-name').innerText = aura.name;
  document.getElementById('res-prob').innerText = `1 / ${formatNum(aura.prob)}`;
}

function toggleAutoRoll() {
  const btn = document.getElementById('btn-auto');
  if (autoInterval) {
    clearInterval(autoInterval);
    autoInterval = null;
    btn.style.background = 'transparent';
    btn.style.color = 'var(--white)';
  } else {
    btn.style.background = 'var(--white)';
    btn.style.color = 'var(--black)';
    autoInterval = setInterval(() => {
      if(!isRolling) executeRoll();
    }, 500);
  }
}

// 📌 2. 究極進化カットシーン演出（星型スパイク＋ガラス亀裂＋ネガポジフラッシュ）
function playCutscene(aura) {
  const overlay = document.getElementById('cutscene-overlay');
  const counter = document.getElementById('cs-counter');
  const crack = document.getElementById('cs-crack');
  const flare = document.getElementById('cs-flare');
  const frame = document.getElementById('cs-frame');

  overlay.style.display = 'flex';
  counter.style.display = 'block';
  frame.style.display = 'none';
  counter.innerText = '1 / 0';
  crack.style.opacity = '0';
  flare.style.opacity = '0';

  let current = 0;
  let target = aura.prob;
  let start = performance.now();

  function countAnim(time) {
    let prog = Math.min((time - start) / 2200, 1);
    current = Math.floor(Math.pow(prog, 4) * target);
    counter.innerText = `1 / ${formatNum(current)}`;

    if(prog < 1) {
      requestAnimationFrame(countAnim);
    } else {
      counter.innerText = `1 / ${formatNum(target)}`;
      
      // 刹那の爆発＆ガラス亀裂＆ネガポジフラッシュ発動
      crack.style.opacity = '1';
      flare.style.opacity = '1';
      flare.style.width = '300px';
      flare.style.height = '300px';
      document.body.classList.add('invert-mode', 'shake-mode');

      setTimeout(() => {
        document.body.style.background = 'var(--white)';
        setTimeout(() => document.body.style.background = 'var(--black)', 100);
      }, 50);

      setTimeout(() => {
        counter.style.display = 'none';
        crack.style.opacity = '0';
        flare.style.opacity = '0';
        document.body.classList.remove('invert-mode', 'shake-mode');

        document.getElementById('cs-name').innerText = aura.name;
        document.getElementById('cs-prob').innerText = `1 / ${formatNum(aura.prob)}`;
        frame.style.display = 'flex';
        setTimeout(() => frame.style.opacity = '1', 50);

        setTimeout(() => {
          frame.style.opacity = '0';
          setTimeout(() => {
            frame.style.display = 'none';
            overlay.style.display = 'none';
            showGachaResult(aura);
            isRolling = false;
            document.getElementById('btn-roll').disabled = false;
          }, 400);
        }, 3000);
      }, 1400);
    }
  }
  requestAnimationFrame(countAnim);
}

// --- 背景Canvasパーティクル ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function initCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];
  for(let i=0; i<400; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      size: Math.random() * 1.8
    });
  }
  loopCanvas();
}

function loopCanvas() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffffff';
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
    if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(loopCanvas);
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
