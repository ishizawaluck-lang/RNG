<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL</title>
    <!-- Google Fonts: Syncopate & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: radial-gradient(circle at center, #080412 0%, #000000 75%);
            perspective: 1200px;
            overflow: hidden;
            padding: 40px 0;
        }

        /* === 漆黒の背景 ＆ 星々の超高速「吸い込み」アニメーション === */
        .deep-space-bg {
            position: absolute;
            inset: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 50% 50%, rgba(15, 8, 30, 0.9) 0%, transparent 60%);
            opacity: 0.6;
            filter: blur(90px);
            z-index: 1;
            pointer-events: none;
        }

        /* 何百個もの星々が中心へ吸い込まれるパーティクルコンテナ */
        .stars-container {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 2px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: starWarp 2.5s linear infinite;
        }

        /* ランダムな位置から中心へ吸い込まれる軌道を作成（一部を例示して大量展開） */
        .star:nth-child(1)  { transform: rotate(15deg) translateX(300px); animation-delay: 0.1s; width: 1.5px; height: 1.5px; }
        .star:nth-child(2)  { transform: rotate(45deg) translateX(450px); animation-delay: 0.5s; background: #fde047; }
        .star:nth-child(3)  { transform: rotate(72deg) translateX(250px); animation-delay: 0.2s; width: 2.5px; height: 2.5px; }
        .star:nth-child(4)  { transform: rotate(105deg) translateX(550px); animation-delay: 0.8s; }
        .star:nth-child(5)  { transform: rotate(130deg) translateX(380px); animation-delay: 0.3s; background: #38bdf8; }
        .star:nth-child(6)  { transform: rotate(165deg) translateX(500px); animation-delay: 1.1s; }
        .star:nth-child(7)  { transform: rotate(190deg) translateX(320px); animation-delay: 0.4s; width: 2px; height: 2px; }
        .star:nth-child(8)  { transform: rotate(220deg) translateX(480px); animation-delay: 0.7s; background: #fde047; }
        .star:nth-child(9)  { transform: rotate(255deg) translateX(280px); animation-delay: 0.2s; }
        .star:nth-child(10) { transform: rotate(285deg) translateX(520px); animation-delay: 0.9s; width: 3px; height: 3px; }
        .star:nth-child(11) { transform: rotate(315deg) translateX(350px); animation-delay: 0.6s; background: #ffffff; }
        .star:nth-child(12) { transform: rotate(340deg) translateX(420px); animation-delay: 1.2s; }
        .star:nth-child(13) { transform: rotate(30deg) translateX(490px); animation-delay: 1.0s; }
        .star:nth-child(14) { transform: rotate(88deg) translateX(330px); animation-delay: 0.3s; background: #38bdf8; }
        .star:nth-child(15) { transform: rotate(145deg) translateX(460px); animation-delay: 0.7s; }
        .star:nth-child(16) { transform: rotate(210deg) translateX(390px); animation-delay: 0.5s; width: 2.5px; height: 2.5px; }

        @keyframes starWarp {
            0% {
                transform: rotate(var(--rot, 0deg)) translateX(550px) scale(0.3);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: rotate(var(--rot, 0deg)) translateX(10px) scale(2.2);
                opacity: 0;
            }
        }

        /* === 惑星（逆光エッジ ＆ ソーラー・フレア光波） === */
        .planet {
            position: absolute;
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .planet-main {
            top: 12%;
            right: 8%;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle at 30% 30%, #06060a 0%, #000000 75%);
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.95), 0 0 25px rgba(253, 224, 71, 0.2), 0 0 5px rgba(255, 255, 255, 0.4);
        }

        /* エッジを走る光の波（ソーラー・フレア） */
        .planet-main::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(253, 224, 71, 0.8);
            border-right-color: rgba(255, 255, 255, 0.8);
            animation: planetFlare 6s linear infinite;
        }

        @keyframes planetFlare {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .planet-sub {
            bottom: 10%;
            left: 10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 70% 70%, #040408 0%, #000000 80%);
            box-shadow: inset 12px 12px 25px rgba(0,0,0,0.9), 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* === 1. 中心の光（魔法陣コア）の圧倒的巨大化 ＆ 生命的鼓動 === */
        .magic-circle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            margin: -400px 0 0 -400px;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            animation: deepPulse 4s ease-in-out infinite;
        }

        @keyframes deepPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); } /* ドクンと拡張する鼓動 */
        }

        /* 巨大化した純白コア */
        .sun-core {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 
                0 0 25px #ffffff,
                0 0 60px #ffffff,
                0 0 120px #fef08a,
                0 0 220px #f59e0b,
                0 0 350px rgba(245, 158, 11, 0.8),
                0 0 500px rgba(217, 70, 239, 0.4);
            z-index: 10;
        }

        /* ① 重力波の波紋（グラビティ・リング） */
        .gravity-wave {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(253, 224, 71, 0.8);
            border-radius: 50%;
            z-index: 9;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.5), inset 0 0 20px rgba(253, 224, 71, 0.5);
            animation: gravityWaveExpand 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        }

        .gravity-wave:nth-child(2) {
            animation-delay: 1.75s; /* 波紋のタイミングをズラす */
        }

        @keyframes gravityWaveExpand {
            0% {
                width: 100px;
                height: 100px;
                opacity: 1;
                transform: scale(1);
            }
            100% {
                width: 750px;
                height: 750px;
                opacity: 0;
                transform: scale(1.1);
                border-color: rgba(56, 189, 248, 0.2);
            }
        }

        .inner-rune-ring {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 1px solid rgba(253, 224, 71, 0.7);
            border-radius: 50%;
            z-index: 8;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
            animation: rotateClockwise 35s linear infinite;
        }

        .inner-rune-ring::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(253,224,71,0.25) 0deg 15deg, transparent 15deg 30deg);
        }

        /* 画面端まで突き刺さる超ロング光の槍 */
        .sun-spikes-layer {
            position: absolute;
            inset: 0;
            z-index: 7;
            animation: rotateCounter 55s linear infinite;
        }

        .spike {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 420px;
            background: linear-gradient(to top, transparent, rgba(255,255,255,0.9), #fde047, transparent);
            transform-origin: top center;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        .spike:nth-child(n) { transform: rotate(calc(n * 20deg)) translateY(-50%); }

        .outer-sigil-system {
            position: absolute;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            z-index: 6;
            animation: rotateClockwise 70s linear infinite;
        }

        .sigil-wing {
            position: absolute;
            inset: 15px;
            border: 1.5px solid rgba(245, 158, 11, 0.6);
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3), inset 0 0 30px rgba(245, 158, 11, 0.3);
        }

        .sigil-wing::before {
            content: '';
            position: absolute;
            inset: -40px;
            border: 1px solid rgba(253, 224, 71, 0.4);
            border-radius: 60% 40% 50% 50% / 40% 60% 50% 50%;
            transform: rotate(25deg);
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* === 4. ヘッダー ＆ フッター（調和されたホログラム UI） === */
        .header-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: 10px;
        }

        .game-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 100;
            letter-spacing: 0.65em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 40px rgba(253, 224, 71, 0.4);
            padding-left: 0.65em;
        }

        .footer-area {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-bottom: 25px;
        }

        .play-btn {
            font-family: 'Syncopate', sans-serif;
            position: relative;
            display: inline-block;
            padding: 14px 45px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.5em;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            animation: btnPulse 3s ease-in-out infinite alternate;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-left: calc(45px + 0.5em);
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(253, 224, 71, 0.9);
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.6), inset 0 0 15px rgba(253, 224, 71, 0.3);
            letter-spacing: 0.6em;
            transform: translateY(-2px);
        }

        @keyframes btnPulse {
            0% {
                border-color: rgba(255, 255, 255, 0.25);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            }
            100% {
                border-color: rgba(253, 224, 71, 0.7);
                box-shadow: 0 0 25px rgba(253, 224, 71, 0.35);
            }
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- 漆黒の背景と星々の超高速吸い込みパーティクル -->
        <div class="deep-space-bg"></div>
        <div class="stars-container">
            <div class="star" style="--rot: 15deg;"></div>
            <div class="star" style="--rot: 45deg;"></div>
            <div class="star" style="--rot: 72deg;"></div>
            <div class="star" style="--rot: 105deg;"></div>
            <div class="star" style="--rot: 130deg;"></div>
            <div class="star" style="--rot: 165deg;"></div>
            <div class="star" style="--rot: 190deg;"></div>
            <div class="star" style="--rot: 220deg;"></div>
            <div class="star" style="--rot: 255deg;"></div>
            <div class="star" style="--rot: 285deg;"></div>
            <div class="star" style="--rot: 315deg;"></div>
            <div class="star" style="--rot: 340deg;"></div>
            <div class="star" style="--rot: 30deg;"></div>
            <div class="star" style="--rot: 88deg;"></div>
            <div class="star" style="--rot: 145deg;"></div>
            <div class="star" style="--rot: 210deg;"></div>
        </div>

        <!-- 逆光の惑星シルエット（ソーラー・フレア付き） -->
        <div class="planet planet-main"></div>
        <div class="planet planet-sub"></div>

        <!-- ヘッダー：極細タイトル -->
        <header class="header-area">
            <h1 class="game-title">ASTRAL</h1>
        </header>

        <!-- 巨大化した神聖太陽魔法陣コア ＆ 重力波波紋 -->
        <div class="magic-circle-container">
            <div class="gravity-wave"></div>
            <div class="gravity-wave"></div>
            <div class="outer-sigil-system">
                <div class="sigil-wing"></div>
            </div>
            <div class="sun-spikes-layer">
                <div class="spike" style="transform: rotate(0deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(18deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(36deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(54deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(72deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(90deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(108deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(126deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(144deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(162deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(180deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(198deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(216deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(234deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(252deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(270deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(288deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(306deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(324deg) translateY(-50%);"></div>
                <div class="spike" style="transform: rotate(342deg) translateY(-50%);"></div>
            </div>
            <div class="inner-rune-ring"></div>
            <div class="sun-core"></div>
        </div>

        <!-- フッター：ミニマルPLAYボタン -->
        <footer class="footer-area">
            <button class="play-btn">PLAY</button>
        </footer>
    </div>

</body>
</html>
